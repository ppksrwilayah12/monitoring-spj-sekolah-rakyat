<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>E-Book Interaktif – Pedoman Monitoring SPJ Sekolah Rakyat</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    button {
      font-family: inherit;
    }


    /* =========================================================
       APP
    ========================================================= */

    .app {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      padding:
        clamp(10px, 1.5vw, 24px)
        clamp(8px, 1vw, 20px)
        clamp(14px, 1.5vw, 24px);
    }


    /* =========================================================
       VIEWER WRAPPER
    ========================================================= */

    .viewer-wrapper {
      width: min(100%, 1500px);

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 14px;
    }


    /* =========================================================
       BOOK STAGE – DESKTOP
    ========================================================= */

    .book-stage {
      position: relative;

      width: min(96vw, 1500px);

      aspect-ratio: 1536 / 993;

      isolation: isolate;

      overflow: hidden;

      flex-shrink: 0;
    }


    /* =========================================================
       PDF CLIP AREA – DESKTOP
    ========================================================= */

    .pdf-clip {
      position: absolute;

      left: 6.5%;
      right: 6.5%;

      top: 5.7%;
      bottom: 5.8%;

      overflow: hidden;

      z-index: 1;

      background: #ffffff;
    }


    /* =========================================================
       PDF SPREAD
    ========================================================= */

    .pdf-spread {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: stretch;
      justify-content: center;

      overflow: hidden;

      background: #ffffff;
    }


    /* =========================================================
       PDF PAGE
    ========================================================= */

    .pdf-page {
      position: relative;

      width: 50%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #ffffff;
    }


    /* =========================================================
       CANVAS
    ========================================================= */

    .pdf-page canvas {
      display: block;

      position: absolute;

      max-width: none;
      max-height: none;
    }


    /* =========================================================
       BOOK FRAME ASSET – DESKTOP
    ========================================================= */

    .book-frame {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: fill;

      z-index: 10;

      pointer-events: none;

      user-select: none;

      -webkit-user-drag: none;
    }


    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 20;

      background: rgba(255, 255, 255, 0.92);

      transition: opacity 0.3s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-box {
      padding: 16px 24px;

      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);

      font-size: 14px;

      color: #1e3a5f;
    }


    /* =========================================================
       ERROR
    ========================================================= */

    .error-box {
      display: none;

      position: absolute;

      inset: 0;

      z-index: 30;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(255, 255, 255, 0.96);

      text-align: center;
    }

    .error-box.active {
      display: flex;
    }

    .error-content {
      max-width: 500px;

      padding: 25px;

      border: 1px solid #fecaca;
      border-radius: 14px;

      background: #fff1f2;

      color: #991b1b;
    }

    .error-content h3 {
      margin-bottom: 10px;
    }

    .error-content p {
      font-size: 14px;
      line-height: 1.6;
    }


    /* =========================================================
       CONTROLS
    ========================================================= */

    .controls {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      padding: 8px 12px;

      border-radius: 999px;

      background: #2f5785;

      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);

      user-select: none;

      flex-wrap: nowrap;
    }


    .control-btn {
      width: 36px;
      height: 36px;

      border: none;
      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      background: rgba(255, 255, 255, 0.12);

      color: #ffffff;

      font-size: 17px;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .control-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }


    /* =========================================================
       PAGE INFO
    ========================================================= */

    .page-info {
      min-width: 105px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 6px;

      color: #ffffff;

      font-size: 14px;
      font-weight: 600;

      white-space: nowrap;
    }

    .page-input {
      width: 42px;
      height: 30px;

      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 15px;

      background: rgba(255, 255, 255, 0.08);

      color: #ffffff;

      text-align: center;

      outline: none;

      font-size: 14px;
    }

    .page-input::-webkit-inner-spin-button,
    .page-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .page-input {
      appearance: textfield;
      -moz-appearance: textfield;
    }


    /* =========================================================
       MOBILE
       
       1 HALAMAN
       TANPA FRAME ASSET
       HANYA PDF
    ========================================================= */

    @media (max-width: 768px) {

      html,
      body {
        background: #ffffff;
      }

      .app {
        min-height: 100vh;

        justify-content: flex-start;

        padding: 10px 8px 18px;

        background: #ffffff;
      }

      .viewer-wrapper {
        width: 100%;
        gap: 12px;
      }


      /* ---------------------------------------------
         BOOK STAGE MENJADI AREA PDF SAJA
      --------------------------------------------- */

      .book-stage {
        width: 100%;

        /*
          Rasio akan disesuaikan oleh JavaScript
          berdasarkan ukuran halaman PDF.
        */

        aspect-ratio: auto;

        height: auto;

        min-height: 0;

        overflow: hidden;

        background: #ffffff;
      }


      /* ---------------------------------------------
         PDF CLIP FULL AREA
      --------------------------------------------- */

      .pdf-clip {
        position: relative;

        left: auto;
        right: auto;
        top: auto;
        bottom: auto;

        width: 100%;
        height: auto;

        overflow: hidden;

        background: #ffffff;
      }


      /* ---------------------------------------------
         HANYA SATU HALAMAN
      --------------------------------------------- */

      .pdf-spread {
        width: 100%;
        height: auto;

        display: block;

        overflow: hidden;

        background: #ffffff;
      }


      .pdf-page {
        width: 100%;
        height: auto;

        display: none;

        overflow: hidden;

        background: #ffffff;
      }


      /* Halaman kiri menjadi halaman aktif */

      #pageLeft {
        display: block;
      }


      /* Halaman kanan disembunyikan */

      #pageRight {
        display: none !important;
      }


      /* ---------------------------------------------
         CANVAS MOBILE
      --------------------------------------------- */

      .pdf-page canvas {
        position: relative !important;

        left: auto !important;
        top: auto !important;

        display: block;

        width: 100% !important;
        height: auto !important;

        transform: none !important;
      }


      /* ---------------------------------------------
         HILANGKAN FRAME ASSET
      --------------------------------------------- */

      .book-frame {
        display: none !important;
      }


      /* ---------------------------------------------
         LOADING / ERROR
      --------------------------------------------- */

      .loading,
      .error-box {
        position: absolute;
      }


      /* ---------------------------------------------
         CONTROLS MOBILE
      --------------------------------------------- */

      .controls {
        gap: 5px;

        padding: 7px 9px;

        max-width: 100%;
      }

      .control-btn {
        width: 34px;
        height: 34px;

        font-size: 16px;
      }

      .page-info {
        min-width: 92px;

        font-size: 12px;
      }

      .page-input {
        width: 40px;
        height: 28px;
      }

    }


    /* =========================================================
       SMALL MOBILE
    ========================================================= */

    @media (max-width: 380px) {

      .controls {
        gap: 3px;

        padding: 6px 7px;
      }

      .control-btn {
        width: 31px;
        height: 31px;

        font-size: 14px;
      }

      .page-info {
        min-width: 82px;
      }

      .page-input {
        width: 36px;
      }

    }


    /* =========================================================
       FULLSCREEN
    ========================================================= */

    .book-stage:fullscreen {
      width: 100vw;
      height: 100vh;

      max-width: none;

      background: #ffffff;
    }

    .book-stage:fullscreen .pdf-clip {
      width: 100%;
      height: 100%;
    }

    .book-stage:fullscreen .pdf-spread {
      height: 100%;
    }

    .book-stage:fullscreen .pdf-page {
      height: 100%;
    }


    @media (min-width: 769px) {

      .book-stage:fullscreen {
        aspect-ratio: 1536 / 993;
      }

      .book-stage:fullscreen .pdf-clip {
        position: absolute;

        left: 6.5%;
        right: 6.5%;

        top: 5.7%;
        bottom: 5.8%;

        width: auto;
        height: auto;
      }

    }

  </style>
</head>

<body>

  <main class="app">

    <div class="viewer-wrapper">


      <!-- =====================================================
           BOOK
      ====================================================== -->

      <section
        class="book-stage"
        id="bookStage"
      >


        <!-- ===================================================
             PDF AREA
        ==================================================== -->

        <div class="pdf-clip">

          <div class="pdf-spread">

            <div
              class="pdf-page"
              id="pageLeft"
            >
              <canvas id="canvasLeft"></canvas>
            </div>


            <div
              class="pdf-page"
              id="pageRight"
            >
              <canvas id="canvasRight"></canvas>
            </div>

          </div>

        </div>


        <!-- ===================================================
             FRAME ASSET
             
             OTOMATIS DISEMBUNYIKAN DI MOBILE
        ==================================================== -->

        <img
          src="assets/book-frame.png"
          alt=""
          class="book-frame"
          id="bookFrame"
        />


        <!-- ===================================================
             LOADING
        ==================================================== -->

        <div
          class="loading"
          id="loading"
        >

          <div class="loading-box">
            E-book sedang dimuat...
          </div>

        </div>


        <!-- ===================================================
             ERROR
        ==================================================== -->

        <div
          class="error-box"
          id="errorBox"
        >

          <div class="error-content">

            <h3>E-book tidak dapat dimuat</h3>

            <p id="errorMessage">
              Terjadi kesalahan saat memuat file PDF.
            </p>

          </div>

        </div>

      </section>


      <!-- =====================================================
           CONTROLS
      ====================================================== -->

      <nav class="controls">


        <!-- PREVIOUS -->

        <button
          class="control-btn"
          id="prevBtn"
          type="button"
          title="Halaman sebelumnya"
          aria-label="Halaman sebelumnya"
        >
          ‹
        </button>


        <!-- PAGE NUMBER -->

        <div class="page-info">

          <input
            type="number"
            id="pageInput"
            class="page-input"
            value="1"
            min="1"
          />

          <span id="pageRange">
            / 0
          </span>

        </div>


        <!-- NEXT -->

        <button
          class="control-btn"
          id="nextBtn"
          type="button"
          title="Halaman berikutnya"
          aria-label="Halaman berikutnya"
        >
          ›
        </button>


        <!-- ZOOM OUT -->

        <button
          class="control-btn"
          id="zoomOutBtn"
          type="button"
          title="Perkecil tampilan"
          aria-label="Perkecil tampilan"
        >
          −
        </button>


        <!-- ZOOM IN -->

        <button
          class="control-btn"
          id="zoomInBtn"
          type="button"
          title="Perbesar tampilan"
          aria-label="Perbesar tampilan"
        >
          +
        </button>


        <!-- FULLSCREEN -->

        <button
          class="control-btn"
          id="fullscreenBtn"
          type="button"
          title="Layar penuh"
          aria-label="Layar penuh"
        >
          ⛶
        </button>

      </nav>

    </div>

  </main>


  <script>

    /* =========================================================
       KONFIGURASI FILE
    ========================================================= */

    const PDF_URL =
      "./Draft_Ebook_Rima_Lea_optimized.pdf";


    /* =========================================================
       PDF.JS CONFIG
    ========================================================= */

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const loading =
      document.getElementById("loading");

    const errorBox =
      document.getElementById("errorBox");

    const errorMessage =
      document.getElementById("errorMessage");


    const canvasLeft =
      document.getElementById("canvasLeft");

    const canvasRight =
      document.getElementById("canvasRight");


    const pageLeft =
      document.getElementById("pageLeft");

    const pageRight =
      document.getElementById("pageRight");


    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");


    const pageInput =
      document.getElementById("pageInput");

    const pageRange =
      document.getElementById("pageRange");


    const zoomInBtn =
      document.getElementById("zoomInBtn");

    const zoomOutBtn =
      document.getElementById("zoomOutBtn");


    const fullscreenBtn =
      document.getElementById("fullscreenBtn");


    const bookStage =
      document.getElementById("bookStage");


    /* =========================================================
       STATE
    ========================================================= */

    let pdfDoc = null;

    let currentPage = 1;

    let totalPages = 0;

    let zoomLevel = 1;

    let rendering = false;

    let pendingRender = false;


    /* =========================================================
       DETEKSI MOBILE
    ========================================================= */

    function isMobile() {

      return window.matchMedia(
        "(max-width: 768px)"
      ).matches;

    }


    /* =========================================================
       LOAD PDF
    ========================================================= */

    async function loadPDF() {

      try {

        loading.classList.remove("hidden");

        errorBox.classList.remove("active");


        const loadingTask =
          pdfjsLib.getDocument(PDF_URL);


        pdfDoc =
          await loadingTask.promise;


        totalPages =
          pdfDoc.numPages;


        pageInput.max =
          totalPages;


        pageRange.textContent =
          `/ ${totalPages}`;


        currentPage = 1;


        await renderBook();


        loading.classList.add("hidden");

      }

      catch (error) {

        console.error(
          "PDF Load Error:",
          error
        );


        loading.classList.add("hidden");


        errorBox.classList.add("active");


        errorMessage.textContent =
          "File PDF tidak dapat dimuat. Pastikan nama file PDF adalah Draft_Ebook_Rima_Lea_optimized.pdf dan berada pada folder yang sama dengan index.html.";

      }

    }


    /* =========================================================
       RENDER PAGE
    ========================================================= */

    async function renderPage(
      pageNumber,
      canvas,
      container,
      mobileMode
    ) {

      if (
        !pdfDoc ||
        pageNumber < 1 ||
        pageNumber > totalPages
      ) {

        canvas.width = 1;
        canvas.height = 1;

        canvas.style.display =
          "none";

        return;

      }


      canvas.style.display =
        "block";


      const page =
        await pdfDoc.getPage(
          pageNumber
        );


      const baseViewport =
        page.getViewport({
          scale: 1
        });


      /* =====================================================
         MOBILE

         PDF ditampilkan proporsional.
         Lebar mengikuti layar.
      ====================================================== */

      if (mobileMode) {

        const availableWidth =
          container.clientWidth;


        const scale =
          (
            availableWidth /
            baseViewport.width
          )
          * zoomLevel;


        const viewport =
          page.getViewport({
            scale: scale
          });


        const outputScale =
          Math.min(
            window.devicePixelRatio || 1,
            2
          );


        canvas.width =
          Math.floor(
            viewport.width *
            outputScale
          );


        canvas.height =
          Math.floor(
            viewport.height *
            outputScale
          );


        canvas.style.width =
          `${viewport.width}px`;


        canvas.style.height =
          `${viewport.height}px`;


        const context =
          canvas.getContext(
            "2d",
            {
              alpha: false
            }
          );


        context.setTransform(
          outputScale,
          0,
          0,
          outputScale,
          0,
          0
        );


        await page.render({

          canvasContext:
            context,

          viewport:
            viewport,

          transform: [

            outputScale,
            0,
            0,
            outputScale,
            0,
            0

          ]

        }).promise;


        /*
          Sesuaikan tinggi stage
          dengan tinggi PDF.
        */

        bookStage.style.height =
          `${viewport.height}px`;

        return;

      }


      /* =====================================================
         DESKTOP

         PDF memenuhi area frame.
      ====================================================== */

      const containerWidth =
        container.clientWidth;


      const containerHeight =
        container.clientHeight;


      const scaleX =
        containerWidth /
        baseViewport.width;


      const scaleY =
        containerHeight /
        baseViewport.height;


      /*
        MAX digunakan agar halaman
        memenuhi area dan sedikit
        dipotong di tepi oleh frame.
      */

      const scale =
        Math.max(
          scaleX,
          scaleY
        )
        * zoomLevel;


      const viewport =
        page.getViewport({
          scale: scale
        });


      const outputScale =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );


      canvas.width =
        Math.floor(
          viewport.width *
          outputScale
        );


      canvas.height =
        Math.floor(
          viewport.height *
          outputScale
        );


      canvas.style.width =
        `${viewport.width}px`;


      canvas.style.height =
        `${viewport.height}px`;


      const offsetX =
        (
          containerWidth -
          viewport.width
        ) / 2;


      const offsetY =
        (
          containerHeight -
          viewport.height
        ) / 2;


      canvas.style.position =
        "absolute";


      canvas.style.left =
        `${offsetX}px`;


      canvas.style.top =
        `${offsetY}px`;


      const context =
        canvas.getContext(
          "2d",
          {
            alpha: false
          }
        );


      context.setTransform(
        outputScale,
        0,
        0,
        outputScale,
        0,
        0
      );


      await page.render({

        canvasContext:
          context,

        viewport:
          viewport,

        transform: [

          outputScale,
          0,
          0,
          outputScale,
          0,
          0

        ]

      }).promise;

    }


    /* =========================================================
       RENDER BOOK
    ========================================================= */

    async function renderBook() {

      if (!pdfDoc) {
        return;
      }


      if (rendering) {

        pendingRender = true;

        return;

      }


      rendering = true;


      try {

        const mobileMode =
          isMobile();


        /* =====================================================
           MOBILE – 1 HALAMAN
        ====================================================== */

        if (mobileMode) {

          /*
            Reset tinggi otomatis
            sebelum render.
          */

          bookStage.style.height =
            "auto";


          /*
            Render halaman aktif
            pada canvas kiri.
          */

          await renderPage(

            currentPage,

            canvasLeft,

            pageLeft,

            true

          );


          /*
            Halaman kanan tidak digunakan.
          */

          canvasRight.style.display =
            "none";


          pageInput.value =
            currentPage;


          updateControls();

          return;

        }


        /* =====================================================
           DESKTOP – 2 HALAMAN
        ====================================================== */

        bookStage.style.height =
          "";


        const leftPageNumber =
          currentPage;


        const rightPageNumber =
          currentPage + 1;


        await Promise.all([

          renderPage(

            leftPageNumber,

            canvasLeft,

            pageLeft,

            false

          ),


          renderPage(

            rightPageNumber,

            canvasRight,

            pageRight,

            false

          )

        ]);


        pageInput.value =
          currentPage;


        updateControls();

      }

      catch (error) {

        console.error(
          "Render Error:",
          error
        );

      }

      finally {

        rendering = false;


        if (pendingRender) {

          pendingRender = false;

          renderBook();

        }

      }

    }


    /* =========================================================
       UPDATE CONTROLS
    ========================================================= */

    function updateControls() {

      prevBtn.disabled =
        currentPage <= 1;


      if (isMobile()) {

        nextBtn.disabled =
          currentPage >= totalPages;

      }

      else {

        nextBtn.disabled =
          currentPage + 2 > totalPages;

      }

    }


    /* =========================================================
       NEXT PAGE
    ========================================================= */

    nextBtn.addEventListener(

      "click",

      () => {

        if (isMobile()) {

          if (
            currentPage < totalPages
          ) {

            currentPage += 1;

            renderBook();

          }

        }

        else {

          if (
            currentPage + 2 <= totalPages
          ) {

            currentPage += 2;

            renderBook();

          }

        }

      }

    );


    /* =========================================================
       PREVIOUS PAGE
    ========================================================= */

    prevBtn.addEventListener(

      "click",

      () => {

        if (isMobile()) {

          if (
            currentPage > 1
          ) {

            currentPage -= 1;

            renderBook();

          }

        }

        else {

          if (
            currentPage - 2 >= 1
          ) {

            currentPage -= 2;

            renderBook();

          }

        }

      }

    );


    /* =========================================================
       PAGE INPUT
    ========================================================= */

    pageInput.addEventListener(

      "change",

      () => {

        let value =
          parseInt(
            pageInput.value,
            10
          );


        if (
          Number.isNaN(value)
        ) {

          value = 1;

        }


        value =
          Math.max(
            1,
            Math.min(
              value,
              totalPages
            )
          );


        /*
          Desktop harus dimulai
          dari halaman ganjil.
        */

        if (
          !isMobile() &&
          value % 2 === 0
        ) {

          value -= 1;

        }


        currentPage =
          value;


        renderBook();

      }

    );


    /* =========================================================
       ZOOM IN
    ========================================================= */

    zoomInBtn.addEventListener(

      "click",

      () => {

        zoomLevel =
          Math.min(
            zoomLevel + 0.05,
            1.25
          );


        renderBook();

      }

    );


    /* =========================================================
       ZOOM OUT
    ========================================================= */

    zoomOutBtn.addEventListener(

      "click",

      () => {

        zoomLevel =
          Math.max(
            zoomLevel - 0.05,
            0.90
          );


        renderBook();

      }

    );


    /* =========================================================
       FULLSCREEN
    ========================================================= */

    fullscreenBtn.addEventListener(

      "click",

      async () => {

        try {

          if (
            !document.fullscreenElement
          ) {

            await bookStage.requestFullscreen();

          }

          else {

            await document.exitFullscreen();

          }

        }

        catch (error) {

          console.error(
            "Fullscreen Error:",
            error
          );

        }

      }

    );


    /* =========================================================
       FULLSCREEN CHANGE
    ========================================================= */

    document.addEventListener(

      "fullscreenchange",

      () => {

        setTimeout(
          () => {

            renderBook();

          },
          150
        );

      }

    );


    /* =========================================================
       RESIZE
    ========================================================= */

    let resizeTimer =
      null;


    window.addEventListener(

      "resize",

      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(

            () => {

              renderBook();

            },

            300

          );

      }

    );


    /* =========================================================
       KEYBOARD NAVIGATION
    ========================================================= */

    window.addEventListener(

      "keydown",

      event => {

        if (
          event.key === "ArrowRight"
        ) {

          if (
            !nextBtn.disabled
          ) {

            nextBtn.click();

          }

        }


        if (
          event.key === "ArrowLeft"
        ) {

          if (
            !prevBtn.disabled
          ) {

            prevBtn.click();

          }

        }

      }

    );


    /* =========================================================
       START
    ========================================================= */

    loadPDF();

  </script>

</body>
</html>
