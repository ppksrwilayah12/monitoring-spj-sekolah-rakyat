<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-book Interaktif – Pedoman Monitoring SPJ</title>

<style>
:root{
  --navy:#17365d;
  --blue:#245b91;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#20242a;
  font-family:Arial,Helvetica,sans-serif;
}

#viewer{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:10px;
  perspective:1800px;
}

#pageStage{
  position:relative;
  flex:none;
  transform-style:preserve-3d;
  transform-origin:center center;
}

#pageWrap{
  position:relative;
  background:#fff;
  line-height:0;
  box-shadow:0 5px 24px #0005;
  overflow:hidden;
  backface-visibility:hidden;
  transform-style:preserve-3d;
  transform-origin:left center;
  will-change:transform,opacity,filter;
}

#pdfCanvas{
  display:block;
  max-width:none;
  height:auto;
}

/* FORM UPLOAD HALAMAN 13 */
#formOverlay{
  display:none;
  position:absolute;
  left:5.7%;
  top:10.5%;
  width:88.6%;
  height:84.5%;
  z-index:3;
  border:0;
  background:transparent;
  overflow:hidden;
}

#formOverlay.active{
  display:block;
}

#formFrame{
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  display:block;
  overflow:hidden;
}

/* TOMBOL DOWNLOAD HALAMAN 18 */
#downloadOverlay{
  position:absolute;
  top:8%;
  left:50%;
  transform:translateX(-50%);
  width:76%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  z-index:4;
  line-height:normal;
}

.download-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:10px 16px;
  background:#0757c9;
  color:#ffffff;
  text-decoration:none;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  text-align:center;
  box-shadow:0 3px 8px rgba(7,87,201,.20);
  transition:all .2s ease;
}

.download-btn:hover{
  background:#0649a8;
  transform:translateY(-2px);
}

/* TOOLBAR */
#toolbar{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:10;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border-radius:12px;
  background:rgba(30,38,48,.76);
  backdrop-filter:blur(8px);
  color:#fff;
  line-height:1;
  box-shadow:0 2px 12px #0003;
}

#toolbar button{
  border:0;
  border-radius:6px;
  background:transparent;
  color:#fff;
  padding:7px 9px;
  font-size:18px;
  cursor:pointer;
}

#toolbar button:hover{
  background:#ffffff25;
}

#toolbar button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

#pageNum{
  width:44px;
  padding:6px 4px;
  text-align:center;
  border:1px solid #ffffff55;
  border-radius:5px;
  background:#ffffff20;
  color:#fff;
}

#pageStatus{
  font-size:12px;
  white-space:nowrap;
}

#message{
  color:#17365d;
  background:white;
  padding:22px;
  border-radius:8px;
  max-width:600px;
  font:14px/1.5 Arial,sans-serif;
}

#loading{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#20242a88;
  color:#fff;
  z-index:8;
  font-size:13px;
}

#loading.show{
  display:flex;
}

/* ANIMASI HALAMAN */
@keyframes pageTurnNext{
  0%{
    opacity:.35;
    transform:perspective(1400px) rotateY(-24deg) translateX(52px) scale(.985);
    filter:brightness(.72);
  }
  45%{
    opacity:.9;
    transform:perspective(1400px) rotateY(7deg) translateX(-8px) scale(.995);
    filter:brightness(1.08);
  }
  100%{
    opacity:1;
    transform:perspective(1400px) rotateY(0) translateX(0) scale(1);
    filter:brightness(1);
  }
}

@keyframes pageTurnPrev{
  0%{
    opacity:.35;
    transform:perspective(1400px) rotateY(24deg) translateX(-52px) scale(.985);
    filter:brightness(.72);
  }
  45%{
    opacity:.9;
    transform:perspective(1400px) rotateY(-7deg) translateX(8px) scale(.995);
    filter:brightness(1.08);
  }
  100%{
    opacity:1;
    transform:perspective(1400px) rotateY(0) translateX(0) scale(1);
    filter:brightness(1);
  }
}

#pageWrap.turn-next{
  animation:pageTurnNext .72s cubic-bezier(.2,.75,.25,1) both;
}

#pageWrap.turn-prev{
  animation:pageTurnPrev .72s cubic-bezier(.2,.75,.25,1) both;
}

/* ================================
   RESPONSIVE TOMBOL DOWNLOAD
   ================================ */

/* LAPTOP / LAYAR MENENGAH */
@media (min-width: 601px) and (max-width: 1366px){

  #downloadOverlay{
    width:70%;
    top:8%;
    gap:10px;
  }

  .download-btn{
    min-height:32px;
    padding:7px 12px;
    font-size:10px;
    border-radius:6px;
  }
}


/* MOBILE */
@media(max-width:600px){

  #viewer{
    padding:2px;
  }

  #toolbar{
    bottom:6px;
    gap:3px;
    padding:5px 7px;
  }

  #toolbar button{
    padding:6px;
    font-size:16px;
  }

  #formOverlay{
    left:3%;
    width:94%;
    top:10%;
    height:85%;
  }

  /* Tombol download pada halaman checklist */
  #downloadOverlay{
    width:88%;
    top:7.5%;
    gap:6px;
  }

  .download-btn{
    min-height:30px;
    padding:6px 7px;
    font-size:8px;
    line-height:1.2;
    border-radius:5px;
  }
}



/* FlipHTML-like page curl powered by StPageFlip */
#viewer{
  padding:24px 3vw 88px;
  background:radial-gradient(ellipse at center,#49698f 0%,#263c5b 58%,#14243a 100%);
}
#bookShell{
  position:relative;
  width:min(94vw,1500px);
  height:min(78vh,980px);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  filter:drop-shadow(0 24px 28px rgba(0,0,0,.42));
}
#flipBook{
  margin:auto;
}
#flipBook .page{
  background:#fff;
  overflow:hidden;
  position:relative;
  box-shadow:inset 0 0 12px rgba(25,45,70,.10);
}
#flipBook .page canvas{
  display:block;
  width:100%;
  height:100%;
}
#flipBook .page-content{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
}
#flipBook .page-cover{
  background:linear-gradient(135deg,#17365d,#245b91);
  color:white;
}
#flipBook .page-overlay{
  position:absolute;
  z-index:5;
}
#flipBook .form-overlay{
  left:5.7%;top:10.5%;width:88.6%;height:84.5%;
  border:0;background:transparent;overflow:hidden;
}
#flipBook .form-overlay iframe{
  width:100%;height:100%;border:0;background:transparent;display:block;
}
#flipBook .download-overlay{
  top:8%;left:5%;width:90%;
  display:flex;justify-content:center;align-items:center;gap:10px;
  line-height:normal;flex-wrap:wrap;
}
#flipBook .download-btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:34px;padding:8px 12px;background:#0757c9;color:#fff;
  text-decoration:none;border-radius:7px;font:700 11px Arial,sans-serif;
  text-align:center;box-shadow:0 3px 8px rgba(7,87,201,.2);
}
#toolbar{
  background:rgba(13,35,63,.9);border:1px solid #ffffff35;
  box-shadow:0 8px 28px #0005;padding:9px 14px;gap:9px;
}
#toolbar button{border-radius:8px}
#pageNum{background:#ffffff20}
#loading{z-index:30}
@media(max-width:700px){
  #viewer{padding:8px 3px 78px}
  #bookShell{width:98vw;height:78vh}
  #toolbar{max-width:97vw;gap:2px;padding:5px 6px}
  #toolbar button{padding:5px;font-size:15px}
  #pageStatus{font-size:10px}
  #flipBook .download-overlay{top:7%;gap:5px}
  #flipBook .download-btn{font-size:8px;padding:6px}
}

</style>
</head>

<body>

<div id="viewer"><div id="message">E-book sedang dimuat…</div></div>

<div id="loading">Membuka halaman…</div>

<div id="toolbar" aria-label="Navigasi e-book">
  <button id="prev" type="button" title="Halaman sebelumnya">‹</button>
  <input id="pageNum" type="number" min="1" value="1">
  <span id="pageStatus">/ 31</span>
  <button id="next" type="button" title="Halaman berikutnya">›</button>
  <button id="zoomOut" type="button" title="Perkecil">−</button>
  <button id="zoomIn" type="button" title="Perbesar">+</button>
  <button id="fullscreen" type="button" title="Layar penuh">⛶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<script>

/* KONFIGURASI FILE */
const PDF_URL='./Draft_Ebook_Rima_Lea_optimized.pdf';
const FORM_URL='https://script.google.com/macros/s/AKfycbw9HnoBDY_ta8zLam3T2tK5758b3kGou-kjzuVXFD7Afhle8LrHKdb3dXTPHWgnjqGc/exec';
const CHECKLIST_FILE='./Format_Checklist.docx';
const BUKTI_BERKAS_FILE='./Format_Bukti_Pengumpulan_berkas.docx';

const pdfjsLib=window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc=null;
let pageFlip=null;
let currentPage=1;
let zoom=1;
let renderCache=new Map();
const MAX_CACHE=8;

const viewer=document.getElementById('viewer');
const pageInput=document.getElementById('pageNum');
const pageStatus=document.getElementById('pageStatus');
const loading=document.getElementById('loading');
const isMobile=()=>window.matchMedia('(max-width:700px)').matches;

function cacheKey(n,w){return `${n}-${Math.round(w)}`;}

async function renderPdfPage(n, targetWidth){
  const key=cacheKey(n,targetWidth);
  if(renderCache.has(key)) return renderCache.get(key);
  const page=await pdfDoc.getPage(n);
  const base=page.getViewport({scale:1});
  const scale=targetWidth/base.width;
  const viewport=page.getViewport({scale});
  const ratio=Math.min(window.devicePixelRatio||1,1.5);
  const canvas=document.createElement('canvas');
  canvas.width=Math.ceil(viewport.width*ratio);
  canvas.height=Math.ceil(viewport.height*ratio);
  canvas.style.width='100%';
  canvas.style.height='100%';
  await page.render({
    canvasContext:canvas.getContext('2d',{alpha:false}),
    viewport,
    transform:ratio!==1?[ratio,0,0,ratio,0,0]:null
  }).promise;
  renderCache.set(key,canvas);
  while(renderCache.size>MAX_CACHE){
    const first=renderCache.keys().next().value;
    const old=renderCache.get(first);
    old.width=0; old.height=0;
    renderCache.delete(first);
  }
  return canvas;
}

function addOverlay(pageEl,n){
  if(n===13){
    const overlay=document.createElement('div');
    overlay.className='page-overlay form-overlay';
    const frame=document.createElement('iframe');
    frame.src=FORM_URL;
    frame.title='Formulir Pengumpulan Dokumen SPJ';
    frame.setAttribute('scrolling','no');
    overlay.appendChild(frame);
    pageEl.appendChild(overlay);
  }
  if(n===18){
    const overlay=document.createElement('div');
    overlay.className='page-overlay download-overlay';
    const a=document.createElement('a');
    a.href=CHECKLIST_FILE;a.download='Format_Checklist.docx';
    a.className='download-btn';a.textContent='↓ Download Format Checklist';
    const b=document.createElement('a');
    b.href=BUKTI_BERKAS_FILE;b.download='Format_Bukti_Pengumpulan_berkas.docx';
    b.className='download-btn';b.textContent='↓ Download Format Bukti Pengumpulan Berkas';
    overlay.append(a,b);
    pageEl.appendChild(overlay);
  }
}

async function buildBook(){
  loading.classList.add('show');
  try{
    pdfDoc=await pdfjsLib.getDocument({url:PDF_URL}).promise;
    const viewerW=Math.max(320,viewer.clientWidth-30);
    const viewerH=Math.max(360,viewer.clientHeight-30);
    const first=await pdfDoc.getPage(1);
    const base=first.getViewport({scale:1});
    const mobile=isMobile();
    const pageW=Math.floor(Math.min(mobile?viewerW:viewerW/2, (viewerH*base.width/base.height)));
    const pageH=Math.floor(pageW*base.height/base.width);

    const shell=document.createElement('div');
    shell.id='bookShell';
    const book=document.createElement('div');
    book.id='flipBook';
    shell.appendChild(book);
    viewer.replaceChildren(shell);

    const pages=[];
    for(let n=1;n<=pdfDoc.numPages;n++){
      const page=document.createElement('div');
      page.className='page';
      const content=document.createElement('div');
      content.className='page-content';
      const canvas=await renderPdfPage(n,pageW);
      const visible=document.createElement('canvas');
      visible.width=canvas.width;visible.height=canvas.height;
      visible.style.width='100%';visible.style.height='100%';
      visible.getContext('2d',{alpha:false}).drawImage(canvas,0,0);
      content.appendChild(visible);
      addOverlay(content,n);
      page.appendChild(content);
      pages.push(page);
    }

    pageFlip=new St.PageFlip(book,{
      width:pageW,
      height:pageH,
      size:'stretch',
      minWidth:260,
      maxWidth:pageW,
      minHeight:340,
      maxHeight:pageH,
      maxShadowOpacity:0.42,
      showCover:false,
      mobileScrollSupport:false,
      usePortrait:mobile,
      drawShadow:true,
      flippingTime:950,
      startPage:0,
      autoSize:true,
      clickEventForward:true,
      useMouseEvents:true,
      swipeDistance:30,
      showPageCorners:true,
      disableFlipByClick:false
    });
    pageFlip.loadFromHTML(pages);
    pageFlip.on('flip',e=>{
      currentPage=e.data+1;
      pageInput.value=currentPage;
      const total=pdfDoc.numPages;
      const visible=pageFlip.getOrientation()==='landscape'
        ? `${currentPage}–${Math.min(currentPage+1,total)}`
        : `${currentPage}`;
      pageStatus.textContent=`${visible} / ${total}`;
      document.getElementById('prev').disabled=currentPage<=1;
      document.getElementById('next').disabled=currentPage>=total-1;
    });
    currentPage=1;
    pageInput.value=1;
    pageInput.max=pdfDoc.numPages;
    pageStatus.textContent=`1–2 / ${pdfDoc.numPages}`;
    document.getElementById('prev').disabled=true;
    document.getElementById('next').disabled=false;
  }catch(err){
    viewer.innerHTML='<div id="message"><strong>E-book belum dapat dimuat.</strong><br>Periksa koneksi internet, file PDF, dan library flipbook.</div>';
    console.error(err);
  }finally{
    loading.classList.remove('show');
  }
}

document.getElementById('prev').onclick=()=>pageFlip?.flipPrev();
document.getElementById('next').onclick=()=>pageFlip?.flipNext();
pageInput.onchange=()=>{
  const n=Math.max(1,Math.min(pdfDoc?.numPages||1,Number(pageInput.value)||1));
  pageFlip?.turnToPage(n-1);
};
document.getElementById('zoomIn').onclick=()=>{
  zoom=Math.min(1.35,zoom+.1);
  const shell=document.getElementById('bookShell');
  if(shell) shell.style.transform=`scale(${zoom})`;
};
document.getElementById('zoomOut').onclick=()=>{
  zoom=Math.max(.75,zoom-.1);
  const shell=document.getElementById('bookShell');
  if(shell) shell.style.transform=`scale(${zoom})`;
};
document.getElementById('fullscreen').onclick=()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};
let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>location.reload(),350);
});
document.addEventListener('keydown',e=>{
  if(e.target===pageInput)return;
  if(e.key==='ArrowRight')pageFlip?.flipNext();
  if(e.key==='ArrowLeft')pageFlip?.flipPrev();
});
buildBook();

</script>

</body>
</html>
