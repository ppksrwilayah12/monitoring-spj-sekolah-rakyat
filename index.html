<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>E-Book Interaktif – Pedoman Monitoring SPJ</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #142b48;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* =========================
       HALAMAN UTAMA
    ========================= */

    .ebook-app {
      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    /* =========================
       BOOK STAGE
    ========================= */

    .book-stage {
      position: relative;

      width: min(96vw, 1500px);
      aspect-ratio: 1.54 / 1;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* =========================
       PDF AREA
    ========================= */

    .pdf-area {
      position: absolute;

      /*
        PDF sengaja dibuat lebih kecil
        agar ketebalan halaman/frame
        tetap terlihat
      */
      left: 5.8%;
      right: 5.8%;
      top: 4.8%;
      bottom: 6.5%;

      overflow: hidden;

      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spread {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .page-wrapper {
      width: 50%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    canvas {
      display: block;

      max-width: 100%;
      max-height: 100%;

      width: auto;
      height: auto;
    }

    /* =========================
       FRAME OVERLAY
    ========================= */

    .book-frame {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      z-index: 10;

      pointer-events: none;

      user-select: none;
    }

    /* =========================
       SPINE / TENGAH BUKU
    ========================= */

    .book-spine {
      position: absolute;

      top: 4.5%;
      bottom: 5.5%;

      left: 50%;

      width: 30px;

      transform: translateX(-50%);

      z-index: 11;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,0.15),
          rgba(255,255,255,0.22) 25%,
          rgba(0,0,0,0.28) 50%,
          rgba(255,255,255,0.15) 75%,
          rgba(0,0,0,0.12)
        );

      filter: blur(1px);

      opacity: 0.85;
    }

    /* =========================
       CONTROL BAR
    ========================= */

    .controls {
      position: absolute;

      bottom: -52px;

      left: 50%;
      transform: translateX(-50%);

      z-index: 20;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px 14px;

      border-radius: 30px;

      background: rgba(30, 70, 115, 0.88);

      backdrop-filter: blur(10px);

      box-shadow:
        0 8px 20px rgba(0,0,0,0.25);
    }

    .controls button {
      width: 34px;
      height: 34px;

      border: none;
      border-radius: 50%;

      cursor: pointer;

      color: white;

      background: rgba(255,255,255,0.12);

      font-size: 16px;

      transition: 0.2s ease;
    }

    .controls button:hover {
      transform: scale(1.08);
      background: rgba(255,255,255,0.25);
    }

    .page-info {
      min-width: 80px;

      text-align: center;

      color: white;

      font-size: 14px;
      font-weight: bold;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {

      body {
        overflow-y: auto;
      }

      .ebook-app {
        justify-content: flex-start;
        padding-top: 40px;
      }

      .book-stage {
        width: 100vw;
        aspect-ratio: 1.54 / 1;
      }

      .pdf-area {
        left: 5.8%;
        right: 5.8%;
        top: 5%;
        bottom: 7%;
      }

      .book-spine {
        width: 16px;
      }

      .controls {
        bottom: -55px;

        transform: translateX(-50%) scale(0.85);
      }
    }

  </style>
</head>

<body>

  <main class="ebook-app">

    <div class="book-stage">

      <!-- =====================
           PDF / EBOOK
      ====================== -->

      <div class="pdf-area">

        <div class="spread">

          <div class="page-wrapper">
            <canvas id="canvas-left"></canvas>
          </div>

          <div class="page-wrapper">
            <canvas id="canvas-right"></canvas>
          </div>

        </div>

      </div>


      <!-- =====================
           FRAME BUKU
      ====================== -->

      <img
        src="assets/book-frame.png"
        class="book-frame"
        alt="Book Frame"
      />


      <!-- =====================
           SPINE
      ====================== -->

      <div class="book-spine"></div>


      <!-- =====================
           CONTROLS
      ====================== -->

      <div class="controls">

        <button id="prevBtn" title="Halaman Sebelumnya">
          ‹
        </button>

        <div class="page-info" id="pageInfo">
          1–2 / ...
        </div>

        <button id="nextBtn" title="Halaman Berikutnya">
          ›
        </button>

        <button id="zoomOut" title="Perkecil">
          −
        </button>

        <button id="zoomIn" title="Perbesar">
          +
        </button>

        <button id="fullscreenBtn" title="Fullscreen">
          ⛶
        </button>

      </div>

    </div>

  </main>


  <script>

    /* =========================
       PDF.JS CONFIG
    ========================= */

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    /* =========================
       FILE PDF
    ========================= */

    const PDF_URL = "Draft_Ebook_Rima_Lea_optimized.pdf";


    let pdfDoc = null;

    let currentPage = 1;

    let zoom = 1;

    const leftCanvas =
      document.getElementById("canvas-left");

    const rightCanvas =
      document.getElementById("canvas-right");


    /* =========================
       LOAD PDF
    ========================= */

    async function loadPDF() {

      try {

        pdfDoc =
          await pdfjsLib.getDocument(PDF_URL).promise;

        renderSpread();

      }

      catch (error) {

        console.error(error);

        alert(
          "PDF tidak dapat dimuat. Periksa nama dan lokasi file PDF."
        );

      }

    }


    /* =========================
       RENDER PAGE
    ========================= */

    async function renderPage(
      pageNumber,
      canvas,
      container
    ) {

      if (
        pageNumber < 1 ||
        pageNumber > pdfDoc.numPages
      ) {

        const ctx = canvas.getContext("2d");

        canvas.width = 1;
        canvas.height = 1;

        ctx.clearRect(
          0,
          0,
          1,
          1
        );

        return;

      }


      const page =
        await pdfDoc.getPage(pageNumber);


      /*
        Render dengan ukuran dasar
      */

      const baseViewport =
        page.getViewport({
          scale: 1
        });


      /*
        Ukuran container
      */

      const containerWidth =
        container.clientWidth;

      const containerHeight =
        container.clientHeight;


      /*
        Scale agar PDF masuk area buku
      */

      const scaleX =
        containerWidth /
        baseViewport.width;

      const scaleY =
        containerHeight /
        baseViewport.height;


      const scale =
        Math.min(
          scaleX,
          scaleY
        ) * zoom;


      const viewport =
        page.getViewport({
          scale: scale
        });


      const outputScale =
        window.devicePixelRatio || 1;


      canvas.width =
        Math.floor(
          viewport.width * outputScale
        );

      canvas.height =
        Math.floor(
          viewport.height * outputScale
        );


      canvas.style.width =
        viewport.width + "px";

      canvas.style.height =
        viewport.height + "px";


      const context =
        canvas.getContext("2d");


      context.setTransform(
        outputScale,
        0,
        0,
        outputScale,
        0,
        0
      );


      await page.render({

        canvasContext: context,

        viewport: viewport

      }).promise;

    }


    /* =========================
       RENDER SPREAD
    ========================= */

    async function renderSpread() {

      if (!pdfDoc) return;


      const leftContainer =
        leftCanvas.parentElement;

      const rightContainer =
        rightCanvas.parentElement;


      await renderPage(
        currentPage,
        leftCanvas,
        leftContainer
      );


      await renderPage(
        currentPage + 1,
        rightCanvas,
        rightContainer
      );


      updatePageInfo();

    }


    /* =========================
       PAGE INFO
    ========================= */

    function updatePageInfo() {

      const lastPage =
        Math.min(
          currentPage + 1,
          pdfDoc.numPages
        );


      document
        .getElementById("pageInfo")
        .textContent =
          `${currentPage}–${lastPage} / ${pdfDoc.numPages}`;

    }


    /* =========================
       NEXT
    ========================= */

    document
      .getElementById("nextBtn")
      .addEventListener(
        "click",
        () => {

          if (
            currentPage + 2 <=
            pdfDoc.numPages
          ) {

            currentPage += 2;

            renderSpread();

          }

        }
      );


    /* =========================
       PREVIOUS
    ========================= */

    document
      .getElementById("prevBtn")
      .addEventListener(
        "click",
        () => {

          if (
            currentPage - 2 >= 1
          ) {

            currentPage -= 2;

            renderSpread();

          }

        }
      );


    /* =========================
       ZOOM IN
    ========================= */

    document
      .getElementById("zoomIn")
      .addEventListener(
        "click",
        () => {

          if (zoom < 1.5) {

            zoom += 0.1;

            renderSpread();

          }

        }
      );


    /* =========================
       ZOOM OUT
    ========================= */

    document
      .getElementById("zoomOut")
      .addEventListener(
        "click",
        () => {

          if (zoom > 0.7) {

            zoom -= 0.1;

            renderSpread();

          }

        }
      );


    /* =========================
       FULLSCREEN
    ========================= */

    document
      .getElementById("fullscreenBtn")
      .addEventListener(
        "click",
        () => {

          const stage =
            document.querySelector(
              ".book-stage"
            );


          if (!document.fullscreenElement) {

            stage.requestFullscreen();

          }

          else {

            document.exitFullscreen();

          }

        }
      );


    /* =========================
       RESPONSIVE
    ========================= */

    let resizeTimer;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(resizeTimer);


        resizeTimer =
          setTimeout(
            renderSpread,
            250
          );

      }
    );


    /* =========================
       START
    ========================= */

    loadPDF();

  </script>

</body>
</html>
