<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>E-book Interaktif – Pedoman Monitoring SPJ</title>

<style>
:root{
  --bg:#17304f;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  font-family:Arial, Helvetica, sans-serif;
}

/* ===============================
   VIEWER UTAMA
================================= */

#viewer{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  padding:
    clamp(10px, 2vh, 30px)
    clamp(10px, 2vw, 40px)
    70px;
}

/* ===============================
   BOOK STAGE
   Mengikuti rasio asset buku
================================= */

#bookStage{
  position:relative;

  width:min(94vw, 1500px);
  aspect-ratio:1536 / 993;

  max-height:calc(100vh - 100px);

  flex:none;

  transform-style:preserve-3d;
  perspective:1800px;
}

/* ===============================
   AREA PDF
================================= */

#pdfArea{
  position:absolute;

  /*
    Area PDF berada DI DALAM
    frame buku.

    Nilai ini bisa disesuaikan
    sedikit jika diperlukan.
  */

  left:7.35%;
  top:6.45%;

  width:85.3%;
  height:88.6%;

  overflow:hidden;

  z-index:2;

  background:#fff;
}

/* ===============================
   PDF WRAPPER
================================= */

#pageWrap{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#fff;

  transform-style:preserve-3d;

  transform-origin:center center;

  will-change:transform, opacity;

  box-shadow:
    0 0 18px rgba(0,0,0,.18);
}

/* Canvas PDF */

#pdfCanvas{
  display:block;

  width:100%;
  height:100%;

  object-fit:fill;
}

/* ===============================
   BOOK FRAME
================================= */

#bookFrame{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  pointer-events:none;

  z-index:5;

  user-select:none;
}

/* ===============================
   FORM SPJ
================================= */

#formOverlay{
  display:none;

  position:absolute;

  left:5.7%;
  top:10.5%;

  width:88.6%;
  height:84.5%;

  z-index:4;

  background:transparent;

  overflow:hidden;
}

#formOverlay.active{
  display:block;
}

#formFrame{
  display:block;

  width:100%;
  height:100%;

  border:0;

  background:transparent;

  overflow:hidden;
}

/* ===============================
   LOADING
================================= */

#loading{
  position:fixed;
  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(15,28,45,.65);

  color:#fff;

  z-index:20;

  font-size:14px;
}

#loading.show{
  display:flex;
}

/* ===============================
   PESAN ERROR
================================= */

#message{
  color:#17365d;

  background:#fff;

  padding:25px;

  border-radius:10px;

  max-width:600px;

  text-align:center;

  font:15px/1.6 Arial, sans-serif;

  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

/* ===============================
   TOOLBAR
================================= */

#toolbar{
  position:fixed;

  left:50%;
  bottom:12px;

  transform:translateX(-50%);

  z-index:30;

  display:flex;
  align-items:center;
  gap:7px;

  padding:7px 10px;

  border-radius:22px;

  background:rgba(39,67,103,.88);

  backdrop-filter:blur(10px);

  color:#fff;

  line-height:1;

  box-shadow:
    0 4px 18px rgba(0,0,0,.25);
}

#toolbar button{
  border:0;

  border-radius:50%;

  min-width:32px;
  height:32px;

  background:rgba(255,255,255,.08);

  color:#fff;

  font-size:18px;

  cursor:pointer;

  transition:.2s;
}

#toolbar button:hover{
  background:rgba(255,255,255,.22);

  transform:scale(1.05);
}

#toolbar button:disabled{
  opacity:.35;

  cursor:not-allowed;

  transform:none;
}

#pageNum{
  width:42px;

  height:30px;

  padding:4px;

  text-align:center;

  border:1px solid rgba(255,255,255,.5);

  border-radius:15px;

  background:rgba(255,255,255,.08);

  color:#fff;

  outline:none;
}

#pageStatus{
  font-size:12px;

  white-space:nowrap;

  font-weight:600;
}

/* ===============================
   ANIMASI HALAMAN
================================= */

@keyframes pageTurnNext{

  0%{
    opacity:.45;

    transform:
      perspective(1400px)
      rotateY(-18deg)
      translateX(35px)
      scale(.99);

    filter:brightness(.8);
  }

  50%{
    opacity:.92;

    transform:
      perspective(1400px)
      rotateY(4deg)
      translateX(-4px)
      scale(.997);

    filter:brightness(1.05);
  }

  100%{
    opacity:1;

    transform:
      perspective(1400px)
      rotateY(0)
      translateX(0)
      scale(1);

    filter:brightness(1);
  }
}

@keyframes pageTurnPrev{

  0%{
    opacity:.45;

    transform:
      perspective(1400px)
      rotateY(18deg)
      translateX(-35px)
      scale(.99);

    filter:brightness(.8);
  }

  50%{
    opacity:.92;

    transform:
      perspective(1400px)
      rotateY(-4deg)
      translateX(4px)
      scale(.997);

    filter:brightness(1.05);
  }

  100%{
    opacity:1;

    transform:
      perspective(1400px)
      rotateY(0)
      translateX(0)
      scale(1);

    filter:brightness(1);
  }
}

#pageWrap.turn-next{
  animation:
    pageTurnNext .65s
    cubic-bezier(.2,.75,.25,1)
    both;
}

#pageWrap.turn-prev{
  animation:
    pageTurnPrev .65s
    cubic-bezier(.2,.75,.25,1)
    both;
}

/* ===============================
   MOBILE
================================= */

@media(max-width:700px){

  #viewer{
    padding:
      8px
      2px
      62px;
  }

  #bookStage{
    width:100vw;
  }

  #toolbar{
    bottom:6px;

    gap:3px;

    padding:5px 7px;
  }

  #toolbar button{
    min-width:28px;

    height:28px;

    font-size:15px;
  }

  #pageNum{
    width:36px;

    height:27px;
  }

  #pageStatus{
    font-size:10px;
  }
}

@media(prefers-reduced-motion:reduce){

  #pageWrap.turn-next,
  #pageWrap.turn-prev{
    animation:none;
  }
}

</style>
</head>

<body>


<!-- ===============================
     EBOOK VIEWER
================================= -->

<div id="viewer">

  <div id="message">
    E-book sedang dimuat…
  </div>

</div>


<!-- ===============================
     LOADING
================================= -->

<div id="loading">
  Membuka halaman…
</div>


<!-- ===============================
     TOOLBAR
================================= -->

<div id="toolbar">

  <button
    id="prev"
    type="button"
    title="Halaman sebelumnya"
    aria-label="Halaman sebelumnya">
    ‹
  </button>

  <input
    id="pageNum"
    type="number"
    min="1"
    value="1"
    aria-label="Nomor halaman">

  <span id="pageStatus">
    / 31
  </span>

  <button
    id="next"
    type="button"
    title="Halaman berikutnya"
    aria-label="Halaman berikutnya">
    ›
  </button>

  <button
    id="zoomOut"
    type="button"
    title="Perkecil"
    aria-label="Perkecil">
    −
  </button>

  <button
    id="zoomIn"
    type="button"
    title="Perbesar"
    aria-label="Perbesar">
    +
  </button>

  <button
    id="fullscreen"
    type="button"
    title="Layar penuh"
    aria-label="Layar penuh">
    ⛶
  </button>

</div>


<!-- ===============================
     PDF.JS
================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<script>

/* ==========================================
   KONFIGURASI FILE
========================================== */

const PDF_URL =
  './Draft_Ebook_Rima_Lea_optimized.pdf';

const BOOK_FRAME =
  './book-frame(1).png';

const FORM_URL =
  'https://script.google.com/macros/s/AKfycbxxH0INi4GhjBhajRp4xscS26XTfobPA5lSQGOSveVPA6C1HVgymUhTiVkGZdguax5R/exec';


/* ==========================================
   PDF.JS
========================================== */

const pdfjsLib = window.pdfjsLib;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';


/* ==========================================
   VARIABLE
========================================== */

let pdfDoc = null;

let currentPage = 1;

let zoom = 1;

let rendering = false;

let pendingPage = null;

let hasShownFirstPage = false;

let resizeTimer = null;


/* ==========================================
   ELEMENT
========================================== */

const viewer =
  document.getElementById('viewer');

const pageInput =
  document.getElementById('pageNum');

const pageStatus =
  document.getElementById('pageStatus');

const loading =
  document.getElementById('loading');

const prevButton =
  document.getElementById('prev');

const nextButton =
  document.getElementById('next');


/* ==========================================
   RENDER HALAMAN
========================================== */

async function renderPage(
  number,
  direction = 'next'
){

  if(!pdfDoc) return;


  if(rendering){

    pendingPage = {
      number,
      direction
    };

    return;
  }


  rendering = true;


  currentPage =
    Math.max(
      1,
      Math.min(
        pdfDoc.numPages,
        number
      )
    );


  pageInput.value =
    currentPage;


  loading.classList.add('show');


  try{

    /* ----------------------------------
       AMBIL HALAMAN PDF
    ---------------------------------- */

    const page =
      await pdfDoc.getPage(
        currentPage
      );


    /*
      Render PDF dengan resolusi tinggi.

      PDF akan di-scale berdasarkan
      area dalam frame buku.
    */

    const unitViewport =
      page.getViewport({
        scale:1
      });


    const bookStage =
      document.createElement('div');

    bookStage.id =
      'bookStage';


    /* ----------------------------------
       PDF AREA
    ---------------------------------- */

    const pdfArea =
      document.createElement('div');

    pdfArea.id =
      'pdfArea';


    const wrap =
      document.createElement('div');

    wrap.id =
      'pageWrap';


    const canvas =
      document.createElement('canvas');

    canvas.id =
      'pdfCanvas';


    wrap.appendChild(canvas);

    pdfArea.appendChild(wrap);


    /* ----------------------------------
       FORM SPJ HALAMAN 13
    ---------------------------------- */

    if(currentPage === 13){

      const overlay =
        document.createElement('div');

      overlay.id =
        'formOverlay';

      overlay.className =
        'active';


      const frame =
        document.createElement('iframe');

      frame.id =
        'formFrame';

      frame.src =
        FORM_URL;

      frame.title =
        'Formulir Pengumpulan Dokumen SPJ';

      frame.setAttribute(
        'scrolling',
        'no'
      );


      overlay.appendChild(frame);

      wrap.appendChild(overlay);

    }


    /* ----------------------------------
       BOOK FRAME
    ---------------------------------- */

    const frameImage =
      document.createElement('img');

    frameImage.id =
      'bookFrame';

    frameImage.src =
      BOOK_FRAME;

    frameImage.alt =
      'Frame Buku';


    /*
      Susunan layer:

      1. PDF
      2. FORM (jika halaman 13)
      3. FRAME BUKU PALING DEPAN
    */

    bookStage.appendChild(pdfArea);

    bookStage.appendChild(frameImage);


    /* ----------------------------------
       TAMPILKAN KE VIEWER
    ---------------------------------- */

    viewer.replaceChildren(
      bookStage
    );


    /*
      Tunggu browser menghitung
      ukuran pdfArea.
    */

    await new Promise(
      resolve =>
        requestAnimationFrame(resolve)
    );


    /* ----------------------------------
       HITUNG UKURAN PDF
    ---------------------------------- */

    const areaWidth =
      pdfArea.clientWidth;

    const areaHeight =
      pdfArea.clientHeight;


    /*
      Scale agar PDF MEMENUHI
      area buku.

      Menggunakan Math.max supaya
      tidak ada ruang kosong.
    */

    const scaleX =
      areaWidth /
      unitViewport.width;

    const scaleY =
      areaHeight /
      unitViewport.height;


    const baseScale =
      Math.max(
        scaleX,
        scaleY
      );


    const finalScale =
      baseScale * zoom;


    const viewport =
      page.getViewport({
        scale:finalScale
      });


    /*
      Render dengan resolusi retina
    */

    const ratio =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    canvas.width =
      Math.ceil(
        viewport.width * ratio
      );

    canvas.height =
      Math.ceil(
        viewport.height * ratio
      );


    /*
      Ukuran asli canvas sesuai
      viewport PDF
    */

    canvas.style.width =
      viewport.width + 'px';

    canvas.style.height =
      viewport.height + 'px';


    /*
      Posisi di tengah.

      Jika PDF lebih besar dari
      area buku, bagian berlebih
      akan terpotong secara rapi
      oleh pdfArea.
    */

    canvas.style.position =
      'absolute';

    canvas.style.left =
      '50%';

    canvas.style.top =
      '50%';

    canvas.style.transform =
      'translate(-50%, -50%)';


    const context =
      canvas.getContext('2d');


    await page.render({

      canvasContext:
        context,

      viewport:

        viewport,

      transform:

        ratio !== 1
          ? [
              ratio,
              0,
              0,
              ratio,
              0,
              0
            ]
          : null

    }).promise;


    /* ----------------------------------
       ANIMASI
    ---------------------------------- */

    if(hasShownFirstPage){

      wrap.classList.add(

        direction === 'prev'
          ? 'turn-prev'
          : 'turn-next'

      );

    }


    hasShownFirstPage =
      true;


    /* ----------------------------------
       UPDATE NAVIGASI
    ---------------------------------- */

    prevButton.disabled =
      currentPage === 1;


    nextButton.disabled =
      currentPage === pdfDoc.numPages;


    pageStatus.textContent =
      '/ ' + pdfDoc.numPages;


  }
  catch(error){

    console.error(error);


    viewer.innerHTML = `

      <div id="message">

        <strong>
          Halaman tidak dapat ditampilkan.
        </strong>

        <br><br>

        Silakan muat ulang e-book.

      </div>

    `;

  }
  finally{

    loading.classList.remove('show');

    rendering =
      false;


    /*
      Jika user menekan tombol
      beberapa kali saat rendering
    */

    if(pendingPage){

      const next =
        pendingPage;

      pendingPage =
        null;


      renderPage(
        next.number,
        next.direction
      );

    }

  }

}


/* ==========================================
   LOAD PDF
========================================== */

async function loadPdf(){

  try{

    pdfDoc =
      await pdfjsLib.getDocument({

        url:PDF_URL

      }).promise;


    pageStatus.textContent =
      '/ ' +
      pdfDoc.numPages;


    await renderPage(
      1,
      'next'
    );


  }
  catch(error){

    console.error(error);


    viewer.innerHTML = `

      <div id="message">

        <strong>
          PDF belum dapat dimuat.
        </strong>

        <br><br>

        Pastikan file:

        <br><br>

        <b>
          Draft_Ebook_Rima_Lea_optimized.pdf
        </b>

        <br><br>

        berada dalam folder yang sama
        dengan index.html.

      </div>

    `;

  }

}


/* ==========================================
   TOMBOL SEBELUMNYA
========================================== */

prevButton.onclick =
  () => {

    if(currentPage > 1){

      renderPage(
        currentPage - 1,
        'prev'
      );

    }

  };


/* ==========================================
   TOMBOL SELANJUTNYA
========================================== */

nextButton.onclick =
  () => {

    if(
      pdfDoc &&
      currentPage < pdfDoc.numPages
    ){

      renderPage(
        currentPage + 1,
        'next'
      );

    }

  };


/* ==========================================
   INPUT NOMOR HALAMAN
========================================== */

pageInput.onchange =
  () => {

    const newPage =
      Number(pageInput.value) || 1;


    renderPage(

      newPage,

      newPage < currentPage
        ? 'prev'
        : 'next'

    );

  };


/* ==========================================
   ZOOM
========================================== */

document
  .getElementById('zoomIn')
  .onclick =
  () => {

    zoom =
      Math.min(
        1.35,
        zoom + 0.05
      );


    renderPage(
      currentPage,
      'next'
    );

  };


document
  .getElementById('zoomOut')
  .onclick =
  () => {

    zoom =
      Math.max(
        0.85,
        zoom - 0.05
      );


    renderPage(
      currentPage,
      'prev'
    );

  };


/* ==========================================
   FULLSCREEN
========================================== */

document
  .getElementById('fullscreen')
  .onclick =
  () => {

    if(!document.fullscreenElement){

      document.documentElement
        .requestFullscreen?.();

    }
    else{

      document
        .exitFullscreen?.();

    }

  };


/* ==========================================
   KEYBOARD
========================================== */

document.addEventListener(
  'keydown',
  event => {

    if(event.target === pageInput)
      return;


    if(event.key === 'ArrowRight'){

      if(
        currentPage <
        pdfDoc.numPages
      ){

        renderPage(
          currentPage + 1,
          'next'
        );

      }

    }


    if(event.key === 'ArrowLeft'){

      if(currentPage > 1){

        renderPage(
          currentPage - 1,
          'prev'
        );

      }

    }

  }
);


/* ==========================================
   SWIPE
========================================== */

let touchStartX = 0;


viewer.addEventListener(

  'touchstart',

  event => {

    touchStartX =
      event.changedTouches[0]
        .screenX;

  },

  {
    passive:true
  }

);


viewer.addEventListener(

  'touchend',

  event => {

    const touchEndX =
      event.changedTouches[0]
        .screenX;


    const difference =
      touchEndX -
      touchStartX;


    if(Math.abs(difference) < 65)
      return;


    /*
      Swipe kiri = halaman berikutnya
    */

    if(difference < 0){

      if(
        currentPage <
        pdfDoc.numPages
      ){

        renderPage(
          currentPage + 1,
          'next'
        );

      }

    }


    /*
      Swipe kanan = halaman sebelumnya
    */

    else{

      if(currentPage > 1){

        renderPage(
          currentPage - 1,
          'prev'
        );

      }

    }

  },

  {
    passive:true
  }

);


/* ==========================================
   RESPONSIVE
========================================== */

window.addEventListener(

  'resize',

  () => {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        () => {

          if(pdfDoc){

            renderPage(
              currentPage,
              'next'
            );

          }

        },
        180
      );

  }

);


/* ==========================================
   MULAI
========================================== */

loadPdf();

</script>

</body>
</html>
