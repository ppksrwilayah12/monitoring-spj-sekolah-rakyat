<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>E-book Interaktif – Pedoman Monitoring SPJ</title>

<style>
:root{
  --navy:#17365d;
}

/* =========================
   RESET
========================= */
*{
  box-sizing:border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #ffffff !important;
}

/* =========================
   VIEWER
========================= */
#viewer{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background: #ffffff;

    perspective:1800px;
}

/* =========================
   BOOK SHELL
========================= */
#bookShell{
  position:relative;

  width:1200px;
  height:776px;

  flex:none;

  filter:
    drop-shadow(0 25px 34px rgba(0,0,0,.48));

  transform-origin:center center;

  /* Shell tetap visible agar bayangan buku tidak terpotong. */
  overflow:visible;
  isolation:isolate;
}

/* =========================
   CLIP AREA FLIPBOOK
   Mencegah lembar animasi keluar
   dari area halaman di dalam frame.
========================= */
.book-clip{
  position:absolute;
  z-index:5;
  overflow:hidden;
  pointer-events:auto;
}

/* =========================
   FRAME ASSETS
========================= */

/* Frame bawah:
   ketebalan halaman dan sisi buku */
.book-frame-base{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:fill;

  z-index:1;

  pointer-events:none;
  user-select:none;

  -webkit-user-drag:none;
}

/* Frame atas:
   bingkai dan punggung buku */
.book-frame-overlay{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:fill;

  z-index:50;

  pointer-events:none;
  user-select:none;

  -webkit-user-drag:none;
}

/* =========================
   FLIPBOOK
========================= */
#flipBook{
  position:absolute;

  z-index:10;

  transform:translate(-50%,-50%);

  left:50%;
  top:50%;

  margin:0;

  touch-action:none;
}

#flipBook .page{
  position:relative;

  overflow:hidden;

  background:#fff;

  cursor:grab;

  user-select:none;
  -webkit-user-select:none;

  box-shadow:none;
}

#flipBook .page:active{
  cursor:grabbing;
}

#flipBook .page-content{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#fff;
}

#flipBook .page canvas{
  display:block;

  width:100%;
  height:100%;

  pointer-events:none;
}

/* =========================
   OVERLAY FORM
========================= */
#flipBook .page-overlay{
  position:absolute;
  z-index:20;
}

/* Form halaman 13 */
#flipBook .form-overlay{
  left:5.7%;
  top:10.5%;

  width:88.6%;
  height:84.5%;

  border:0;
  background:transparent;

  overflow:hidden;
}

#flipBook .form-overlay iframe{
  display:block;

  width:100%;
  height:100%;

  border:0;

  background:transparent;
}

/* =========================
   DOWNLOAD BUTTONS
========================= */
#flipBook .download-overlay{
  position:absolute;

  top:8%;
  left:5%;

  width:90%;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:10px;

  flex-wrap:wrap;

  line-height:normal;
}

#flipBook .download-btn{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-height:34px;

  padding:8px 12px;

  background:#0757c9;

  color:#fff;

  text-decoration:none;

  border-radius:7px;

  font:700 11px Arial,sans-serif;

  text-align:center;

  box-shadow:
    0 3px 8px rgba(7,87,201,.25);

  transition:
    transform .2s ease,
    background .2s ease;
}

#flipBook .download-btn:hover{
  background:#034aa9;
  transform:translateY(-2px);
}

/* =========================
   TOOLBAR
========================= */
#toolbar{
  position:fixed;

  left:50%;
  bottom:max(12px,env(safe-area-inset-bottom));

  transform:translateX(-50%);

  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  padding:8px 13px;

  border-radius:999px;

  background:rgba(235,243,255,.13);

  border:1px solid rgba(255,255,255,.28);

  -webkit-backdrop-filter:
    blur(24px) saturate(180%);

  backdrop-filter:
    blur(24px) saturate(180%);

  color:#fff;

  line-height:1;

  box-shadow:
    0 8px 30px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.16);
}

#toolbar button{
  width:34px;
  height:34px;

  padding:0;

  border:0;

  border-radius:50%;

  background:rgba(255,255,255,.08);

  color:#fff;

  font-size:19px;

  cursor:pointer;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  transition:
    background .2s ease,
    transform .2s ease;
}

#toolbar button:hover{
  background:rgba(255,255,255,.22);
}

#toolbar button:active{
  transform:scale(.92);
}

#toolbar button:disabled{
  opacity:.3;
  cursor:not-allowed;
}

#pageNum{
  width:44px;

  padding:6px 3px;

  text-align:center;

  border:1px solid rgba(255,255,255,.3);

  border-radius:999px;

  background:rgba(255,255,255,.12);

  color:#fff;

  outline:none;
}

#pageStatus{
  font-size:12px;

  white-space:nowrap;

  text-shadow:
    0 1px 4px #0008;
}

/* =========================
   MESSAGE
========================= */
#message{
  color:#17365d;

  background:#fff;

  padding:22px;

  border-radius:8px;

  max-width:600px;

  font:14px/1.5 Arial,sans-serif;
}

/* =========================
   LOADING
========================= */
#loading{
  position:fixed;
  inset:0;

  display:none;

  align-items:center;
  justify-content:center;

  background:#20242a88;

  color:#fff;

  z-index:200;

  font-size:13px;
}

#loading.show{
  display:flex;
}

/* =========================
   MOBILE
========================= */
@media(max-width:700px){

  #toolbar{
    max-width:calc(100vw - 16px);

    gap:3px;

    padding:5px 8px;

    bottom:max(8px,env(safe-area-inset-bottom));
  }

  #toolbar button{
    width:30px;
    height:30px;

    font-size:16px;
  }

  #pageNum{
    width:36px;
    font-size:12px;
  }

  #pageStatus{
    font-size:10px;
  }

  #flipBook .download-overlay{
    top:7%;
    gap:5px;
  }

  #flipBook .download-btn{
    font-size:8px;
    padding:6px;
  }
}

</style>
</head>

<body>

<!-- =========================
     VIEWER
========================= -->
<div id="viewer">
  <div id="message">
    E-book sedang dimuat…
  </div>
</div>

<div id="loading">
  Membuka halaman…
</div>

<!-- =========================
     TOOLBAR
========================= -->
<div id="toolbar" aria-label="Navigasi e-book">

  <button
    id="prev"
    type="button"
    title="Halaman sebelumnya">
    ‹
  </button>

  <input
    id="pageNum"
    type="number"
    min="1"
    value="1">

  <span id="pageStatus">
    / 31
  </span>

  <button
    id="next"
    type="button"
    title="Halaman berikutnya">
    ›
  </button>

  <button
    id="zoomOut"
    type="button"
    title="Perkecil">
    −
  </button>

  <button
    id="zoomIn"
    type="button"
    title="Perbesar">
    +
  </button>

  <button
    id="fullscreen"
    type="button"
    title="Layar penuh">
    ⛶
  </button>

</div>


<!-- =========================
     LIBRARY
========================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>


<script>

/* =========================================================
   KONFIGURASI FILE
========================================================= */

const PDF_URL =
  './Draft_Ebook_Rima_Lea_optimized.pdf';

const FORM_URL =
  'https://script.google.com/macros/s/AKfycbw9HnoBDY_ta8zLam3T2tK5758b3kGou-kjzuVXFD7Afhle8LrHKdb3dXTPHWgnjqGc/exec';

const CHECKLIST_FILE =
  './Format_Checklist.docx';

const BUKTI_BERKAS_FILE =
  './Format_Bukti_Pengumpulan_berkas.docx';

const BOOK_BASE =
  './assets/book-frame.png';

const BOOK_OVERLAY =
  './assets/book-frame-overlay.png';


/* =========================================================
   PDF.JS
========================================================= */

const pdfjsLib = window.pdfjsLib;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';


/* =========================================================
   VARIABLE
========================================================= */

let pdfDoc = null;

let pageFlip = null;

let currentPage = 1;

let zoom = 1;

let renderCache = new Map();

const MAX_CACHE = 8;

const viewer =
  document.getElementById('viewer');

const pageInput =
  document.getElementById('pageNum');

const pageStatus =
  document.getElementById('pageStatus');

const loading =
  document.getElementById('loading');


/* =========================================================
   DETEKSI MOBILE
========================================================= */

function isMobile(){
  return window.matchMedia(
    '(max-width:700px)'
  ).matches;
}


/* =========================================================
   CACHE
========================================================= */

function cacheKey(n,w){
  return `${n}-${Math.round(w)}`;
}


/* =========================================================
   RENDER PDF
========================================================= */

async function renderPdfPage(
  n,
  targetWidth
){

  const key =
    cacheKey(n,targetWidth);

  if(renderCache.has(key)){
    return renderCache.get(key);
  }

  const page =
    await pdfDoc.getPage(n);

  const base =
    page.getViewport({
      scale:1
    });

  const scale =
    targetWidth / base.width;

  const viewport =
    page.getViewport({
      scale
    });

  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      1.5
    );

  const canvas =
    document.createElement('canvas');

  canvas.width =
    Math.ceil(viewport.width * ratio);

  canvas.height =
    Math.ceil(viewport.height * ratio);

  canvas.style.width = '100%';

  canvas.style.height = '100%';

  await page.render({

    canvasContext:
      canvas.getContext(
        '2d',
        {alpha:false}
      ),

    viewport,

    transform:
      ratio !== 1
        ? [ratio,0,0,ratio,0,0]
        : null

  }).promise;


  renderCache.set(
    key,
    canvas
  );


  while(
    renderCache.size > MAX_CACHE
  ){

    const first =
      renderCache
        .keys()
        .next()
        .value;

    const old =
      renderCache.get(first);

    old.width = 0;
    old.height = 0;

    renderCache.delete(first);
  }

  return canvas;
}


/* =========================================================
   OVERLAY HALAMAN
========================================================= */

function addOverlay(
  pageEl,
  n
){

  /* =========================
     FORM UPLOAD SPJ
     HALAMAN 13
  ========================= */

  if(n === 13){

    const overlay =
      document.createElement('div');

    overlay.className =
      'page-overlay form-overlay';


    const frame =
      document.createElement('iframe');

    frame.src =
      FORM_URL;

    frame.title =
      'Formulir Pengumpulan Dokumen SPJ';

    frame.setAttribute(
      'scrolling',
      'no'
    );


    overlay.appendChild(frame);

    pageEl.appendChild(overlay);
  }


  /* =========================
     DOWNLOAD
     HALAMAN 18
  ========================= */

  if(n === 18){

    const overlay =
      document.createElement('div');

    overlay.className =
      'page-overlay download-overlay';


    const checklist =
      document.createElement('a');

    checklist.href =
      CHECKLIST_FILE;

    checklist.download =
      'Format_Checklist.docx';

    checklist.className =
      'download-btn';

    checklist.textContent =
      '↓ Download Format Checklist';


    const bukti =
      document.createElement('a');

    bukti.href =
      BUKTI_BERKAS_FILE;

    bukti.download =
      'Format_Bukti_Pengumpulan_berkas.docx';

    bukti.className =
      'download-btn';

    bukti.textContent =
      '↓ Download Format Bukti Pengumpulan Berkas';


    overlay.append(
      checklist,
      bukti
    );

    pageEl.appendChild(overlay);
  }
}


/* =========================================================
   BUILD BOOK
========================================================= */

async function buildBook(){

  loading.classList.add('show');

  try{

    /* =========================
       LOAD PDF
    ========================= */

    pdfDoc =
      await pdfjsLib
        .getDocument({
          url:PDF_URL
        })
        .promise;


    /* =========================
       UKURAN VIEWER
    ========================= */

    const viewerW =
      Math.max(
        320,
        viewer.clientWidth
      );

    const viewerH =
      Math.max(
        360,
        viewer.clientHeight
      );


    /* =========================
       PROPORSI PDF
    ========================= */

    const first =
      await pdfDoc.getPage(1);

    const base =
      first.getViewport({
        scale:1
      });

    const pdfRatio =
      base.width / base.height;


    const mobile =
      isMobile();


    /* =====================================================
       PROPORSI ASSET BOOK FRAME

       book-frame.png:
       1536 × 993
    ===================================================== */

    const ASSET_RATIO =
      1536 / 993;


    /* =========================
       AREA YANG TERSEDIA
    ========================= */

    const reservedToolbar =
      mobile ? 58 : 68;

    const availableW =
      Math.max(
        300,
        viewerW - (mobile ? 8 : 40)
      );

    const availableH =
      Math.max(
        300,
        viewerH - reservedToolbar
      );


    /* =========================
       HITUNG UKURAN LUAR BUKU
    ========================= */

    let bookW =
      Math.min(
        availableW,
        availableH * ASSET_RATIO
      );

    let bookH =
      bookW / ASSET_RATIO;


    /* =========================
       AREA DALAM FRAME

       Nilai ini dapat disesuaikan
       apabila PDF masih terlalu dekat
       dengan bingkai.
    ========================= */

    const insetLeft =
      bookW * 0.042;

    const insetRight =
      bookW * 0.042;

    const insetTop =
      bookH * 0.027;

    const insetBottom =
      bookH * 0.035;


    const innerW =
      bookW -
      insetLeft -
      insetRight;

    const innerH =
      bookH -
      insetTop -
      insetBottom;


    /* =====================================================
       HITUNG UKURAN PAGEFLIP

       DESKTOP:
       spread = 2 halaman

       MOBILE:
       1 halaman
    ===================================================== */

    let pageW;
    let pageH;

    if(mobile){

      pageW =
        Math.min(
          innerW,
          innerH * pdfRatio
        );

      pageH =
        pageW / pdfRatio;

    }else{

      /*
        Spread ratio = 2 × lebar halaman
      */

      const spreadRatio =
        pdfRatio * 2;


      let spreadW =
        Math.min(
          innerW,
          innerH * spreadRatio
        );

      let spreadH =
        spreadW / spreadRatio;


      pageW =
        spreadW / 2;

      pageH =
        spreadH;
    }


    pageW =
      Math.floor(pageW);

    pageH =
      Math.floor(pageH);


    /* =====================================================
       UKURAN SPREAD FINAL
    ===================================================== */

    const flipBookW =
      mobile
        ? pageW
        : pageW * 2;

    const flipBookH =
      pageH;


    /* =====================================================
       BUAT BOOK SHELL
    ===================================================== */

    const shell =
      document.createElement('div');

    shell.id =
      'bookShell';

    shell.style.width =
      `${bookW}px`;

    shell.style.height =
      `${bookH}px`;


    /* =====================================================
       FRAME BAWAH
    ===================================================== */

    const bookBase =
      document.createElement('img');

    bookBase.src =
      BOOK_BASE;

    bookBase.className =
      'book-frame-base';

    bookBase.alt = '';

    bookBase.setAttribute(
      'aria-hidden',
      'true'
    );

    shell.appendChild(bookBase);


    /* =====================================================
       FLIPBOOK
    ===================================================== */

    const book =
      document.createElement('div');

    book.id =
      'flipBook';

    /*
      Posisi tepat di tengah frame
    */

    book.style.width =
      `${flipBookW}px`;

    book.style.height =
      `${flipBookH}px`;


    book.setAttribute(
      'aria-label',
      'Tarik sudut halaman untuk membalik lembaran buku'
    );

    /* =====================================================
       CLIP AREA

       PageFlip ditempatkan di dalam area yang dipotong
       agar lembar yang sedang terangkat tidak terlihat
       di bawah/di luar frame buku.
    ===================================================== */

    const bookClip =
      document.createElement('div');

    bookClip.className =
      'book-clip';

    bookClip.style.left =
      `${insetLeft}px`;

    bookClip.style.top =
      `${insetTop}px`;

    bookClip.style.width =
      `${innerW}px`;

    bookClip.style.height =
      `${innerH}px`;

    /* Posisi PageFlip relatif terhadap area halaman */
    book.style.left = '50%';
    book.style.top = '50%';

    bookClip.appendChild(book);

    shell.appendChild(bookClip);


    /* =====================================================
       FRAME OVERLAY

       Frame ini berada PALING ATAS.

       Punggung buku akan menutup
       sambungan tengah PDF.
    ===================================================== */

    const bookOverlay =
      document.createElement('img');

    bookOverlay.src =
      BOOK_OVERLAY;

    bookOverlay.className =
      'book-frame-overlay';

    bookOverlay.alt = '';

    bookOverlay.setAttribute(
      'aria-hidden',
      'true'
    );

    shell.appendChild(bookOverlay);


    /* =====================================================
       MASUKKAN KE VIEWER
    ===================================================== */

    viewer.replaceChildren(shell);


    /* =====================================================
       RENDER SEMUA HALAMAN
    ===================================================== */

    const pages = [];


    for(
      let n = 1;
      n <= pdfDoc.numPages;
      n++
    ){

      const page =
        document.createElement('div');

      page.className =
        'page';


      const content =
        document.createElement('div');

      content.className =
        'page-content';


      const canvas =
        await renderPdfPage(
          n,
          pageW
        );


      const visible =
        document.createElement('canvas');


      visible.width =
        canvas.width;

      visible.height =
        canvas.height;


      visible.style.width =
        '100%';

      visible.style.height =
        '100%';


      visible
        .getContext(
          '2d',
          {alpha:false}
        )
        .drawImage(
          canvas,
          0,
          0
        );


      content.appendChild(
        visible
      );


      /* Overlay form dan download */

      addOverlay(
        content,
        n
      );


      page.appendChild(
        content
      );


      pages.push(
        page
      );
    }


    /* =====================================================
       INIT PAGE FLIP
    ===================================================== */

    pageFlip =
      new St.PageFlip(
        book,
        {

          width:pageW,

          height:pageH,

          size:'fixed',

          minWidth:pageW,

          maxWidth:pageW,

          minHeight:pageH,

          maxHeight:pageH,


          /* Shadow halaman */

          maxShadowOpacity:.60,

          drawShadow:true,


          /* Jangan jadikan cover berbeda */

          showCover:false,


          /* MOBILE */

          usePortrait:mobile,

          mobileScrollSupport:false,


          /* ANIMASI */

          flippingTime:1050,

          startPage:0,


          /* INTERAKSI */

          useMouseEvents:true,

          swipeDistance:24,

          showPageCorners:true,

          clickEventForward:true,

          disableFlipByClick:false

        }
      );


    /* =====================================================
       LOAD HALAMAN
    ===================================================== */

    pageFlip.loadFromHTML(
      pages
    );


    /* =====================================================
       EVENT SAAT HALAMAN BERPINDAH
    ===================================================== */

    pageFlip.on(
      'flip',
      e => {

        currentPage =
          e.data + 1;

        pageInput.value =
          currentPage;


        const total =
          pdfDoc.numPages;


        const visiblePage =
          pageFlip.getOrientation() === 'landscape'

          ? `${currentPage}–${Math.min(currentPage + 1,total)}`

          : `${currentPage}`;


        pageStatus.textContent =
          `${visiblePage} / ${total}`;


        document
          .getElementById('prev')
          .disabled =
            currentPage <= 1;


        document
          .getElementById('next')
          .disabled =
            currentPage >= total - 1;

      }
    );


    /* =====================================================
       STATUS AWAL
    ===================================================== */

    currentPage = 1;

    pageInput.value = 1;

    pageInput.max =
      pdfDoc.numPages;


    pageStatus.textContent =
      mobile

      ? `1 / ${pdfDoc.numPages}`

      : `1–2 / ${pdfDoc.numPages}`;


    document
      .getElementById('prev')
      .disabled = true;


    document
      .getElementById('next')
      .disabled = false;


  }catch(err){

    viewer.innerHTML = `
      <div id="message">
        <strong>
          E-book belum dapat dimuat.
        </strong>
        <br>
        Periksa koneksi internet,
        file PDF, folder assets,
        dan library flipbook.
      </div>
    `;


    console.error(err);


  }finally{

    loading.classList.remove('show');

  }

}


/* =========================================================
   TOMBOL PREVIOUS
========================================================= */

document
  .getElementById('prev')
  .onclick =
    () => {

      if(!pageFlip) return;

      pageFlip.flipPrev('bottom');

    };


/* =========================================================
   TOMBOL NEXT
========================================================= */

document
  .getElementById('next')
  .onclick =
    () => {

      if(!pageFlip) return;

      pageFlip.flipNext('bottom');

    };


/* =========================================================
   INPUT NOMOR HALAMAN
========================================================= */

pageInput.onchange =
  () => {

    if(!pageFlip || !pdfDoc){
      return;
    }


    const n =
      Math.max(
        1,

        Math.min(
          pdfDoc.numPages,

          Number(pageInput.value) || 1
        )
      );


    pageFlip.turnToPage(
      n - 1
    );

  };


/* =========================================================
   ZOOM IN
========================================================= */

document
  .getElementById('zoomIn')
  .onclick =
    () => {

      zoom =
        Math.min(
          1.35,
          zoom + .1
        );


      const shell =
        document.getElementById(
          'bookShell'
        );


      if(shell){

        shell.style.transform =
          `scale(${zoom})`;

      }

    };


/* =========================================================
   ZOOM OUT
========================================================= */

document
  .getElementById('zoomOut')
  .onclick =
    () => {

      zoom =
        Math.max(
          .75,
          zoom - .1
        );


      const shell =
        document.getElementById(
          'bookShell'
        );


      if(shell){

        shell.style.transform =
          `scale(${zoom})`;

      }

    };


/* =========================================================
   FULLSCREEN
========================================================= */

document
  .getElementById('fullscreen')
  .onclick =
    () => {

      if(
        !document.fullscreenElement
      ){

        document.documentElement
          .requestFullscreen
          ?.();

      }else{

        document
          .exitFullscreen
          ?.();

      }

    };


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer;


window.addEventListener(
  'resize',
  () => {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        () => {

          /*
            Dibangun ulang agar ukuran buku,
            PDF, dan frame kembali proporsional.
          */

          location.reload();

        },
        350
      );

  }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  'keydown',
  e => {

    if(
      e.target === pageInput
    ){
      return;
    }


    if(
      e.key === 'ArrowRight'
    ){

      pageFlip?.flipNext();

    }


    if(
      e.key === 'ArrowLeft'
    ){

      pageFlip?.flipPrev();

    }

  }
);


/* =========================================================
   START
========================================================= */

buildBook();

</script>
