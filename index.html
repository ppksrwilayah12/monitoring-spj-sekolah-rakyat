<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>E-Book Interaktif – Pedoman Monitoring SPJ Sekolah Rakyat</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111827;
    }

    button {
      font-family: inherit;
    }

    /* =========================================================
       APP
    ========================================================= */

    .app {
      width: 100%;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      background: #ffffff;

      padding:
        clamp(10px, 1.5vw, 24px)
        clamp(8px, 1vw, 20px)
        clamp(14px, 1.5vw, 24px);
    }

    /* =========================================================
       VIEWER WRAPPER
    ========================================================= */

    .viewer-wrapper {
      width: min(100%, 1500px);

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 14px;
    }

    /* =========================================================
       BOOK STAGE

       Rasio mengikuti asset buku horizontal.
       Area ini adalah batas utama agar tidak ada halaman PDF
       yang muncul di luar frame.
    ========================================================= */

    .book-stage {
      position: relative;

      width: min(96vw, 1500px);

      aspect-ratio: 1536 / 993;

      isolation: isolate;

      overflow: hidden;

      flex-shrink: 0;
    }

    /* =========================================================
       PDF CLIP AREA

       PDF berada di dalam area ini.

       overflow:hidden memastikan tidak ada bagian halaman
       yang keluar dari frame buku.
    ========================================================= */

    .pdf-clip {
      position: absolute;

      /*
        Area PDF diperbesar mendekati frame.

        Angka ini dapat disesuaikan sedikit jika asset frame
        Anda memiliki ketebalan border berbeda.
      */

      left: 6.5%;
      right: 6.5%;

      top: 5.7%;
      bottom: 5.8%;

      overflow: hidden;

      z-index: 1;

      background: #ffffff;
    }

    /* =========================================================
       PDF SPREAD

       Menampung dua halaman PDF.
    ========================================================= */

    .pdf-spread {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: stretch;
      justify-content: center;

      overflow: hidden;

      background: #ffffff;
    }

    /* =========================================================
       PDF PAGE
    ========================================================= */

    .pdf-page {
      position: relative;

      width: 50%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #ffffff;
    }

    /* =========================================================
       CANVAS

       Canvas dibuat sedikit overscan agar tepian PDF berada
       di balik frame dan tidak terlihat celah putih.
    ========================================================= */

    .pdf-page canvas {
      display: block;

      /*
        Sedikit lebih besar dari container.
        Bagian berlebih dipotong oleh .pdf-page.
      */

      width: 101%;
      height: 101%;

      object-fit: fill;

      transform: scale(1.015);

      transform-origin: center center;
    }

    /* =========================================================
       BOOK FRAME ASSET

       Frame berada paling atas.

       pointer-events:none agar tidak mengganggu interaksi PDF.
    ========================================================= */

    .book-frame {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: fill;

      z-index: 10;

      pointer-events: none;

      user-select: none;
    }

    /* =========================================================
       LOADING
    ========================================================= */

    .loading {
      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 20;

      background: rgba(255, 255, 255, 0.9);

      transition: opacity 0.3s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-box {
      padding: 16px 24px;

      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);

      font-size: 14px;
      color: #1e3a5f;
    }

    /* =========================================================
       ERROR
    ========================================================= */

    .error-box {
      display: none;

      position: absolute;

      inset: 0;

      z-index: 30;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(255, 255, 255, 0.96);

      text-align: center;
    }

    .error-box.active {
      display: flex;
    }

    .error-content {
      max-width: 500px;

      padding: 25px;

      border: 1px solid #fecaca;
      border-radius: 14px;

      background: #fff1f2;

      color: #991b1b;
    }

    .error-content h3 {
      margin-bottom: 10px;
    }

    .error-content p {
      font-size: 14px;
      line-height: 1.6;
    }

    /* =========================================================
       CONTROLS
    ========================================================= */

    .controls {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 8px;

      padding: 8px 12px;

      border-radius: 999px;

      background: #2f5785;

      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);

      user-select: none;

      flex-wrap: nowrap;
    }

    .control-btn {
      width: 36px;
      height: 36px;

      border: none;
      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      background: rgba(255, 255, 255, 0.12);

      color: #ffffff;

      font-size: 17px;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .control-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .page-info {
      min-width: 105px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 6px;

      color: #ffffff;

      font-size: 14px;
      font-weight: 600;

      white-space: nowrap;
    }

    .page-input {
      width: 42px;
      height: 30px;

      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 15px;

      background: rgba(255, 255, 255, 0.08);

      color: #ffffff;

      text-align: center;

      outline: none;

      font-size: 14px;
    }

    .page-input::-webkit-inner-spin-button,
    .page-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .page-input {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 768px) {

      .app {
        padding: 8px 4px 14px;
      }

      .viewer-wrapper {
        gap: 10px;
      }

      .book-stage {
        width: 100%;
      }

      /*
        Sedikit menyesuaikan area PDF untuk layar kecil.
      */

      .pdf-clip {
        left: 6.4%;
        right: 6.4%;

        top: 5.6%;
        bottom: 5.7%;
      }

      .controls {
        gap: 5px;
        padding: 7px 9px;
      }

      .control-btn {
        width: 32px;
        height: 32px;
        font-size: 15px;
      }

      .page-info {
        min-width: 88px;
        font-size: 12px;
      }

      .page-input {
        width: 38px;
        height: 28px;
      }
    }

    /* =========================================================
       SMALL MOBILE
    ========================================================= */

    @media (max-width: 480px) {

      .pdf-clip {
        left: 6.2%;
        right: 6.2%;

        top: 5.4%;
        bottom: 5.5%;
      }

      .controls {
        transform: scale(0.9);
        transform-origin: center top;
        margin-bottom: -8px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="viewer-wrapper">

      <!-- =====================================================
           BOOK
      ====================================================== -->

      <section class="book-stage" id="bookStage">

        <!-- PDF AREA -->
        <div class="pdf-clip">

          <div class="pdf-spread">

            <div class="pdf-page" id="pageLeft">
              <canvas id="canvasLeft"></canvas>
            </div>

            <div class="pdf-page" id="pageRight">
              <canvas id="canvasRight"></canvas>
            </div>

          </div>

        </div>


        <!-- FRAME ASSET -->

        <!--
          GANTI src DI BAWAH DENGAN NAMA FILE ASSET BUKU ANDA
        -->

        <img
          src="assets/book-frame.png"
          alt=""
          class="book-frame"
          id="bookFrame"
        />


        <!-- LOADING -->

        <div class="loading" id="loading">

          <div class="loading-box">
            E-book sedang dimuat...
          </div>

        </div>


        <!-- ERROR -->

        <div class="error-box" id="errorBox">

          <div class="error-content">

            <h3>E-book tidak dapat dimuat</h3>

            <p id="errorMessage">
              Terjadi kesalahan saat memuat file PDF.
            </p>

          </div>

        </div>

      </section>


      <!-- =====================================================
           CONTROLS
      ====================================================== -->

      <nav class="controls">

        <button
          class="control-btn"
          id="prevBtn"
          title="Halaman sebelumnya"
          aria-label="Halaman sebelumnya"
        >
          ‹
        </button>


        <div class="page-info">

          <input
            type="number"
            id="pageInput"
            class="page-input"
            value="1"
            min="1"
          />

          <span id="pageRange">
            / 0
          </span>

        </div>


        <button
          class="control-btn"
          id="nextBtn"
          title="Halaman berikutnya"
          aria-label="Halaman berikutnya"
        >
          ›
        </button>


        <button
          class="control-btn"
          id="zoomOutBtn"
          title="Perkecil tampilan"
          aria-label="Perkecil tampilan"
        >
          −
        </button>


        <button
          class="control-btn"
          id="zoomInBtn"
          title="Perbesar tampilan"
          aria-label="Perbesar tampilan"
        >
          +
        </button>


        <button
          class="control-btn"
          id="fullscreenBtn"
          title="Layar penuh"
          aria-label="Layar penuh"
        >
          ⛶
        </button>

      </nav>

    </div>

  </main>


  <script>

    /* =========================================================
       KONFIGURASI
    ========================================================= */

    /*
      GANTI DENGAN NAMA FILE PDF DI REPOSITORY ANDA.

      Contoh:
      const PDF_URL = "ebook.pdf";

      atau:
      const PDF_URL = "assets/ebook.pdf";
    */

    const PDF_URL = "ebook.pdf";


    /* =========================================================
       PDF.JS CONFIG
    ========================================================= */

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("errorBox");
    const errorMessage = document.getElementById("errorMessage");

    const canvasLeft = document.getElementById("canvasLeft");
    const canvasRight = document.getElementById("canvasRight");

    const pageLeft = document.getElementById("pageLeft");
    const pageRight = document.getElementById("pageRight");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const pageInput = document.getElementById("pageInput");
    const pageRange = document.getElementById("pageRange");

    const zoomInBtn = document.getElementById("zoomInBtn");
    const zoomOutBtn = document.getElementById("zoomOutBtn");

    const fullscreenBtn = document.getElementById("fullscreenBtn");

    const bookStage = document.getElementById("bookStage");


    /* =========================================================
       STATE
    ========================================================= */

    let pdfDoc = null;

    let currentPage = 1;

    let totalPages = 0;

    let zoomLevel = 1;

    let rendering = false;

    let pendingRender = false;


    /* =========================================================
       LOAD PDF
    ========================================================= */

    async function loadPDF() {

      try {

        loading.classList.remove("hidden");

        const loadingTask = pdfjsLib.getDocument(PDF_URL);

        pdfDoc = await loadingTask.promise;

        totalPages = pdfDoc.numPages;

        pageInput.max = totalPages;

        pageRange.textContent = `/ ${totalPages}`;

        currentPage = 1;

        await renderSpread();

        loading.classList.add("hidden");

      } catch (error) {

        console.error("PDF Load Error:", error);

        loading.classList.add("hidden");

        errorBox.classList.add("active");

        errorMessage.textContent =
          "File PDF tidak dapat dimuat. Pastikan nama dan lokasi file PDF sudah benar.";

      }

    }


    /* =========================================================
       RENDER HALAMAN
    ========================================================= */

    async function renderPage(
      pageNumber,
      canvas,
      container
    ) {

      if (
        !pdfDoc ||
        pageNumber < 1 ||
        pageNumber > totalPages
      ) {

        canvas.width = 1;
        canvas.height = 1;

        canvas.style.display = "none";

        return;

      }


      canvas.style.display = "block";


      const page = await pdfDoc.getPage(pageNumber);


      /*
        Ambil viewport asli.
      */

      const baseViewport =
        page.getViewport({ scale: 1 });


      /*
        Ukuran container.
      */

      const containerWidth =
        container.clientWidth;

      const containerHeight =
        container.clientHeight;


      /*
        Scale berdasarkan ukuran halaman
        dan container.

        Math.max digunakan agar halaman
        memenuhi area dan tidak menyisakan
        ruang kosong.
      */

      const scaleX =
        containerWidth / baseViewport.width;

      const scaleY =
        containerHeight / baseViewport.height;


      /*
        Menggunakan MAX agar PDF memenuhi
        area.

        Zoom tambahan tetap dibatasi.
      */

      const scale =
        Math.max(scaleX, scaleY)
        * zoomLevel;


      const viewport =
        page.getViewport({
          scale: scale
        });


      /*
        Device pixel ratio untuk tampilan tajam.
      */

      const outputScale =
        window.devicePixelRatio || 1;


      canvas.width =
        Math.floor(
          viewport.width * outputScale
        );

      canvas.height =
        Math.floor(
          viewport.height * outputScale
        );


      canvas.style.width =
        `${viewport.width}px`;

      canvas.style.height =
        `${viewport.height}px`;


      /*
        Posisi canvas di tengah.
      */

      const offsetX =
        (containerWidth - viewport.width) / 2;

      const offsetY =
        (containerHeight - viewport.height) / 2;


      canvas.style.position = "absolute";

      canvas.style.left =
        `${offsetX}px`;

      canvas.style.top =
        `${offsetY}px`;


      const context =
        canvas.getContext("2d", {
          alpha: false
        });


      context.setTransform(
        outputScale,
        0,
        0,
        outputScale,
        0,
        0
      );


      await page.render({

        canvasContext: context,

        viewport: viewport,

        transform: [
          outputScale,
          0,
          0,
          outputScale,
          0,
          0
        ]

      }).promise;

    }


    /* =========================================================
       RENDER SPREAD
    ========================================================= */

    async function renderSpread() {

      if (!pdfDoc) {
        return;
      }


      if (rendering) {

        pendingRender = true;

        return;

      }


      rendering = true;


      try {

        /*
          Halaman kiri.
        */

        const leftPageNumber =
          currentPage;


        /*
          Halaman kanan.
        */

        const rightPageNumber =
          currentPage + 1;


        await Promise.all([

          renderPage(
            leftPageNumber,
            canvasLeft,
            pageLeft
          ),

          renderPage(
            rightPageNumber,
            canvasRight,
            pageRight
          )

        ]);


        pageInput.value =
          currentPage;


        updateControls();


      } catch (error) {

        console.error(
          "Render Error:",
          error
        );

      } finally {

        rendering = false;


        if (pendingRender) {

          pendingRender = false;

          renderSpread();

        }

      }

    }


    /* =========================================================
       UPDATE CONTROLS
    ========================================================= */

    function updateControls() {

      prevBtn.disabled =
        currentPage <= 1;


      nextBtn.disabled =
        currentPage + 2 > totalPages;

    }


    /* =========================================================
       NEXT PAGE
    ========================================================= */

    nextBtn.addEventListener(
      "click",
      () => {

        if (
          currentPage + 2 <= totalPages
        ) {

          currentPage += 2;

          renderSpread();

        }

      }
    );


    /* =========================================================
       PREVIOUS PAGE
    ========================================================= */

    prevBtn.addEventListener(
      "click",
      () => {

        if (
          currentPage - 2 >= 1
        ) {

          currentPage -= 2;

          renderSpread();

        }

      }
    );


    /* =========================================================
       PAGE INPUT
    ========================================================= */

    pageInput.addEventListener(
      "change",
      () => {

        let value =
          parseInt(pageInput.value, 10);


        if (
          Number.isNaN(value)
        ) {

          value = 1;

        }


        value =
          Math.max(
            1,
            Math.min(
              value,
              totalPages
            )
          );


        /*
          Pastikan halaman dimulai dari
          pasangan spread ganjil.
        */

        if (value % 2 === 0) {

          value -= 1;

        }


        currentPage = value;

        renderSpread();

      }
    );


    /* =========================================================
       ZOOM IN
    ========================================================= */

    zoomInBtn.addEventListener(
      "click",
      () => {

        zoomLevel =
          Math.min(
            zoomLevel + 0.05,
            1.25
          );

        renderSpread();

      }
    );


    /* =========================================================
       ZOOM OUT
    ========================================================= */

    zoomOutBtn.addEventListener(
      "click",
      () => {

        zoomLevel =
          Math.max(
            zoomLevel - 0.05,
            0.90
          );

        renderSpread();

      }
    );


    /* =========================================================
       FULLSCREEN
    ========================================================= */

    fullscreenBtn.addEventListener(
      "click",
      async () => {

        try {

          if (
            !document.fullscreenElement
          ) {

            await bookStage.requestFullscreen();

          } else {

            await document.exitFullscreen();

          }

        } catch (error) {

          console.error(
            "Fullscreen Error:",
            error
          );

        }

      }
    );


    /* =========================================================
       RESIZE

       Debounce agar PDF tidak dirender berulang-ulang
       ketika ukuran browser berubah.
    ========================================================= */

    let resizeTimer = null;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(resizeTimer);

        resizeTimer =
          setTimeout(
            () => {

              renderSpread();

            },
            250
          );

      }
    );


    /* =========================================================
       KEYBOARD NAVIGATION
    ========================================================= */

    window.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "ArrowRight"
        ) {

          nextBtn.click();

        }


        if (
          event.key === "ArrowLeft"
        ) {

          prevBtn.click();

        }

      }
    );


    /* =========================================================
       START
    ========================================================= */

    loadPDF();

  </script>

</body>
</html>
