<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-book Interaktif – Pedoman Monitoring SPJ</title>

<style>

:root{
  --navy:#17365d;
  --blue:#245b91;
}

*{
  box-sizing:border-box;
}

/* =========================================
   BACKGROUND UTAMA – PUTIH
   ========================================= */

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#ffffff;
}

body{
  background:#ffffff;
}

#viewer{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:0;
  background:#ffffff;
  perspective:1800px;
}

/* =========================================
   BOOK SHELL
   ========================================= */

#bookShell{
  position:relative;
  perspective:2600px;
  transform-style:preserve-3d;
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
  margin:0 auto;
  transform-origin:center center;
  isolation:isolate;
  filter:drop-shadow(0 18px 24px rgba(0,0,0,.22));
}

/* =========================================
   FLIPBOOK
   ========================================= */

#flipBook{
  position:relative;
  margin:auto;
  touch-action:none;
  z-index:3;
  isolation:isolate;
  transform-style:preserve-3d;
  transform:translateY(-1px);
}

#flipBook .page{
  position:relative;
  overflow:hidden;
  background:#fff;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
  transform:translateZ(0);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.06),
    0 2px 5px rgba(0,0,0,.08),
    inset 0 0 12px rgba(25,45,70,.04);
}

#flipBook .page:active{
  cursor:grabbing;
}

#flipBook .page-content{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
}

#flipBook .page canvas{
  display:block;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* =========================================
   EFEK BAYANGAN HALAMAN
   ========================================= */

#flipBook .page::before,
#flipBook .page::after{
  content:'';
  position:absolute;
  top:0;
  bottom:0;
  width:7%;
  z-index:20;
  pointer-events:none;
}

#flipBook .page::before{
  left:0;
  background:linear-gradient(
    to right,
    rgba(0,0,0,.14),
    rgba(0,0,0,.04) 35%,
    rgba(0,0,0,0)
  );
}

#flipBook .page::after{
  right:0;
  background:linear-gradient(
    to left,
    rgba(0,0,0,.14),
    rgba(0,0,0,.04) 35%,
    rgba(0,0,0,0)
  );
}

#flipBook [class*="stf__"]{
  transform-style:preserve-3d !important;
  backface-visibility:hidden !important;
  -webkit-backface-visibility:hidden !important;
}

/* =========================================
   OVERLAY FORM
   ========================================= */

#flipBook .page-overlay{
  position:absolute;
  z-index:30;
}

#flipBook .form-overlay{
  left:5.7%;
  top:10.5%;
  width:88.6%;
  height:84.5%;
  border:0;
  background:transparent;
  overflow:hidden;
}

#flipBook .form-overlay iframe{
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  display:block;
}

/* =========================================
   DOWNLOAD BUTTON
   ========================================= */

#flipBook .download-overlay{
  top:8%;
  left:5%;
  width:90%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  line-height:normal;
  flex-wrap:wrap;
}

#flipBook .download-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:8px 12px;
  background:#0757c9;
  color:#fff;
  text-decoration:none;
  border-radius:7px;
  font:700 11px Arial,sans-serif;
  text-align:center;
  box-shadow:0 3px 8px rgba(7,87,201,.20);
  transition:.2s ease;
}

#flipBook .download-btn:hover{
  transform:translateY(-1px);
  background:#064bab;
}

/* =========================================
   TOOLBAR
   ========================================= */

#toolbar{
  position:fixed;
  left:50%;
  bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:100;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:8px 13px;

  border-radius:999px;

  background:rgba(23,54,93,.88);
  border:1px solid rgba(255,255,255,.35);

  -webkit-backdrop-filter:blur(20px) saturate(160%);
  backdrop-filter:blur(20px) saturate(160%);

  color:#fff;
  line-height:1;

  box-shadow:
    0 6px 22px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.16);
}

#toolbar button{
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  color:#fff;

  width:34px;
  height:34px;
  padding:0;

  font-size:19px;
  cursor:pointer;

  display:inline-flex;
  align-items:center;
  justify-content:center;
}

#toolbar button:hover{
  background:rgba(255,255,255,.24);
}

#toolbar button:disabled{
  opacity:.3;
  cursor:not-allowed;
}

#pageNum{
  width:42px;
  padding:6px 3px;
  text-align:center;

  border:1px solid rgba(255,255,255,.3);
  border-radius:999px;

  background:rgba(255,255,255,.12);
  color:#fff;
  outline:none;
}

#pageStatus{
  font-size:12px;
  white-space:nowrap;
}

/* =========================================
   MESSAGE & LOADING
   ========================================= */

#message{
  color:#17365d;
  background:#fff;
  padding:22px;
  border-radius:10px;
  max-width:600px;
  font:14px/1.5 Arial,sans-serif;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

#loading{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.88);
  color:#17365d;

  z-index:300;
  font-size:13px;
}

#loading.show{
  display:flex;
}

/* =========================================
   BOOK FRAME ASSET
   ========================================= */

.book-frame-asset{
  position:absolute;
  left:50%;
  top:50%;

  width:calc(100% + 62px);
  height:calc(100% + 48px);

  transform:translate(-50%,-50%);

  object-fit:fill;
  object-position:center;

  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;

  z-index:0;

  filter:drop-shadow(0 18px 24px rgba(0,0,0,.20));
}

/* Flipbook berada di atas frame */

#flipBook{
  position:relative;
  z-index:2 !important;

  width:calc(100% - 42px) !important;
  height:calc(100% - 30px) !important;
}

/* Pastikan mesin PageFlip berada di atas frame */

#flipBook *,
.stf__parent,
.stf__block{
  z-index:2;
}

/* Hilangkan dekorasi CSS lama */

#flipBook::before,
#flipBook::after,
#bookShell::before,
#bookShell::after{
  display:none !important;
}

/* =========================================
   DESKTOP
   ========================================= */

@media (min-width:701px){

  #bookShell{
    padding:18px 22px 22px;
    box-sizing:border-box;
  }

  .book-frame-asset{
    width:calc(100% + 62px);
    height:calc(100% + 48px);
  }

  #flipBook{
    width:calc(100% - 42px) !important;
    height:calc(100% - 30px) !important;
  }
}

/* =========================================
   MOBILE
   ========================================= */

@media(max-width:700px){

  #viewer{
    padding:0;
  }

  #bookShell{
    width:100vw;
    height:100dvh;
    padding:10px 8px 14px;
    box-sizing:border-box;
  }

  .book-frame-asset{
    width:calc(100% + 22px);
    height:calc(100% + 20px);
  }

  #flipBook{
    width:calc(100% - 12px) !important;
    height:calc(100% - 12px) !important;
  }

  #toolbar{
    max-width:calc(100vw - 16px);
    gap:3px;
    padding:5px 8px;
    bottom:max(8px,env(safe-area-inset-bottom));
  }

  #toolbar button{
    width:30px;
    height:30px;
    font-size:16px;
  }

  #pageNum{
    width:36px;
    font-size:12px;
  }

  #pageStatus{
    font-size:10px;
  }

  #flipBook .download-overlay{
    top:7%;
    gap:5px;
  }

  #flipBook .download-btn{
    font-size:8px;
    padding:6px;
  }
}

</style>
</head>

<body>

<div id="viewer">
  <div id="message">E-book sedang dimuat…</div>
</div>

<div id="loading">Membuka halaman…</div>

<div id="toolbar" aria-label="Navigasi e-book">

  <button id="prev" type="button" title="Halaman sebelumnya">‹</button>

  <input
    id="pageNum"
    type="number"
    min="1"
    value="1"
  >

  <span id="pageStatus">/ 31</span>

  <button id="next" type="button" title="Halaman berikutnya">›</button>

  <button id="zoomOut" type="button" title="Perkecil">−</button>

  <button id="zoomIn" type="button" title="Perbesar">+</button>

  <button id="fullscreen" type="button" title="Layar penuh">⛶</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<script>

/* =========================================
   KONFIGURASI FILE
   ========================================= */

const PDF_URL='./Draft_Ebook_Rima_Lea_optimized.pdf';

const FORM_URL=
'https://script.google.com/macros/s/AKfycbw9HnoBDY_ta8zLam3T2tK5758b3kGou-kjzuVXFD7Afhle8LrHKdb3dXTPHWgnjqGc/exec';

const CHECKLIST_FILE='./Format_Checklist.docx';

const BUKTI_BERKAS_FILE=
'./Format_Bukti_Pengumpulan_berkas.docx';


/* =========================================
   PDF.JS
   ========================================= */

const pdfjsLib=window.pdfjsLib;

pdfjsLib.GlobalWorkerOptions.workerSrc=
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';


/* =========================================
   VARIABLES
   ========================================= */

let pdfDoc=null;
let pageFlip=null;
let currentPage=1;
let zoom=1;

let renderCache=new Map();

const MAX_CACHE=8;

const viewer=document.getElementById('viewer');

const pageInput=document.getElementById('pageNum');

const pageStatus=document.getElementById('pageStatus');

const loading=document.getElementById('loading');

const isMobile=()=>window.matchMedia('(max-width:700px)').matches;


/* =========================================
   CACHE KEY
   ========================================= */

function cacheKey(n,w){
  return `${n}-${Math.round(w)}`;
}


/* =========================================
   RENDER PDF PAGE
   ========================================= */

async function renderPdfPage(n,targetWidth){

  const key=cacheKey(n,targetWidth);

  if(renderCache.has(key)){
    return renderCache.get(key);
  }

  const page=await pdfDoc.getPage(n);

  const base=page.getViewport({
    scale:1
  });

  const scale=targetWidth/base.width;

  const viewport=page.getViewport({
    scale
  });

  const ratio=Math.min(
    window.devicePixelRatio||1,
    1.5
  );

  const canvas=document.createElement('canvas');

  canvas.width=Math.ceil(viewport.width*ratio);

  canvas.height=Math.ceil(viewport.height*ratio);

  canvas.style.width='100%';

  canvas.style.height='100%';

  await page.render({

    canvasContext:canvas.getContext('2d',{
      alpha:false
    }),

    viewport,

    transform:
      ratio!==1
        ?[ratio,0,0,ratio,0,0]
        :null

  }).promise;

  renderCache.set(key,canvas);


  while(renderCache.size>MAX_CACHE){

    const first=
      renderCache.keys().next().value;

    const old=
      renderCache.get(first);

    old.width=0;

    old.height=0;

    renderCache.delete(first);

  }

  return canvas;

}


/* =========================================
   TAMBAHKAN FORM & DOWNLOAD BUTTON
   ========================================= */

function addOverlay(pageEl,n){

  /* FORM UPLOAD */

  if(n===13){

    const overlay=document.createElement('div');

    overlay.className=
      'page-overlay form-overlay';


    const frame=document.createElement('iframe');

    frame.src=FORM_URL;

    frame.title=
      'Formulir Pengumpulan Dokumen SPJ';

    frame.setAttribute(
      'scrolling',
      'no'
    );


    overlay.appendChild(frame);

    pageEl.appendChild(overlay);

  }


  /* DOWNLOAD FORMAT */

  if(n===18){

    const overlay=document.createElement('div');

    overlay.className=
      'page-overlay download-overlay';


    const a=document.createElement('a');

    a.href=CHECKLIST_FILE;

    a.download=
      'Format_Checklist.docx';

    a.className='download-btn';

    a.textContent=
      '↓ Download Format Checklist';


    const b=document.createElement('a');

    b.href=BUKTI_BERKAS_FILE;

    b.download=
      'Format_Bukti_Pengumpulan_berkas.docx';

    b.className='download-btn';

    b.textContent=
      '↓ Download Format Bukti Pengumpulan Berkas';


    overlay.append(a,b);

    pageEl.appendChild(overlay);

  }

}


/* =========================================
   BUILD BOOK
   ========================================= */

async function buildBook(){

  loading.classList.add('show');

  try{

    pdfDoc=
      await pdfjsLib.getDocument({
        url:PDF_URL
      }).promise;


    const viewerW=
      Math.max(
        320,
        viewer.clientWidth
      );


    const viewerH=
      Math.max(
        360,
        viewer.clientHeight
      );


    const first=
      await pdfDoc.getPage(1);


    const base=
      first.getViewport({
        scale:1
      });


    const mobile=isMobile();


    /* Menentukan ukuran halaman
       agar proporsi PDF tetap terjaga */

    const pageW=Math.floor(

      Math.min(

        mobile
          ?viewerW
          :viewerW/2,

        viewerH*
        base.width/
        base.height

      )

    );


    const pageH=Math.floor(

      pageW*
      base.height/
      base.width

    );


    /* =========================================
       BOOK SHELL
       ========================================= */

    const shell=
      document.createElement('div');


    shell.id='bookShell';


    /* =========================================
       BOOK FRAME ASSET
       ========================================= */

    const bookFrame=
      document.createElement('img');


    bookFrame.src=
      './assets/book-frame.png';


    bookFrame.className=
      'book-frame-asset';


    bookFrame.alt='';


    bookFrame.setAttribute(
      'aria-hidden',
      'true'
    );


    shell.appendChild(bookFrame);


    /* =========================================
       FLIPBOOK
       ========================================= */

    const book=
      document.createElement('div');


    book.id='flipBook';


    book.setAttribute(
      'aria-label',
      'Tarik sudut halaman untuk membalik lembaran buku'
    );


    shell.appendChild(book);


    viewer.replaceChildren(shell);


    /* =========================================
       BUAT SEMUA HALAMAN
       ========================================= */

    const pages=[];


    for(
      let n=1;
      n<=pdfDoc.numPages;
      n++
    ){

      const page=
        document.createElement('div');


      page.className='page';


      const content=
        document.createElement('div');


      content.className='page-content';


      const canvas=
        await renderPdfPage(
          n,
          pageW
        );


      const visible=
        document.createElement('canvas');


      visible.width=
        canvas.width;


      visible.height=
        canvas.height;


      visible.style.width='100%';

      visible.style.height='100%';


      visible
        .getContext('2d',{
          alpha:false
        })
        .drawImage(
          canvas,
          0,
          0
        );


      content.appendChild(visible);


      addOverlay(
        content,
        n
      );


      page.appendChild(content);


      pages.push(page);

    }


    /* =========================================
       INITIALISASI PAGEFLIP
       ========================================= */

    pageFlip=
      new St.PageFlip(

        book,

        {

          width:pageW,

          height:pageH,

          size:'stretch',

          minWidth:260,

          maxWidth:pageW,

          minHeight:340,

          maxHeight:pageH,

          maxShadowOpacity:.92,

          showCover:false,

          mobileScrollSupport:false,

          usePortrait:mobile,

          drawShadow:true,

          flippingTime:1250,

          startPage:0,

          autoSize:true,

          clickEventForward:true,

          useMouseEvents:true,

          swipeDistance:24,

          showPageCorners:true,

          disableFlipByClick:false

        }

      );


    /* Muat semua halaman */

    pageFlip.loadFromHTML(pages);


    /* =========================================
       EVENT FLIP
       ========================================= */

    pageFlip.on(
      'flip',

      e=>{

        currentPage=
          e.data+1;


        pageInput.value=
          currentPage;


        const total=
          pdfDoc.numPages;


        const visible=
          pageFlip.getOrientation()==='landscape'

            ?`${currentPage}–${Math.min(
                currentPage+1,
                total
              )}`

            :`${currentPage}`;


        pageStatus.textContent=
          `${visible} / ${total}`;


        document.getElementById(
          'prev'
        ).disabled=
          currentPage<=1;


        document.getElementById(
          'next'
        ).disabled=
          currentPage>=total-1;

      }

    );


    /* =========================================
       INITIAL STATUS
       ========================================= */

    currentPage=1;


    pageInput.value=1;


    pageInput.max=
      pdfDoc.numPages;


    pageStatus.textContent=
      `1–2 / ${pdfDoc.numPages}`;


    document.getElementById(
      'prev'
    ).disabled=true;


    document.getElementById(
      'next'
    ).disabled=false;


  }catch(err){

    viewer.innerHTML=

      '<div id="message">'+
      '<strong>E-book belum dapat dimuat.</strong>'+
      '<br>'+
      'Periksa koneksi internet, file PDF, dan library flipbook.'+
      '</div>';


    console.error(err);

  }finally{

    loading.classList.remove('show');

  }

}


/* =========================================
   NAVIGASI PREVIOUS
   ========================================= */

document.getElementById('prev').onclick=()=>{

  if(!pageFlip)return;

  pageFlip.flipPrev('bottom');

};


/* =========================================
   NAVIGASI NEXT
   ========================================= */

document.getElementById('next').onclick=()=>{

  if(!pageFlip)return;

  pageFlip.flipNext('bottom');

};


/* =========================================
   INPUT NOMOR HALAMAN
   ========================================= */

pageInput.onchange=()=>{

  const n=Math.max(

    1,

    Math.min(

      pdfDoc?.numPages||1,

      Number(pageInput.value)||1

    )

  );


  pageFlip?.turnToPage(
    n-1
  );

};


/* =========================================
   ZOOM IN
   ========================================= */

document.getElementById('zoomIn').onclick=()=>{

  zoom=Math.min(
    1.35,
    zoom+.1
  );


  const shell=
    document.getElementById('bookShell');


  if(shell){

    shell.style.transform=
      `scale(${zoom})`;

  }

};


/* =========================================
   ZOOM OUT
   ========================================= */

document.getElementById('zoomOut').onclick=()=>{

  zoom=Math.max(
    .75,
    zoom-.1
  );


  const shell=
    document.getElementById('bookShell');


  if(shell){

    shell.style.transform=
      `scale(${zoom})`;

  }

};


/* =========================================
   FULLSCREEN
   ========================================= */

document.getElementById('fullscreen').onclick=()=>{

  if(!document.fullscreenElement){

    document.documentElement
      .requestFullscreen?.();

  }else{

    document.exitFullscreen?.();

  }

};


/* =========================================
   RESPONSIVE
   ========================================= */

let resizeTimer;


window.addEventListener(

  'resize',

  ()=>{

    clearTimeout(resizeTimer);


    resizeTimer=
      setTimeout(

        ()=>location.reload(),

        350

      );

  }

);


/* =========================================
   KEYBOARD
   ========================================= */

document.addEventListener(

  'keydown',

  e=>{

    if(
      e.target===pageInput
    )return;


    if(
      e.key==='ArrowRight'
    ){

      pageFlip?.flipNext();

    }


    if(
      e.key==='ArrowLeft'
    ){

      pageFlip?.flipPrev();

    }

  }

);


/* =========================================
   START
   ========================================= */

buildBook();

</script>

</body>
</html>
