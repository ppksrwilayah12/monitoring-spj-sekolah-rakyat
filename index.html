<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-book Interaktif – Pedoman Monitoring SPJ</title>

<style>
:root{
  --navy:#17365d;
  --blue:#245b91;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#20242a;
  font-family:Arial,Helvetica,sans-serif;
}

#viewer{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:10px;
  perspective:1800px;
}

#pageStage{
  position:relative;
  flex:none;
  transform-style:preserve-3d;
  transform-origin:center center;
}

#pageWrap{
  position:relative;
  background:#fff;
  line-height:0;
  box-shadow:0 5px 24px #0005;
  overflow:hidden;
  backface-visibility:hidden;
  transform-style:preserve-3d;
  transform-origin:left center;
  will-change:transform,opacity,filter;
}

#pdfCanvas{
  display:block;
  max-width:none;
  height:auto;
}

/* FORM UPLOAD HALAMAN 13 */
#formOverlay{
  display:none;
  position:absolute;
  left:5.7%;
  top:10.5%;
  width:88.6%;
  height:84.5%;
  z-index:3;
  border:0;
  background:transparent;
  overflow:hidden;
}

#formOverlay.active{
  display:block;
}

#formFrame{
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  display:block;
  overflow:hidden;
}

/* TOMBOL DOWNLOAD HALAMAN 18 */
#downloadOverlay{
  position:absolute;
  top:8%;
  left:50%;
  transform:translateX(-50%);
  width:76%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  z-index:4;
  line-height:normal;
}

.download-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:10px 16px;
  background:#0757c9;
  color:#ffffff;
  text-decoration:none;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  text-align:center;
  box-shadow:0 3px 8px rgba(7,87,201,.20);
  transition:all .2s ease;
}

.download-btn:hover{
  background:#0649a8;
  transform:translateY(-2px);
}

/* TOOLBAR */
#toolbar{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:10;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border-radius:12px;
  background:rgba(30,38,48,.76);
  backdrop-filter:blur(8px);
  color:#fff;
  line-height:1;
  box-shadow:0 2px 12px #0003;
}

#toolbar button{
  border:0;
  border-radius:6px;
  background:transparent;
  color:#fff;
  padding:7px 9px;
  font-size:18px;
  cursor:pointer;
}

#toolbar button:hover{
  background:#ffffff25;
}

#toolbar button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

#pageNum{
  width:44px;
  padding:6px 4px;
  text-align:center;
  border:1px solid #ffffff55;
  border-radius:5px;
  background:#ffffff20;
  color:#fff;
}

#pageStatus{
  font-size:12px;
  white-space:nowrap;
}

#message{
  color:#17365d;
  background:white;
  padding:22px;
  border-radius:8px;
  max-width:600px;
  font:14px/1.5 Arial,sans-serif;
}

#loading{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#20242a88;
  color:#fff;
  z-index:8;
  font-size:13px;
}

#loading.show{
  display:flex;
}

/* ANIMASI HALAMAN — halaman tujuan sudah terlihat sejak frame pertama */
#pageStage{
  position:relative;
  flex:none;
  transform-style:preserve-3d;
  perspective:1800px;
}

.page-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  transform-origin:center center;
}

.page-layer.incoming{
  position:relative;
  z-index:1;
}

.page-layer.outgoing{
  z-index:2;
  pointer-events:none;
  transform-origin:left center;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  will-change:transform,filter,opacity;
}

.page-layer.outgoing.prev{
  transform-origin:right center;
}

#pageStage.animating .incoming{
  box-shadow:0 5px 24px #0005;
}

#pageStage.animating .outgoing.next{
  animation:turnSheetNext .72s cubic-bezier(.18,.72,.22,1) both;
}

#pageStage.animating .outgoing.prev{
  animation:turnSheetPrev .72s cubic-bezier(.18,.72,.22,1) both;
}

/* Lembaran lama langsung terangkat, sementara halaman baru sudah tampak di bawah */
@keyframes turnSheetNext{
  0%{
    transform:perspective(1800px) rotateY(0deg);
    filter:brightness(1);
    opacity:1;
  }
  30%{
    transform:perspective(1800px) rotateY(-32deg);
    filter:brightness(.82);
    opacity:1;
  }
  70%{
    transform:perspective(1800px) rotateY(-108deg);
    filter:brightness(.64);
    opacity:.98;
  }
  100%{
    transform:perspective(1800px) rotateY(-180deg);
    filter:brightness(.55);
    opacity:0;
  }
}

@keyframes turnSheetPrev{
  0%{
    transform:perspective(1800px) rotateY(0deg);
    filter:brightness(1);
    opacity:1;
  }
  30%{
    transform:perspective(1800px) rotateY(32deg);
    filter:brightness(.82);
    opacity:1;
  }
  70%{
    transform:perspective(1800px) rotateY(108deg);
    filter:brightness(.64);
    opacity:.98;
  }
  100%{
    transform:perspective(1800px) rotateY(180deg);
    filter:brightness(.55);
    opacity:0;
  }
}

/* Bayangan lipatan mengikuti lembar yang terangkat */
.page-layer.outgoing::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg,
    rgba(0,0,0,.18),
    rgba(0,0,0,.02) 30%,
    transparent 55%,
    rgba(0,0,0,.28));
  mix-blend-mode:multiply;
  opacity:.8;
}

.page-layer.outgoing.prev::after{
  background:linear-gradient(90deg,
    rgba(0,0,0,.28),
    transparent 45%,
    rgba(0,0,0,.02) 70%,
    rgba(0,0,0,.18));
}
/* ================================
   RESPONSIVE TOMBOL DOWNLOAD
   ================================ */

/* LAPTOP / LAYAR MENENGAH */
@media (min-width: 601px) and (max-width: 1366px){

  #downloadOverlay{
    width:70%;
    top:8%;
    gap:10px;
  }

  .download-btn{
    min-height:32px;
    padding:7px 12px;
    font-size:10px;
    border-radius:6px;
  }
}


/* MOBILE */
@media(max-width:600px){

  #viewer{
    padding:2px;
  }

  #toolbar{
    bottom:6px;
    gap:3px;
    padding:5px 7px;
  }

  #toolbar button{
    padding:6px;
    font-size:16px;
  }

  #formOverlay{
    left:3%;
    width:94%;
    top:10%;
    height:85%;
  }

  /* Tombol download pada halaman checklist */
  #downloadOverlay{
    width:88%;
    top:7.5%;
    gap:6px;
  }

  .download-btn{
    min-height:30px;
    padding:6px 7px;
    font-size:8px;
    line-height:1.2;
    border-radius:5px;
  }
}


/* =========================================================
   MODE BUKU — DUA HALAMAN UNTUK LAPTOP / DESKTOP
   ========================================================= */
.book-shell{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  perspective:2400px;
  overflow:visible;
}

.book-spread{
  position:relative;
  display:flex;
  align-items:stretch;
  justify-content:center;
  transform-style:preserve-3d;
  filter:drop-shadow(0 20px 24px rgba(0,0,0,.30));
}

.book-page{
  position:relative;
  overflow:hidden;
  background:#fff;
  flex:0 0 auto;
  box-shadow:inset 0 0 16px rgba(0,0,0,.05);
}

.book-page.left{
  border-radius:3px 0 0 3px;
  box-shadow:
    inset -18px 0 25px rgba(0,0,0,.10),
    inset 0 0 8px rgba(0,0,0,.04);
}

.book-page.right{
  border-radius:0 3px 3px 0;
  box-shadow:
    inset 18px 0 25px rgba(0,0,0,.10),
    inset 0 0 8px rgba(0,0,0,.04);
}

/* Punggung buku */
.book-spread::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:18px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,
    rgba(0,0,0,.20),
    rgba(255,255,255,.32) 22%,
    rgba(0,0,0,.14) 52%,
    rgba(255,255,255,.20) 78%,
    rgba(0,0,0,.24));
  z-index:20;
  pointer-events:none;
  opacity:.72;
}

/* Ketebalan lembar */
.book-spread::after{
  content:"";
  position:absolute;
  left:1.2%;
  right:1.2%;
  bottom:-8px;
  height:12px;
  border-radius:0 0 5px 5px;
  background:repeating-linear-gradient(
    0deg,
    rgba(255,255,255,.95) 0 1px,
    rgba(185,185,185,.45) 1px 2px
  );
  transform:perspective(800px) rotateX(-58deg);
  transform-origin:top;
  z-index:-1;
}

.book-page canvas{
  display:block;
  width:100%;
  height:100%;
}

/* Lembaran yang sedang dibalik */
.book-flip-sheet{
  position:absolute;
  top:0;
  bottom:0;
  width:50%;
  z-index:40;
  transform-style:preserve-3d;
  will-change:transform;
  pointer-events:none;
}

.book-flip-sheet.next{
  right:0;
  transform-origin:left center;
}

.book-flip-sheet.prev{
  left:0;
  transform-origin:right center;
}

.book-flip-face{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:#fff;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  transform-style:preserve-3d;
}

.book-flip-face.back{
  transform:rotateY(180deg);
}

.book-flip-face canvas{
  width:100%;
  height:100%;
  display:block;
}

/* Cahaya dan bayangan lembar */
.book-flip-sheet::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:5;
  background:linear-gradient(90deg,
    rgba(0,0,0,.20),
    transparent 35%,
    transparent 65%,
    rgba(0,0,0,.18));
  opacity:.55;
}

.book-flip-sheet.prev::after{
  background:linear-gradient(90deg,
    rgba(0,0,0,.18),
    transparent 35%,
    transparent 65%,
    rgba(0,0,0,.20));
}

.book-flip-sheet.next.running{
  animation:realBookNext .9s cubic-bezier(.20,.62,.18,1) forwards;
}

.book-flip-sheet.prev.running{
  animation:realBookPrev .9s cubic-bezier(.20,.62,.18,1) forwards;
}

@keyframes realBookNext{
  0%{
    transform:rotateY(0deg);
    filter:brightness(1);
  }
  15%{
    transform:rotateY(-18deg);
    filter:brightness(.93);
  }
  48%{
    transform:rotateY(-88deg);
    filter:brightness(.72);
  }
  75%{
    transform:rotateY(-150deg);
    filter:brightness(.84);
  }
  100%{
    transform:rotateY(-180deg);
    filter:brightness(1);
  }
}

@keyframes realBookPrev{
  0%{
    transform:rotateY(0deg);
    filter:brightness(1);
  }
  15%{
    transform:rotateY(18deg);
    filter:brightness(.93);
  }
  48%{
    transform:rotateY(88deg);
    filter:brightness(.72);
  }
  75%{
    transform:rotateY(150deg);
    filter:brightness(.84);
  }
  100%{
    transform:rotateY(180deg);
    filter:brightness(1);
  }
}

/* Mode satu halaman tetap digunakan di mobile */
@media (max-width: 760px){
  .book-shell{
    perspective:1800px;
  }
  .book-spread{
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.28));
  }
  .book-spread::before,
  .book-spread::after{
    display:none;
  }
  .book-page.left{
    display:none;
  }
  .book-page{
    box-shadow:0 5px 24px rgba(0,0,0,.30);
    border-radius:3px;
  }
}
</style>
</head>

<body>

<div id="viewer">
  <div id="message">E-book sedang dimuat…</div>
</div>

<div id="loading">Membuka halaman…</div>

<div id="toolbar" aria-label="Navigasi e-book">
  <button id="prev" type="button" title="Halaman sebelumnya">‹</button>
  <input id="pageNum" type="number" min="1" value="1">
  <span id="pageStatus">/ 31</span>
  <button id="next" type="button" title="Halaman berikutnya">›</button>
  <button id="zoomOut" type="button" title="Perkecil">−</button>
  <button id="zoomIn" type="button" title="Perbesar">+</button>
  <button id="fullscreen" type="button" title="Layar penuh">⛶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

/* FILE EBOOK */
const PDF_URL='./Draft_Ebook_Rima_Lea_optimized.pdf';

/* FORM UPLOAD SPJ */
const FORM_URL='https://script.google.com/macros/s/AKfycbw9HnoBDY_ta8zLam3T2tK5758b3kGou-kjzuVXFD7Afhle8LrHKdb3dXTPHWgnjqGc/exec';

/* FILE DOWNLOAD HALAMAN 18 */
const CHECKLIST_FILE='./Format_Checklist.docx';
const BUKTI_BERKAS_FILE='./Format_Bukti_Pengumpulan_berkas.docx';

const pdfjsLib=window.pdfjsLib;

pdfjsLib.GlobalWorkerOptions.workerSrc=
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc=null;
let currentPage=1;
let zoom=1;
let rendering=false;
let pendingPage=null;
let hasShownFirstPage=false;
const pageCache=new Map();
const CACHE_LIMIT=6;

const viewer=document.getElementById('viewer');
const pageInput=document.getElementById('pageNum');
const pageStatus=document.getElementById('pageStatus');
const loading=document.getElementById('loading');



function getScale(page){
  const unit=page.getViewport({scale:1});
  const availableW=Math.max(240,window.innerWidth-24);
  const availableH=Math.max(320,window.innerHeight-24);
  return Math.min(
    availableW/unit.width,
    availableH/unit.height
  )*zoom;
}

function cacheKey(number){
  return `${number}@${zoom.toFixed(2)}@${window.innerWidth}x${window.innerHeight}`;
}

function trimCache(){
  while(pageCache.size>CACHE_LIMIT){
    pageCache.delete(pageCache.keys().next().value);
  }
}

async function getRenderedPage(number){
  if(!pdfDoc) throw new Error('PDF belum dimuat');

  const key=cacheKey(number);
  if(pageCache.has(key)) return pageCache.get(key);

  const page=await pdfDoc.getPage(number);
  const scale=getScale(page);
  const viewport=page.getViewport({scale});
  const ratio=Math.min(window.devicePixelRatio||1,2);

  const canvas=document.createElement('canvas');
  canvas.width=Math.ceil(viewport.width*ratio);
  canvas.height=Math.ceil(viewport.height*ratio);
  canvas.style.width=viewport.width+'px';
  canvas.style.height=viewport.height+'px';

  const ctx=canvas.getContext('2d');
  await page.render({
    canvasContext:ctx,
    viewport,
    transform:ratio!==1?[ratio,0,0,ratio,0,0]:null
  }).promise;

  const rendered={
    width:viewport.width,
    height:viewport.height,
    canvas
  };

  pageCache.set(key,rendered);
  trimCache();
  return rendered;
}

async function preloadAround(number){
  const targets=[
    number-2,number-1,number+1,number+2
  ].filter(n=>n>=1&&n<=pdfDoc.numPages);

  Promise.all(
    targets.map(n=>getRenderedPage(n).catch(()=>null))
  ).catch(()=>{});
}

function createPageContent(number,rendered){
  const wrap=document.createElement('div');
  wrap.className='page-content-wrap';
  wrap.id='pageWrap';
  wrap.style.width=rendered.width+'px';
  wrap.style.height=rendered.height+'px';
  wrap.style.position='relative';
  wrap.style.background='#fff';
  wrap.style.lineHeight='0';
  wrap.style.boxShadow='0 5px 24px #0005';
  wrap.style.overflow='hidden';

  const canvas=document.createElement('canvas');
  canvas.id='pdfCanvas';
  canvas.width=rendered.canvas.width;
  canvas.height=rendered.canvas.height;
  canvas.style.width=rendered.width+'px';
  canvas.style.height=rendered.height+'px';
  canvas.getContext('2d').drawImage(rendered.canvas,0,0);
  wrap.appendChild(canvas);

  if(number===13){
    const overlay=document.createElement('div');
    overlay.id='formOverlay';
    overlay.className='active';
    const frame=document.createElement('iframe');
    frame.id='formFrame';
    frame.src=FORM_URL;
    frame.title='Formulir Pengumpulan Dokumen SPJ';
    frame.setAttribute('scrolling','no');
    overlay.appendChild(frame);
    wrap.appendChild(overlay);
  }

  if(number===18){
    const downloadOverlay=document.createElement('div');
    downloadOverlay.id='downloadOverlay';

    const checklist=document.createElement('a');
    checklist.href=CHECKLIST_FILE;
    checklist.download='Format_Checklist.docx';
    checklist.className='download-btn';
    checklist.textContent='↓ Download Format Checklist';

    const bukti=document.createElement('a');
    bukti.href=BUKTI_BERKAS_FILE;
    bukti.download='Format_Bukti_Pengumpulan_berkas.docx';
    bukti.textContent='↓ Download Format Bukti Pengumpulan Berkas';
    bukti.className='download-btn';

    downloadOverlay.append(checklist,bukti);
    wrap.appendChild(downloadOverlay);
  }

  return wrap;
}

function updateControls(){
  pageInput.value=currentPage;
  document.getElementById('prev').disabled=currentPage===1;
  document.getElementById('next').disabled=currentPage===pdfDoc.numPages;
  pageStatus.textContent='/ '+pdfDoc.numPages;
}

async function renderPage(number,direction='next'){
  if(!pdfDoc) return;

  number=Math.max(1,Math.min(pdfDoc.numPages,number));

  if(rendering){
    pendingPage={number,direction};
    return;
  }

  if(number===currentPage && hasShownFirstPage) return;

  rendering=true;
  loading.classList.add('show');

  try{
    // Halaman tujuan dirender sepenuhnya SEBELUM animasi dimulai.
    const target=await getRenderedPage(number);

    if(!hasShownFirstPage){
      currentPage=number;
      const stage=document.createElement('div');
      stage.id='pageStage';
      stage.style.width=target.width+'px';
      stage.style.height=target.height+'px';

      const incoming=document.createElement('div');
      incoming.className='page-layer incoming';
      incoming.appendChild(createPageContent(number,target));
      stage.appendChild(incoming);

      viewer.replaceChildren(stage);
      hasShownFirstPage=true;
      updateControls();
      preloadAround(number);
      return;
    }

    // Simpan tampilan halaman lama. Halaman baru ditempatkan di bawahnya
    // sebelum frame pertama animasi.
    const oldStage=document.getElementById('pageStage');
    const oldWrap=oldStage?.querySelector('.incoming .page-content-wrap');

    const stage=document.createElement('div');
    stage.id='pageStage';
    stage.className='animating';
    stage.style.width=target.width+'px';
    stage.style.height=target.height+'px';

    const incoming=document.createElement('div');
    incoming.className='page-layer incoming';
    incoming.appendChild(createPageContent(number,target));

    stage.appendChild(incoming);

    if(oldWrap){
      const outgoing=document.createElement('div');
      outgoing.className=`page-layer outgoing ${direction==='prev'?'prev':'next'}`;
      outgoing.style.width=target.width+'px';
      outgoing.style.height=target.height+'px';
      outgoing.appendChild(oldWrap.cloneNode(true));
      stage.appendChild(outgoing);
    }

    viewer.replaceChildren(stage);

    // Paksa browser melakukan layout: halaman baru sudah terlihat di bawah
    // sebelum kelas animasi mulai bekerja.
    void stage.offsetWidth;

    currentPage=number;
    updateControls();

    const outgoing=stage.querySelector('.outgoing');
    if(outgoing){
      await new Promise(resolve=>{
        const finish=()=>resolve();
        outgoing.addEventListener('animationend',finish,{once:true});
        setTimeout(finish,850);
      });
      stage.classList.remove('animating');
      outgoing.remove();
    }

    preloadAround(number);

  }catch(err){
    viewer.innerHTML=
      '<div id="message">Halaman tidak dapat ditampilkan. Silakan muat ulang e-book.</div>';
    console.error(err);
  }finally{
    loading.classList.remove('show');
    rendering=false;

    if(pendingPage){
      const next=pendingPage;
      pendingPage=null;
      if(next.number!==currentPage){
        renderPage(next.number,next.direction);
      }
    }
  }
}


function isDesktopBook(){
  return window.innerWidth > 760;
}

async function renderPageToCanvas(number, maxW, maxH){
  const page=await pdfDoc.getPage(number);
  const unit=page.getViewport({scale:1});
  const scale=Math.min(maxW/unit.width,maxH/unit.height)*zoom;
  const viewport=page.getViewport({scale});
  const ratio=Math.min(window.devicePixelRatio||1,2);

  const canvas=document.createElement('canvas');
  canvas.width=Math.ceil(viewport.width*ratio);
  canvas.height=Math.ceil(viewport.height*ratio);
  canvas.style.width=viewport.width+'px';
  canvas.style.height=viewport.height+'px';

  const ctx=canvas.getContext('2d');
  await page.render({
    canvasContext:ctx,
    viewport,
    transform:ratio!==1?[ratio,0,0,ratio,0,0]:null
  }).promise;

  return {canvas,width:viewport.width,height:viewport.height};
}

function makeBookPage(rendered, side){
  const page=document.createElement('div');
  page.className='book-page '+side;
  page.style.width=rendered.width+'px';
  page.style.height=rendered.height+'px';
  page.appendChild(rendered.canvas);
  return page;
}

async function renderBookSpread(startPage, direction='next'){
  // startPage adalah halaman kiri pada spread desktop.
  startPage=Math.max(1,Math.min(pdfDoc.numPages,startPage));
  if(startPage % 2 === 0) startPage--;

  if(rendering){
    pendingPage={number:startPage,direction,book:true};
    return;
  }

  rendering=true;
  loading.classList.add('show');

  try{
    const availableW=Math.max(360,window.innerWidth-28);
    const availableH=Math.max(320,window.innerHeight-38);

    // Setiap halaman memakai setengah lebar spread.
    const pageW=availableW/2;

    const leftNum=startPage;
    const rightNum=Math.min(pdfDoc.numPages,startPage+1);

    // Render halaman tujuan sebelum animasi dimulai.
    const [leftRender,rightRender]=await Promise.all([
      renderPageToCanvas(leftNum,pageW,availableH),
      rightNum!==leftNum ? renderPageToCanvas(rightNum,pageW,availableH) : null
    ]);

    const shell=document.createElement('div');
    shell.className='book-shell';

    const spread=document.createElement('div');
    spread.className='book-spread';
    spread.style.width=(leftRender.width+(rightRender?rightRender.width:leftRender.width))+'px';
    spread.style.height=leftRender.height+'px';

    // Jika halaman pertama ganjil: halaman 1 kiri, halaman 2 kanan.
    spread.appendChild(makeBookPage(leftRender,'left'));
    if(rightRender){
      spread.appendChild(makeBookPage(rightRender,'right'));
    }else{
      const blank=document.createElement('div');
      blank.className='book-page right';
      blank.style.width=leftRender.width+'px';
      blank.style.height=leftRender.height+'px';
      spread.appendChild(blank);
    }

    shell.appendChild(spread);

    const oldShell=viewer.querySelector('.book-shell');

    // Halaman baru sudah lengkap di belakang lembar animasi.
    viewer.replaceChildren(shell);

    if(oldShell && hasShownFirstPage){
      const oldSpread=oldShell.querySelector('.book-spread');
      const oldPages=oldSpread?.querySelectorAll('.book-page');

      if(oldPages?.length>=2){
        const flip=document.createElement('div');
        const isPrev=direction==='prev';
        flip.className='book-flip-sheet '+(isPrev?'prev':'next');

        // Untuk NEXT: lembar kanan lama dibalik ke kiri.
        // Untuk PREVIOUS: lembar kiri lama dibalik ke kanan.
        const source=isPrev ? oldPages[0] : oldPages[1];
        const clone=source.cloneNode(true);
        clone.className='book-flip-face front';

        // Bagian belakang lembar menggunakan halaman yang sudah tersedia
        // dari spread baru, sehingga terlihat sejak lembar mulai berputar.
        const targetPage=isPrev ? spread.querySelector('.book-page.left') : spread.querySelector('.book-page.right');
        const back=targetPage.cloneNode(true);
        back.className='book-flip-face back';

        flip.style.width=source.offsetWidth+'px';
        flip.style.height=source.offsetHeight+'px';
        flip.append(clone,back);
        spread.appendChild(flip);

        // Force layout agar halaman tujuan benar-benar tampil sebelum frame animasi.
        void flip.offsetWidth;
        flip.classList.add('running');

        await new Promise(resolve=>{
          flip.addEventListener('animationend',resolve,{once:true});
          setTimeout(resolve,1050);
        });
        flip.remove();
      }
    }

    currentPage=startPage;
    hasShownFirstPage=true;
    updateControls();
    preloadAround(startPage);

  }catch(err){
    console.error(err);
    viewer.innerHTML='<div id="message">Halaman tidak dapat ditampilkan.</div>';
  }finally{
    loading.classList.remove('show');
    rendering=false;

    if(pendingPage){
      const next=pendingPage;
      pendingPage=null;
      if(next.book) renderBookSpread(next.number,next.direction);
      else renderPage(next.number,next.direction);
    }
  }
}

async function renderResponsivePage(number,direction='next'){
  if(isDesktopBook()){
    const spreadStart=(number % 2 === 0) ? number-1 : number;
    return renderBookSpread(spreadStart,direction);
  }
  return renderPage(number,direction);
}


async function loadPdf(){

  try{

    pdfDoc=await pdfjsLib
      .getDocument({url:PDF_URL})
      .promise;

    pageStatus.textContent='/ '+pdfDoc.numPages;

    await renderPage(1,'next');


  }catch(error){

    viewer.innerHTML=
      '<div id="message"><strong>PDF belum dapat dimuat.</strong><br>Pastikan file PDF berada satu folder dengan index.html.</div>';

    console.error(error);
  }
}


/* NAVIGASI HALAMAN */

document.getElementById('prev').onclick=()=>{
  renderResponsivePage(isDesktopBook()?Math.max(1,currentPage-2):currentPage-1,'prev');
};

document.getElementById('next').onclick=()=>{
  renderResponsivePage(isDesktopBook()?Math.min(pdfDoc.numPages,currentPage+2):currentPage+1,'next');
};

pageInput.onchange=()=>{

  const target=Number(pageInput.value)||1;

  renderPage(
    target,
    target<currentPage?'prev':'next'
  );
};


/* ZOOM */

document.getElementById('zoomIn').onclick=()=>{
  zoom=Math.min(1.8,zoom+.1);
  renderPage(currentPage,'next');
};

document.getElementById('zoomOut').onclick=()=>{
  zoom=Math.max(.55,zoom-.1);
  renderPage(currentPage,'next');
};


/* FULLSCREEN */

document.getElementById('fullscreen').onclick=()=>{

  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.();
  }else{
    document.exitFullscreen?.();
  }
};


/* RESPONSIVE */

window.addEventListener('resize',()=>{

  if(pdfDoc){
    renderPage(currentPage,'next');
  }
});


/* NAVIGASI KEYBOARD */

document.addEventListener('keydown',event=>{

  if(event.target===pageInput)return;

  if(event.key==='ArrowRight'){
    renderResponsivePage(isDesktopBook()?Math.min(pdfDoc.numPages,currentPage+2):currentPage+1,'next');
  }

  if(event.key==='ArrowLeft'){
    renderResponsivePage(isDesktopBook()?Math.max(1,currentPage-2):currentPage-1,'prev');
  }
});


/* NAVIGASI SWIPE */

let touchStartX=0;

viewer.addEventListener(
  'touchstart',
  e=>{
    touchStartX=e.changedTouches[0].screenX;
  },
  {passive:true}
);

viewer.addEventListener(
  'touchend',
  e=>{

    const dx=e.changedTouches[0].screenX-touchStartX;

    if(Math.abs(dx)>65){

      renderPage(
        currentPage+(dx<0?1:-1),
        dx<0?'next':'prev'
      );
    }
  },
  {passive:true}
);


/* MEMUAT EBOOK */

loadPdf();

</script>
