<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-book Interaktif – Pedoman Monitoring SPJ</title>

<style>
:root{
  --navy:#17365d;
  --blue:#245b91;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#20242a;
  font-family:Arial,Helvetica,sans-serif;
}

#viewer{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:10px;
  perspective:1800px;
}

#pageStage{
  position:relative;
  flex:none;
  transform-style:preserve-3d;
  transform-origin:center center;
}

#pageWrap{
  position:relative;
  background:#fff;
  line-height:0;
  box-shadow:0 5px 24px #0005;
  overflow:hidden;
  backface-visibility:hidden;
  transform-style:preserve-3d;
  transform-origin:left center;
  will-change:transform,opacity,filter;
}

#pdfCanvas{
  display:block;
  max-width:none;
  height:auto;
}

/* FORM UPLOAD HALAMAN 13 */
#formOverlay{
  display:none;
  position:absolute;
  left:5.7%;
  top:10.5%;
  width:88.6%;
  height:84.5%;
  z-index:3;
  border:0;
  background:transparent;
  overflow:hidden;
}

#formOverlay.active{
  display:block;
}

#formFrame{
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  display:block;
  overflow:hidden;
}

/* TOMBOL DOWNLOAD HALAMAN 18 */
#downloadOverlay{
  position:absolute;
  top:8%;
  left:50%;
  transform:translateX(-50%);
  width:76%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  z-index:4;
  line-height:normal;
}

.download-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:10px 16px;
  background:#0757c9;
  color:#ffffff;
  text-decoration:none;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  text-align:center;
  box-shadow:0 3px 8px rgba(7,87,201,.20);
  transition:all .2s ease;
}

.download-btn:hover{
  background:#0649a8;
  transform:translateY(-2px);
}

/* TOOLBAR */
#toolbar{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:10;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border-radius:12px;
  background:rgba(30,38,48,.76);
  backdrop-filter:blur(8px);
  color:#fff;
  line-height:1;
  box-shadow:0 2px 12px #0003;
}

#toolbar button{
  border:0;
  border-radius:6px;
  background:transparent;
  color:#fff;
  padding:7px 9px;
  font-size:18px;
  cursor:pointer;
}

#toolbar button:hover{
  background:#ffffff25;
}

#toolbar button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

#pageNum{
  width:44px;
  padding:6px 4px;
  text-align:center;
  border:1px solid #ffffff55;
  border-radius:5px;
  background:#ffffff20;
  color:#fff;
}

#pageStatus{
  font-size:12px;
  white-space:nowrap;
}

#message{
  color:#17365d;
  background:white;
  padding:22px;
  border-radius:8px;
  max-width:600px;
  font:14px/1.5 Arial,sans-serif;
}

#loading{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#20242a88;
  color:#fff;
  z-index:8;
  font-size:13px;
}

#loading.show{
  display:flex;
}

/* ANIMASI HALAMAN */
@keyframes pageTurnNext{
  0%{
    opacity:.35;
    transform:perspective(1400px) rotateY(-24deg) translateX(52px) scale(.985);
    filter:brightness(.72);
  }
  45%{
    opacity:.9;
    transform:perspective(1400px) rotateY(7deg) translateX(-8px) scale(.995);
    filter:brightness(1.08);
  }
  100%{
    opacity:1;
    transform:perspective(1400px) rotateY(0) translateX(0) scale(1);
    filter:brightness(1);
  }
}

@keyframes pageTurnPrev{
  0%{
    opacity:.35;
    transform:perspective(1400px) rotateY(24deg) translateX(-52px) scale(.985);
    filter:brightness(.72);
  }
  45%{
    opacity:.9;
    transform:perspective(1400px) rotateY(-7deg) translateX(8px) scale(.995);
    filter:brightness(1.08);
  }
  100%{
    opacity:1;
    transform:perspective(1400px) rotateY(0) translateX(0) scale(1);
    filter:brightness(1);
  }
}

#pageWrap.turn-next{
  animation:pageTurnNext .72s cubic-bezier(.2,.75,.25,1) both;
}

#pageWrap.turn-prev{
  animation:pageTurnPrev .72s cubic-bezier(.2,.75,.25,1) both;
}

/* ================================
   RESPONSIVE TOMBOL DOWNLOAD
   ================================ */

/* LAPTOP / LAYAR MENENGAH */
@media (min-width: 601px) and (max-width: 1366px){

  #downloadOverlay{
    width:70%;
    top:8%;
    gap:10px;
  }

  .download-btn{
    min-height:32px;
    padding:7px 12px;
    font-size:10px;
    border-radius:6px;
  }
}


/* MOBILE */
@media(max-width:600px){

  #viewer{
    padding:2px;
  }

  #toolbar{
    bottom:6px;
    gap:3px;
    padding:5px 7px;
  }

  #toolbar button{
    padding:6px;
    font-size:16px;
  }

  #formOverlay{
    left:3%;
    width:94%;
    top:10%;
    height:85%;
  }

  /* Tombol download pada halaman checklist */
  #downloadOverlay{
    width:88%;
    top:7.5%;
    gap:6px;
  }

  .download-btn{
    min-height:30px;
    padding:6px 7px;
    font-size:8px;
    line-height:1.2;
    border-radius:5px;
  }
}
</style>
</head>

<body>

<div id="viewer">
  <div id="message">E-book sedang dimuat…</div>
</div>

<div id="loading">Membuka halaman…</div>

<div id="toolbar" aria-label="Navigasi e-book">
  <button id="prev" type="button" title="Halaman sebelumnya">‹</button>
  <input id="pageNum" type="number" min="1" value="1">
  <span id="pageStatus">/ 31</span>
  <button id="next" type="button" title="Halaman berikutnya">›</button>
  <button id="zoomOut" type="button" title="Perkecil">−</button>
  <button id="zoomIn" type="button" title="Perbesar">+</button>
  <button id="fullscreen" type="button" title="Layar penuh">⛶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

/* FILE EBOOK */
const PDF_URL='./Draft_Ebook_Rima_Lea_optimized.pdf';

/* FORM UPLOAD SPJ */
const FORM_URL='https://script.google.com/macros/s/AKfycbw9HnoBDY_ta8zLam3T2tK5758b3kGou-kjzuVXFD7Afhle8LrHKdb3dXTPHWgnjqGc/exec';

/* FILE DOWNLOAD HALAMAN 18 */
const CHECKLIST_FILE='./Format_Checklist.docx';
const BUKTI_BERKAS_FILE='./Format_Bukti_Pengumpulan_berkas.docx';

const pdfjsLib=window.pdfjsLib;

pdfjsLib.GlobalWorkerOptions.workerSrc=
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc=null;
let currentPage=1;
let zoom=1;
let rendering=false;
let pendingPage=null;
let hasShownFirstPage=false;

const viewer=document.getElementById('viewer');
const pageInput=document.getElementById('pageNum');
const pageStatus=document.getElementById('pageStatus');
const loading=document.getElementById('loading');


function getScale(page){

  const unit=page.getViewport({scale:1});

  const availableW=Math.max(240,window.innerWidth-24);
  const availableH=Math.max(320,window.innerHeight-24);

  return Math.min(
    availableW/unit.width,
    availableH/unit.height
  )*zoom;
}


async function renderPage(number,direction='next'){

  if(!pdfDoc)return;

  if(rendering){
    pendingPage={number,direction};
    return;
  }

  rendering=true;

  currentPage=Math.max(
    1,
    Math.min(pdfDoc.numPages,number)
  );

  pageInput.value=currentPage;

  loading.classList.add('show');

  try{

    const page=await pdfDoc.getPage(currentPage);
    const scale=getScale(page);
    const viewport=page.getViewport({scale});

    const stage=document.createElement('div');
    stage.id='pageStage';

    stage.style.width=viewport.width+'px';
    stage.style.height=viewport.height+'px';


    const wrap=document.createElement('div');
    wrap.id='pageWrap';

    wrap.style.width=viewport.width+'px';
    wrap.style.height=viewport.height+'px';


    const canvas=document.createElement('canvas');
    canvas.id='pdfCanvas';

    const ratio=Math.min(
      window.devicePixelRatio||1,
      2
    );

    canvas.width=Math.ceil(viewport.width*ratio);
    canvas.height=Math.ceil(viewport.height*ratio);

    canvas.style.width=viewport.width+'px';
    canvas.style.height=viewport.height+'px';

    wrap.appendChild(canvas);


    /* FORM UPLOAD PADA HALAMAN 13 */
    if(currentPage===13){

      const overlay=document.createElement('div');
      overlay.id='formOverlay';
      overlay.className='active';

      const frame=document.createElement('iframe');
      frame.id='formFrame';
      frame.src=FORM_URL;
      frame.title='Formulir Pengumpulan Dokumen SPJ';
      frame.setAttribute('scrolling','no');

      overlay.appendChild(frame);
      wrap.appendChild(overlay);
    }


    /* TOMBOL DOWNLOAD PADA HALAMAN 18 */
    if(currentPage===18){

      const downloadOverlay=document.createElement('div');
      downloadOverlay.id='downloadOverlay';


      const checklist=document.createElement('a');
      checklist.href=CHECKLIST_FILE;
      checklist.download='Format_Checklist.docx';
      checklist.className='download-btn';
      checklist.textContent='↓ Download Format Checklist';


      const bukti=document.createElement('a');
      bukti.href=BUKTI_BERKAS_FILE;
      bukti.download='Format_Bukti_Pengumpulan_berkas.docx';
      bukti.className='download-btn';
      bukti.textContent='↓ Download Format Bukti Pengumpulan Berkas';


      downloadOverlay.appendChild(checklist);
      downloadOverlay.appendChild(bukti);

      wrap.appendChild(downloadOverlay);
    }


    stage.appendChild(wrap);
    viewer.replaceChildren(stage);


    const ctx=canvas.getContext('2d');

    await page.render({
      canvasContext:ctx,
      viewport,
      transform:ratio!==1
        ?[ratio,0,0,ratio,0,0]
        :null
    }).promise;


    if(hasShownFirstPage){

      wrap.classList.add(
        direction==='prev'
          ?'turn-prev'
          :'turn-next'
      );
    }

    hasShownFirstPage=true;


    document.getElementById('prev').disabled=
      currentPage===1;

    document.getElementById('next').disabled=
      currentPage===pdfDoc.numPages;

    pageStatus.textContent='/ '+pdfDoc.numPages;


  }catch(err){

    viewer.innerHTML=
      '<div id="message">Halaman tidak dapat ditampilkan. Silakan muat ulang e-book.</div>';

    console.error(err);

  }finally{

    loading.classList.remove('show');
    rendering=false;

    if(pendingPage){

      const next=pendingPage;
      pendingPage=null;

      renderPage(
        next.number,
        next.direction
      );
    }
  }
}


async function loadPdf(){

  try{

    pdfDoc=await pdfjsLib
      .getDocument({url:PDF_URL})
      .promise;

    pageStatus.textContent='/ '+pdfDoc.numPages;

    await renderPage(1,'next');


  }catch(error){

    viewer.innerHTML=
      '<div id="message"><strong>PDF belum dapat dimuat.</strong><br>Pastikan file PDF berada satu folder dengan index.html.</div>';

    console.error(error);
  }
}


/* NAVIGASI HALAMAN */

document.getElementById('prev').onclick=()=>{
  renderPage(currentPage-1,'prev');
};

document.getElementById('next').onclick=()=>{
  renderPage(currentPage+1,'next');
};

pageInput.onchange=()=>{

  const target=Number(pageInput.value)||1;

  renderPage(
    target,
    target<currentPage?'prev':'next'
  );
};


/* ZOOM */

document.getElementById('zoomIn').onclick=()=>{
  zoom=Math.min(1.8,zoom+.1);
  renderPage(currentPage,'next');
};

document.getElementById('zoomOut').onclick=()=>{
  zoom=Math.max(.55,zoom-.1);
  renderPage(currentPage,'next');
};


/* FULLSCREEN */

document.getElementById('fullscreen').onclick=()=>{

  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.();
  }else{
    document.exitFullscreen?.();
  }
};


/* RESPONSIVE */

window.addEventListener('resize',()=>{

  if(pdfDoc){
    renderPage(currentPage,'next');
  }
});


/* NAVIGASI KEYBOARD */

document.addEventListener('keydown',event=>{

  if(event.target===pageInput)return;

  if(event.key==='ArrowRight'){
    renderPage(currentPage+1,'next');
  }

  if(event.key==='ArrowLeft'){
    renderPage(currentPage-1,'prev');
  }
});


/* NAVIGASI SWIPE */

let touchStartX=0;

viewer.addEventListener(
  'touchstart',
  e=>{
    touchStartX=e.changedTouches[0].screenX;
  },
  {passive:true}
);

viewer.addEventListener(
  'touchend',
  e=>{

    const dx=e.changedTouches[0].screenX-touchStartX;

    if(Math.abs(dx)>65){

      renderPage(
        currentPage+(dx<0?1:-1),
        dx<0?'next':'prev'
      );
    }
  },
  {passive:true}
);


/* MEMUAT EBOOK */

loadPdf();

</script>

</body>
</html>
