<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>E-Book Interaktif – Pedoman Monitoring SPJ</title>

  <style>
    /* =========================================================
       RESET & VARIABEL
    ========================================================= */

    :root {
      --bg-1: #14243a;
      --bg-2: #263c5b;
      --bg-3: #49698f;
      --toolbar-bg: rgba(235, 243, 255, 0.14);
      --toolbar-border: rgba(255, 255, 255, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg-1);
    }


    /* =========================================================
       VIEWER UTAMA
    ========================================================= */

    #viewer {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(
          ellipse at center,
          var(--bg-3) 0%,
          var(--bg-2) 58%,
          var(--bg-1) 100%
        );

      perspective: 2000px;
    }


    /* =========================================================
       BOOK SHELL

       Ukuran shell mengikuti ukuran buku.
       BUKAN lagi 100vw x 100vh.
    ========================================================= */

    #bookShell {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      transform-origin: center center;
      transition: transform 0.2s ease;

      isolation: isolate;
    }


    /* =========================================================
       BOOK FRAME ASSET
    ========================================================= */

    .book-frame-asset {
      position: absolute;

      left: 50%;
      top: 50%;

      /*
        Frame sedikit lebih besar daripada spread ebook.
        Nilai ini bisa disesuaikan jika diperlukan.
      */
      width: calc(100% + 42px);
      height: calc(100% + 42px);

      transform: translate(-50%, -50%);

      object-fit: fill;

      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;

      z-index: 1;

      filter:
        drop-shadow(0 18px 28px rgba(0, 0, 0, 0.38));
    }


    /* =========================================================
       FLIPBOOK
    ========================================================= */

    #flipBook {
      position: relative;

      z-index: 2;

      transform-style: preserve-3d;

      touch-action: none;
    }


    /* =========================================================
       HALAMAN
    ========================================================= */

    #flipBook .page {
      position: relative;

      overflow: hidden;

      background: #ffffff;

      cursor: grab;

      user-select: none;
      -webkit-user-select: none;

      transform-style: preserve-3d;

      box-shadow:
        inset 0 0 10px rgba(0, 0, 0, 0.04);
    }

    #flipBook .page:active {
      cursor: grabbing;
    }


    /* =========================================================
       KONTEN PDF
    ========================================================= */

    #flipBook .page-content {
      position: relative;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #ffffff;
    }

    #flipBook .page canvas {
      display: block;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }


    /* =========================================================
       SHADING HALAMAN

       Memberikan sedikit kedalaman,
       tetapi tidak menutupi konten PDF.
    ========================================================= */

    #flipBook .page::before,
    #flipBook .page::after {
      content: "";

      position: absolute;

      top: 0;
      bottom: 0;

      width: 4%;

      pointer-events: none;

      z-index: 10;
    }

    #flipBook .page::before {
      left: 0;

      background:
        linear-gradient(
          to right,
          rgba(0, 0, 0, 0.10),
          rgba(0, 0, 0, 0.025),
          transparent
        );
    }

    #flipBook .page::after {
      right: 0;

      background:
        linear-gradient(
          to left,
          rgba(0, 0, 0, 0.10),
          rgba(0, 0, 0, 0.025),
          transparent
        );
    }


    /* =========================================================
       PAGEFLIP 3D
    ========================================================= */

    #flipBook [class*="stf__"] {
      transform-style: preserve-3d;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }


    /* =========================================================
       OVERLAY FORM
    ========================================================= */

    #flipBook .page-overlay {
      position: absolute;

      z-index: 30;
    }

    #flipBook .form-overlay {
      left: 5.7%;
      top: 10.5%;

      width: 88.6%;
      height: 84.5%;

      border: 0;

      background: transparent;

      overflow: hidden;
    }

    #flipBook .form-overlay iframe {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;

      background: transparent;
    }


    /* =========================================================
       DOWNLOAD BUTTON
    ========================================================= */

    #flipBook .download-overlay {
      top: 8%;
      left: 5%;

      width: 90%;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    #flipBook .download-btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 36px;

      padding: 9px 14px;

      border-radius: 8px;

      background: #0757c9;

      color: #ffffff;

      text-decoration: none;

      font:
        700 11px/1.2 Arial,
        sans-serif;

      text-align: center;

      box-shadow:
        0 4px 10px rgba(7, 87, 201, 0.25);

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    #flipBook .download-btn:hover {
      background: #0649a8;

      transform: translateY(-1px);
    }


    /* =========================================================
       TOOLBAR
    ========================================================= */

    #toolbar {
      position: fixed;

      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));

      transform: translateX(-50%);

      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      padding: 8px 13px;

      border:
        1px solid var(--toolbar-border);

      border-radius: 999px;

      background: var(--toolbar-bg);

      color: #ffffff;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);

      -webkit-backdrop-filter:
        blur(24px)
        saturate(180%);

      backdrop-filter:
        blur(24px)
        saturate(180%);
    }

    #toolbar button {
      width: 34px;
      height: 34px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.10);

      color: #ffffff;

      font-size: 19px;

      cursor: pointer;

      transition: background 0.15s ease;
    }

    #toolbar button:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    #toolbar button:disabled {
      opacity: 0.30;
      cursor: not-allowed;
    }

    #pageNum {
      width: 45px;

      padding: 6px 4px;

      border:
        1px solid rgba(255, 255, 255, 0.30);

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.12);

      color: #ffffff;

      text-align: center;

      outline: none;
    }

    #pageStatus {
      font-size: 12px;

      white-space: nowrap;

      text-shadow:
        0 1px 4px rgba(0, 0, 0, 0.45);
    }


    /* =========================================================
       MESSAGE & LOADING
    ========================================================= */

    #message {
      max-width: 600px;

      padding: 22px;

      border-radius: 10px;

      background: #ffffff;

      color: #17365d;

      font: 14px/1.5 Arial, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;

      z-index: 200;

      background: rgba(20, 36, 58, 0.60);

      color: #ffffff;

      font-size: 14px;
    }

    #loading.show {
      display: flex;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .book-frame-asset {
        width: calc(100% + 22px);
        height: calc(100% + 22px);
      }

      #toolbar {
        max-width: calc(100vw - 16px);

        gap: 3px;

        padding: 6px 9px;

        bottom:
          max(8px, env(safe-area-inset-bottom));
      }

      #toolbar button {
        width: 30px;
        height: 30px;

        font-size: 16px;
      }

      #pageNum {
        width: 38px;

        font-size: 12px;
      }

      #pageStatus {
        font-size: 10px;
      }

      #flipBook .download-overlay {
        top: 7%;

        gap: 5px;
      }

      #flipBook .download-btn {
        padding: 6px 8px;

        font-size: 8px;
      }
    }

  </style>
</head>


<body>

  <!-- VIEWER -->
  <div id="viewer">
    <div id="message">
      E-book sedang dimuat…
    </div>
  </div>


  <!-- LOADING -->
  <div id="loading">
    Membuka halaman…
  </div>


  <!-- TOOLBAR -->
  <div id="toolbar" aria-label="Navigasi e-book">

    <button
      id="prev"
      type="button"
      title="Halaman sebelumnya"
    >
      ‹
    </button>

    <input
      id="pageNum"
      type="number"
      min="1"
      value="1"
    >

    <span id="pageStatus">
      / 31
    </span>

    <button
      id="next"
      type="button"
      title="Halaman berikutnya"
    >
      ›
    </button>

    <button
      id="zoomOut"
      type="button"
      title="Perkecil"
    >
      −
    </button>

    <button
      id="zoomIn"
      type="button"
      title="Perbesar"
    >
      +
    </button>

    <button
      id="fullscreen"
      type="button"
      title="Layar penuh"
    >
      ⛶
    </button>

  </div>


  <!-- LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>


  <script>

    /* =========================================================
       KONFIGURASI FILE
    ========================================================= */

    const PDF_URL =
      './Draft_Ebook_Rima_Lea_optimized.pdf';

    const FORM_URL =
      'https://script.google.com/macros/s/AKfycbw9HnoBDY_ta8zLam3T2tK5758b3kGou-kjzuVXFD7Afhle8LrHKdb3dXTPHWgnjqGc/exec';

    const CHECKLIST_FILE =
      './Format_Checklist.docx';

    const BUKTI_BERKAS_FILE =
      './Format_Bukti_Pengumpulan_berkas.docx';

    const BOOK_FRAME =
      './assets/book-frame.png';


    /* =========================================================
       PDF.JS
    ========================================================= */

    const pdfjsLib = window.pdfjsLib;

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';


    /* =========================================================
       VARIABEL
    ========================================================= */

    let pdfDoc = null;

    let pageFlip = null;

    let currentPage = 1;

    let zoom = 1;

    const renderCache = new Map();

    const MAX_CACHE = 8;


    /* =========================================================
       ELEMENT
    ========================================================= */

    const viewer =
      document.getElementById('viewer');

    const pageInput =
      document.getElementById('pageNum');

    const pageStatus =
      document.getElementById('pageStatus');

    const loading =
      document.getElementById('loading');

    const prevButton =
      document.getElementById('prev');

    const nextButton =
      document.getElementById('next');


    /* =========================================================
       DETEKSI MOBILE
    ========================================================= */

    function isMobile() {

      return window.matchMedia(
        '(max-width: 700px)'
      ).matches;

    }


    /* =========================================================
       CACHE KEY
    ========================================================= */

    function cacheKey(pageNumber, width) {

      return `${pageNumber}-${Math.round(width)}`;

    }


    /* =========================================================
       RENDER PDF PAGE
    ========================================================= */

    async function renderPdfPage(
      pageNumber,
      targetWidth
    ) {

      const key =
        cacheKey(pageNumber, targetWidth);


      if (renderCache.has(key)) {

        return renderCache.get(key);

      }


      const page =
        await pdfDoc.getPage(pageNumber);


      const baseViewport =
        page.getViewport({
          scale: 1
        });


      const scale =
        targetWidth /
        baseViewport.width;


      const viewport =
        page.getViewport({
          scale
        });


      const pixelRatio =
        Math.min(
          window.devicePixelRatio || 1,
          1.5
        );


      const canvas =
        document.createElement('canvas');


      canvas.width =
        Math.ceil(
          viewport.width * pixelRatio
        );


      canvas.height =
        Math.ceil(
          viewport.height * pixelRatio
        );


      canvas.style.width = '100%';

      canvas.style.height = '100%';


      const context =
        canvas.getContext(
          '2d',
          {
            alpha: false
          }
        );


      await page.render({

        canvasContext: context,

        viewport,

        transform:
          pixelRatio !== 1
            ? [
                pixelRatio,
                0,
                0,
                pixelRatio,
                0,
                0
              ]
            : null

      }).promise;


      renderCache.set(
        key,
        canvas
      );


      while (
        renderCache.size >
        MAX_CACHE
      ) {

        const firstKey =
          renderCache
            .keys()
            .next()
            .value;


        const oldCanvas =
          renderCache.get(firstKey);


        oldCanvas.width = 0;

        oldCanvas.height = 0;


        renderCache.delete(firstKey);

      }


      return canvas;

    }


    /* =========================================================
       OVERLAY
    ========================================================= */

    function addOverlay(
      contentElement,
      pageNumber
    ) {

      /* -------------------------
         HALAMAN 13
         FORM UPLOAD SPJ
      ------------------------- */

      if (pageNumber === 13) {

        const overlay =
          document.createElement('div');


        overlay.className =
          'page-overlay form-overlay';


        const iframe =
          document.createElement('iframe');


        iframe.src =
          FORM_URL;


        iframe.title =
          'Formulir Pengumpulan Dokumen SPJ';


        iframe.setAttribute(
          'scrolling',
          'no'
        );


        overlay.appendChild(
          iframe
        );


        contentElement.appendChild(
          overlay
        );

      }


      /* -------------------------
         HALAMAN 18
         DOWNLOAD
      ------------------------- */

      if (pageNumber === 18) {

        const overlay =
          document.createElement('div');


        overlay.className =
          'page-overlay download-overlay';


        const checklist =
          document.createElement('a');


        checklist.href =
          CHECKLIST_FILE;


        checklist.download =
          'Format_Checklist.docx';


        checklist.className =
          'download-btn';


        checklist.textContent =
          '↓ Download Format Checklist';


        const bukti =
          document.createElement('a');


        bukti.href =
          BUKTI_BERKAS_FILE;


        bukti.download =
          'Format_Bukti_Pengumpulan_berkas.docx';


        bukti.className =
          'download-btn';


        bukti.textContent =
          '↓ Download Format Bukti Pengumpulan Berkas';


        overlay.append(
          checklist,
          bukti
        );


        contentElement.appendChild(
          overlay
        );

      }

    }


    /* =========================================================
       UPDATE STATUS
    ========================================================= */

    function updateStatus() {

      if (!pageFlip || !pdfDoc) {
        return;
      }


      const total =
        pdfDoc.numPages;


      currentPage =
        pageFlip.getCurrentPageIndex() + 1;


      pageInput.value =
        currentPage;


      const orientation =
        pageFlip.getOrientation();


      if (
        orientation === 'landscape'
      ) {

        const secondPage =
          Math.min(
            currentPage + 1,
            total
          );


        pageStatus.textContent =
          `${currentPage}–${secondPage} / ${total}`;

      } else {

        pageStatus.textContent =
          `${currentPage} / ${total}`;

      }


      prevButton.disabled =
        currentPage <= 1;


      nextButton.disabled =
        currentPage >= total - 1;

    }


    /* =========================================================
       MEMBUAT BUKU
    ========================================================= */

    async function buildBook() {

      loading.classList.add('show');


      try {

        /* -------------------------------------
           LOAD PDF
        ------------------------------------- */

        pdfDoc =
          await pdfjsLib
            .getDocument({
              url: PDF_URL
            })
            .promise;


        /* -------------------------------------
           UKURAN VIEWER
        ------------------------------------- */

        const viewerWidth =
          Math.max(
            320,
            viewer.clientWidth
          );


        const viewerHeight =
          Math.max(
            360,
            viewer.clientHeight
          );


        const mobile =
          isMobile();


        /* -------------------------------------
           AMBIL RASIO PDF
        ------------------------------------- */

        const firstPage =
          await pdfDoc.getPage(1);


        const base =
          firstPage.getViewport({
            scale: 1
          });


        const pageRatio =
          base.width /
          base.height;


        /* -------------------------------------
           AREA YANG AMAN

           Sisakan ruang untuk:
           - toolbar
           - frame buku
           - margin
        ------------------------------------- */

        const horizontalMargin =
          mobile ? 24 : 90;


        const verticalMargin =
          mobile ? 100 : 110;


        const availableWidth =
          viewerWidth -
          horizontalMargin;


        const availableHeight =
          viewerHeight -
          verticalMargin;


        let pageWidth;


        if (mobile) {

          pageWidth =
            Math.min(
              availableWidth,
              availableHeight *
              pageRatio
            );

        } else {

          /*
            Spread = 2 halaman
          */

          pageWidth =
            Math.min(
              availableWidth / 2,
              availableHeight *
              pageRatio
            );

        }


        pageWidth =
          Math.floor(pageWidth);


        const pageHeight =
          Math.floor(
            pageWidth /
            pageRatio
          );


        /*
          Ukuran shell = ukuran spread
        */

        const shellWidth =
          mobile
            ? pageWidth
            : pageWidth * 2;


        const shellHeight =
          pageHeight;


        /* -------------------------------------
           BOOK SHELL
        ------------------------------------- */

        const shell =
          document.createElement('div');


        shell.id =
          'bookShell';


        shell.style.width =
          `${shellWidth}px`;


        shell.style.height =
          `${shellHeight}px`;


        /* -------------------------------------
           BOOK FRAME
        ------------------------------------- */

        const frame =
          document.createElement('img');


        frame.src =
          BOOK_FRAME;


        frame.className =
          'book-frame-asset';


        frame.alt = '';


        frame.setAttribute(
          'aria-hidden',
          'true'
        );


        shell.appendChild(
          frame
        );


        /* -------------------------------------
           FLIPBOOK
        ------------------------------------- */

        const book =
          document.createElement('div');


        book.id =
          'flipBook';


        book.setAttribute(
          'aria-label',
          'Tarik sudut halaman untuk membalik lembaran buku'
        );


        shell.appendChild(
          book
        );


        /* -------------------------------------
           MASUKKAN KE VIEWER
        ------------------------------------- */

        viewer.replaceChildren(
          shell
        );


        /* -------------------------------------
           BUAT HALAMAN
        ------------------------------------- */

        const pages = [];


        for (
          let pageNumber = 1;
          pageNumber <= pdfDoc.numPages;
          pageNumber++
        ) {

          const page =
            document.createElement('div');


          page.className =
            'page';


          const content =
            document.createElement('div');


          content.className =
            'page-content';


          /* PDF */

          const cachedCanvas =
            await renderPdfPage(
              pageNumber,
              pageWidth
            );


          const visibleCanvas =
            document.createElement('canvas');


          visibleCanvas.width =
            cachedCanvas.width;


          visibleCanvas.height =
            cachedCanvas.height;


          visibleCanvas.style.width =
            '100%';


          visibleCanvas.style.height =
            '100%';


          visibleCanvas
            .getContext(
              '2d',
              {
                alpha: false
              }
            )
            .drawImage(
              cachedCanvas,
              0,
              0
            );


          content.appendChild(
            visibleCanvas
          );


          /* Overlay */

          addOverlay(
            content,
            pageNumber
          );


          page.appendChild(
            content
          );


          pages.push(
            page
          );

        }


        /* -------------------------------------
           PAGEFLIP
        ------------------------------------- */

        pageFlip =
          new St.PageFlip(
            book,
            {

              width:
                pageWidth,

              height:
                pageHeight,


              size:
                'fixed',


              minWidth:
                pageWidth,


              maxWidth:
                pageWidth,


              minHeight:
                pageHeight,


              maxHeight:
                pageHeight,


              showCover:
                false,


              mobileScrollSupport:
                false,


              usePortrait:
                mobile,


              drawShadow:
                true,


              maxShadowOpacity:
                0.75,


              flippingTime:
                950,


              startPage:
                0,


              autoSize:
                false,


              clickEventForward:
                true,


              useMouseEvents:
                true,


              swipeDistance:
                24,


              showPageCorners:
                true,


              disableFlipByClick:
                false

            }
          );


        /* -------------------------------------
           LOAD HALAMAN
        ------------------------------------- */

        pageFlip.loadFromHTML(
          pages
        );


        /* -------------------------------------
           EVENT FLIP
        ------------------------------------- */

        pageFlip.on(
          'flip',
          () => {

            updateStatus();

          }
        );


        /* -------------------------------------
           EVENT ORIENTATION
        ------------------------------------- */

        pageFlip.on(
          'changeOrientation',
          () => {

            updateStatus();

          }
        );


        /* -------------------------------------
           STATUS AWAL
        ------------------------------------- */

        currentPage = 1;


        pageInput.value =
          1;


        pageInput.max =
          pdfDoc.numPages;


        updateStatus();


      } catch (error) {

        console.error(error);


        viewer.innerHTML = `
          <div id="message">
            <strong>
              E-book belum dapat dimuat.
            </strong>

            <br><br>

            Periksa:

            <ul>
              <li>Nama file PDF</li>
              <li>Folder assets/book-frame.png</li>
              <li>Koneksi library PDF.js</li>
              <li>Koneksi library PageFlip</li>
            </ul>
          </div>
        `;

      } finally {

        loading.classList.remove(
          'show'
        );

      }

    }


    /* =========================================================
       NAVIGASI
    ========================================================= */

    prevButton.addEventListener(
      'click',
      () => {

        if (!pageFlip) {
          return;
        }


        pageFlip.flipPrev(
          'bottom'
        );

      }
    );


    nextButton.addEventListener(
      'click',
      () => {

        if (!pageFlip) {
          return;
        }


        pageFlip.flipNext(
          'bottom'
        );

      }
    );


    /* =========================================================
       INPUT NOMOR HALAMAN
    ========================================================= */

    pageInput.addEventListener(
      'change',
      () => {

        if (!pageFlip || !pdfDoc) {
          return;
        }


        let page =
          Number(
            pageInput.value
          );


        page =
          Math.max(
            1,
            Math.min(
              pdfDoc.numPages,
              page || 1
            )
          );


        pageFlip.turnToPage(
          page - 1
        );

      }
    );


    /* =========================================================
       ZOOM
    ========================================================= */

    function applyZoom() {

      const shell =
        document.getElementById(
          'bookShell'
        );


      if (!shell) {
        return;
      }


      shell.style.transform =
        `scale(${zoom})`;

    }


    document
      .getElementById('zoomIn')
      .addEventListener(
        'click',
        () => {

          zoom =
            Math.min(
              1.25,
              zoom + 0.05
            );


          applyZoom();

        }
      );


    document
      .getElementById('zoomOut')
      .addEventListener(
        'click',
        () => {

          zoom =
            Math.max(
              0.75,
              zoom - 0.05
            );


          applyZoom();

        }
      );


    /* =========================================================
       FULLSCREEN
    ========================================================= */

    document
      .getElementById('fullscreen')
      .addEventListener(
        'click',
        async () => {

          try {

            if (
              !document.fullscreenElement
            ) {

              await document
                .documentElement
                .requestFullscreen();

            } else {

              await document
                .exitFullscreen();

            }

          } catch (error) {

            console.error(error);

          }

        }
      );


    /* =========================================================
       KEYBOARD
    ========================================================= */

    document.addEventListener(
      'keydown',
      event => {

        if (
          event.target === pageInput
        ) {
          return;
        }


        if (
          event.key ===
          'ArrowRight'
        ) {

          pageFlip?.flipNext();

        }


        if (
          event.key ===
          'ArrowLeft'
        ) {

          pageFlip?.flipPrev();

        }

      }
    );


    /* =========================================================
       RESIZE

       Dibuat ulang agar ukuran PDF,
       frame, dan PageFlip tetap sinkron.
    ========================================================= */

    let resizeTimer;


    window.addEventListener(
      'resize',
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            () => {

              location.reload();

            },
            400
          );

      }
    );


    /* =========================================================
       MULAI
    ========================================================= */

    buildBook();

  </script>

</body>
</html>
