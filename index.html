<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-book Interaktif – Pedoman Monitoring SPJ</title>

<style>
:root {
  --primary: #245b91;
  --toolbar-bg: rgba(30, 38, 48, 0.78);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   AREA UTAMA E-BOOK
========================= */

#viewer {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 12px;
  perspective: 1800px;
  background: #ffffff;
}

#pageStage {
  position: relative;
  flex: none;
  transform-style: preserve-3d;
  transform-origin: center center;
}

#pageWrap {
  position: relative;
  background: #ffffff;
  line-height: 0;
  overflow: hidden;
  backface-visibility: hidden;
  transform-style: preserve-3d;
  transform-origin: left center;
  will-change: transform, opacity, filter;
}

#pdfCanvas {
  display: block;
  max-width: none;
  height: auto;
}

/* =========================
   OVERLAY FORMULIR
========================= */

#formOverlay {
  display: none;
  position: absolute;
  left: 5.7%;
  top: 10.5%;
  width: 88.6%;
  height: 84.5%;
  z-index: 3;
  border: 0;
  background: transparent;
  overflow: hidden;
}

#formOverlay.active {
  display: block;
}

#formFrame {
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
  display: block;
  overflow: hidden;
}

/* =========================
   TOOLBAR
========================= */

#toolbar {
  position: fixed;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  z-index: 20;

  display: flex;
  align-items: center;
  gap: 7px;

  padding: 7px 10px;

  border-radius: 14px;
  background: var(--toolbar-bg);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  color: #ffffff;
  line-height: 1;

  box-shadow: 0 2px 12px rgba(0,0,0,.20);
}

#toolbar button {
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: #ffffff;

  padding: 7px 9px;

  font-size: 18px;
  cursor: pointer;

  transition: background .2s ease;
}

#toolbar button:hover {
  background: rgba(255,255,255,.15);
}

#toolbar button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

#pageNum {
  width: 44px;
  padding: 6px 4px;

  text-align: center;

  border: 1px solid rgba(255,255,255,.35);
  border-radius: 6px;

  background: rgba(255,255,255,.12);
  color: #ffffff;

  outline: none;
}

#pageStatus {
  font-size: 12px;
  white-space: nowrap;
}

/* =========================
   PESAN
========================= */

#message {
  color: #17365d;
  background: #ffffff;

  padding: 22px;

  border-radius: 10px;

  max-width: 600px;

  font: 14px/1.5 Arial, sans-serif;
  text-align: center;

  box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

/* =========================
   LOADING
========================= */

#loading {
  position: fixed;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,.55);

  color: #17365d;

  z-index: 15;

  font-size: 13px;
}

#loading.show {
  display: flex;
}

/* =========================
   ANIMASI HALAMAN
========================= */

@keyframes pageTurnNext {
  0% {
    opacity: .35;
    transform:
      perspective(1400px)
      rotateY(-24deg)
      translateX(52px)
      scale(.985);

    filter: brightness(.72);
  }

  45% {
    opacity: .90;
    transform:
      perspective(1400px)
      rotateY(7deg)
      translateX(-8px)
      scale(.995);

    filter: brightness(1.08);
  }

  100% {
    opacity: 1;

    transform:
      perspective(1400px)
      rotateY(0)
      translateX(0)
      scale(1);

    filter: brightness(1);
  }
}

@keyframes pageTurnPrev {
  0% {
    opacity: .35;

    transform:
      perspective(1400px)
      rotateY(24deg)
      translateX(-52px)
      scale(.985);

    filter: brightness(.72);
  }

  45% {
    opacity: .90;

    transform:
      perspective(1400px)
      rotateY(-7deg)
      translateX(8px)
      scale(.995);

    filter: brightness(1.08);
  }

  100% {
    opacity: 1;

    transform:
      perspective(1400px)
      rotateY(0)
      translateX(0)
      scale(1);

    filter: brightness(1);
  }
}

#pageWrap.turn-next {
  animation: pageTurnNext .72s cubic-bezier(.2,.75,.25,1) both;
}

#pageWrap.turn-prev {
  animation: pageTurnPrev .72s cubic-bezier(.2,.75,.25,1) both;
}

/* =========================
   RESPONSIVE MOBILE
========================= */

@media (max-width: 600px) {

  #viewer {
    padding: 2px;
  }

  #toolbar {
    bottom: 6px;
    gap: 3px;
    padding: 5px 7px;
  }

  #toolbar button {
    padding: 6px;
    font-size: 16px;
  }

  #pageNum {
    width: 38px;
  }

  #formOverlay {
    left: 3%;
    width: 94%;
    top: 10%;
    height: 85%;
  }
}

@media (prefers-reduced-motion: reduce) {
  #pageWrap.turn-next,
  #pageWrap.turn-prev {
    animation: none;
  }
}
</style>
</head>

<body>

<!-- AREA E-BOOK -->
<div id="viewer">
  <div id="message">
    <strong>E-book sedang dimuat…</strong>
  </div>
</div>

<!-- LOADING -->
<div id="loading">
  Membuka halaman…
</div>

<!-- NAVIGASI -->
<div id="toolbar" aria-label="Navigasi e-book">

  <button
    id="prev"
    type="button"
    title="Halaman sebelumnya"
    aria-label="Halaman sebelumnya">
    ‹
  </button>

  <input
    id="pageNum"
    type="number"
    min="1"
    value="1"
    aria-label="Nomor halaman">

  <span id="pageStatus">/ 31</span>

  <button
    id="next"
    type="button"
    title="Halaman berikutnya"
    aria-label="Halaman berikutnya">
    ›
  </button>

  <button
    id="zoomOut"
    type="button"
    title="Perkecil"
    aria-label="Perkecil">
    −
  </button>

  <button
    id="zoomIn"
    type="button"
    title="Perbesar"
    aria-label="Perbesar">
    +
  </button>

  <button
    id="fullscreen"
    type="button"
    title="Layar penuh"
    aria-label="Layar penuh">
    ⛶
  </button>

</div>


<!-- PDF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

/* =========================================
   KONFIGURASI FILE
========================================= */

/* NAMA PDF DI ROOT REPOSITORY GITHUB */
const PDF_URL = "./Draft_Ebook_Rima_Lea_optimized.pdf";

/* FORM APPS SCRIPT */
const FORM_URL =
  "https://script.google.com/macros/s/AKfycbxxH0INi4GhjBhajRp4xscS26XTfobPA5lSQGOSveVPA6C1HVgymUhTiVkGZdguax5R/exec";


/* =========================================
   PDF.JS
========================================= */

const pdfjsLib = window.pdfjsLib;

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================
   VARIABEL UTAMA
========================================= */

let pdfDoc = null;

let currentPage = 1;

let zoom = 1;

let rendering = false;

let pendingPage = null;

let hasShownFirstPage = false;


/* =========================================
   ELEMENT
========================================= */

const viewer = document.getElementById("viewer");

const pageInput = document.getElementById("pageNum");

const pageStatus = document.getElementById("pageStatus");

const loading = document.getElementById("loading");

const prevButton = document.getElementById("prev");

const nextButton = document.getElementById("next");


/* =========================================
   MENGHITUNG UKURAN PDF
========================================= */

function getScale(page) {

  const unit = page.getViewport({
    scale: 1
  });

  /* Ruang tersedia */

  const availableWidth =
    Math.max(240, window.innerWidth - 24);

  /* Beri ruang toolbar */

  const availableHeight =
    Math.max(320, window.innerHeight - 85);

  /* PDF selalu menyesuaikan layar
     tanpa melebihi batas */

  return Math.min(
    availableWidth / unit.width,
    availableHeight / unit.height
  ) * zoom;
}


/* =========================================
   RENDER HALAMAN
========================================= */

async function renderPage(number, direction = "next") {

  if (!pdfDoc) return;


  /* Jika masih rendering,
     simpan halaman berikutnya */

  if (rendering) {

    pendingPage = {
      number,
      direction
    };

    return;
  }


  rendering = true;


  /* Batasi nomor halaman */

  currentPage = Math.max(
    1,
    Math.min(pdfDoc.numPages, number)
  );


  pageInput.value = currentPage;


  loading.classList.add("show");


  try {

    const page =
      await pdfDoc.getPage(currentPage);


    const scale =
      getScale(page);


    const viewport =
      page.getViewport({
        scale
      });


    /* STAGE */

    const stage =
      document.createElement("div");

    stage.id = "pageStage";

    stage.style.width =
      viewport.width + "px";

    stage.style.height =
      viewport.height + "px";


    /* WRAPPER */

    const wrap =
      document.createElement("div");

    wrap.id = "pageWrap";

    wrap.style.width =
      viewport.width + "px";

    wrap.style.height =
      viewport.height + "px";


    /* CANVAS */

    const canvas =
      document.createElement("canvas");

    canvas.id = "pdfCanvas";


    const ratio =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    canvas.width =
      Math.ceil(
        viewport.width * ratio
      );


    canvas.height =
      Math.ceil(
        viewport.height * ratio
      );


    canvas.style.width =
      viewport.width + "px";


    canvas.style.height =
      viewport.height + "px";


    wrap.appendChild(canvas);


    /* =====================================
       FORM OVERLAY HALAMAN 13
    ===================================== */

    if (currentPage === 13) {

      const overlay =
        document.createElement("div");

      overlay.id = "formOverlay";

      overlay.className = "active";


      const frame =
        document.createElement("iframe");

      frame.id = "formFrame";

      frame.src = FORM_URL;

      frame.title =
        "Formulir Pengumpulan Dokumen SPJ";

      frame.setAttribute(
        "scrolling",
        "no"
      );


      overlay.appendChild(frame);

      wrap.appendChild(overlay);
    }


    /* Masukkan ke stage */

    stage.appendChild(wrap);


    /* Hapus halaman lama */

    viewer.replaceChildren(stage);


    /* Render PDF */

    const context =
      canvas.getContext("2d");


    await page.render({

      canvasContext: context,

      viewport: viewport,

      transform:

        ratio !== 1

          ? [ratio, 0, 0, ratio, 0, 0]

          : null

    }).promise;


    /* Animasi */

    if (hasShownFirstPage) {

      wrap.classList.add(

        direction === "prev"

          ? "turn-prev"

          : "turn-next"

      );

    }


    hasShownFirstPage = true;


    /* Status tombol */

    prevButton.disabled =
      currentPage === 1;


    nextButton.disabled =
      currentPage === pdfDoc.numPages;


    pageStatus.textContent =
      "/ " + pdfDoc.numPages;


  }

  catch (error) {

    viewer.innerHTML = `

      <div id="message">

        <strong>
          Halaman tidak dapat ditampilkan.
        </strong>

        <br>

        Silakan muat ulang e-book.

      </div>

    `;


    console.error(error);

  }

  finally {

    loading.classList.remove("show");

    rendering = false;


    /* Render permintaan berikutnya */

    if (pendingPage) {

      const next =
        pendingPage;

      pendingPage = null;


      renderPage(
        next.number,
        next.direction
      );

    }

  }

}


/* =========================================
   MEMUAT PDF
========================================= */

async function loadPdf() {

  try {

    pdfDoc =
      await pdfjsLib
        .getDocument({
          url: PDF_URL
        })
        .promise;


    pageStatus.textContent =
      "/ " + pdfDoc.numPages;


    await renderPage(
      1,
      "next"
    );

  }

  catch (error) {

    viewer.innerHTML = `

      <div id="message">

        <strong>
          E-book tidak dapat dimuat
        </strong>

        <br><br>

        File PDF tidak dapat dimuat.

        <br>

        Pastikan file:

        <br><br>

        <b>
          Draft_Ebook_Rima_Lea_optimized.pdf
        </b>

        <br><br>

        berada di folder utama
        yang sama dengan
        <b>index.html</b>.

      </div>

    `;


    console.error(error);

  }

}


/* =========================================
   NAVIGASI
========================================= */

prevButton.onclick = () => {

  renderPage(
    currentPage - 1,
    "prev"
  );

};


nextButton.onclick = () => {

  renderPage(
    currentPage + 1,
    "next"
  );

};


/* INPUT NOMOR HALAMAN */

pageInput.onchange = () => {

  const selectedPage =
    Number(pageInput.value) || 1;


  renderPage(

    selectedPage,

    selectedPage < currentPage

      ? "prev"

      : "next"

  );

};


/* =========================================
   ZOOM
========================================= */

document.getElementById("zoomIn").onclick = () => {

  zoom =
    Math.min(
      1.8,
      zoom + 0.1
    );


  renderPage(
    currentPage,
    "next"
  );

};


document.getElementById("zoomOut").onclick = () => {

  zoom =
    Math.max(
      0.55,
      zoom - 0.1
    );


  renderPage(
    currentPage,
    "next"
  );

};


/* =========================================
   FULLSCREEN
========================================= */

document.getElementById("fullscreen").onclick = () => {

  if (!document.fullscreenElement) {

    document.documentElement
      .requestFullscreen?.();

  }

  else {

    document.exitFullscreen?.();

  }

};


/* =========================================
   RESPONSIVE RESIZE
========================================= */

let resizeTimer;

window.addEventListener(
  "resize",

  () => {

    clearTimeout(resizeTimer);

    resizeTimer =
      setTimeout(() => {

        if (pdfDoc) {

          renderPage(
            currentPage,
            "next"
          );

        }

      }, 200);

  }

);


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
  "keydown",

  event => {

    if (
      event.target === pageInput
    ) return;


    if (
      event.key === "ArrowRight"
    ) {

      renderPage(
        currentPage + 1,
        "next"
      );

    }


    if (
      event.key === "ArrowLeft"
    ) {

      renderPage(
        currentPage - 1,
        "prev"
      );

    }

  }

);


/* =========================================
   SWIPE MOBILE
========================================= */

let touchStartX = 0;


viewer.addEventListener(

  "touchstart",

  event => {

    touchStartX =
      event.changedTouches[0].screenX;

  },

  {
    passive: true
  }

);


viewer.addEventListener(

  "touchend",

  event => {

    const distance =

      event.changedTouches[0].screenX

      -

      touchStartX;


    if (
      Math.abs(distance) > 65
    ) {

      if (distance < 0) {

        renderPage(
          currentPage + 1,
          "next"
        );

      }

      else {

        renderPage(
          currentPage - 1,
          "prev"
        );

      }

    }

  },

  {
    passive: true
  }

);


/* =========================================
   MULAI
========================================= */

loadPdf();

</script>

</body>
</html>
