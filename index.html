<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-book Interaktif – Pedoman Monitoring SPJ</title>

<style>
:root{
  --navy:#17365d;
  --blue:#245b91;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#20242a;
  font-family:Arial,Helvetica,sans-serif;
}

#viewer{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:10px;
  perspective:1800px;
}

#pageStage{
  position:relative;
  flex:none;
  transform-style:preserve-3d;
  transform-origin:center center;
}

#pageWrap{
  position:relative;
  background:#fff;
  line-height:0;
  box-shadow:0 5px 24px #0005;
  overflow:hidden;
  backface-visibility:hidden;
  transform-style:preserve-3d;
  transform-origin:left center;
  will-change:transform,opacity,filter;
}

#pdfCanvas{
  display:block;
  max-width:none;
  height:auto;
}

/* FORM UPLOAD HALAMAN 13 */
#formOverlay{
  display:none;
  position:absolute;
  left:5.7%;
  top:10.5%;
  width:88.6%;
  height:84.5%;
  z-index:3;
  border:0;
  background:transparent;
  overflow:hidden;
}

#formOverlay.active{
  display:block;
}

#formFrame{
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  display:block;
  overflow:hidden;
}

/* TOMBOL DOWNLOAD HALAMAN 18 */
#downloadOverlay{
  position:absolute;
  top:8%;
  left:50%;
  transform:translateX(-50%);
  width:76%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  z-index:4;
  line-height:normal;
}

.download-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:38px;
  padding:10px 16px;
  background:#0757c9;
  color:#ffffff;
  text-decoration:none;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
  text-align:center;
  box-shadow:0 3px 8px rgba(7,87,201,.20);
  transition:all .2s ease;
}

.download-btn:hover{
  background:#0649a8;
  transform:translateY(-2px);
}

/* TOOLBAR */
#toolbar{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:10;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border-radius:12px;
  background:rgba(30,38,48,.76);
  backdrop-filter:blur(8px);
  color:#fff;
  line-height:1;
  box-shadow:0 2px 12px #0003;
}

#toolbar button{
  border:0;
  border-radius:6px;
  background:transparent;
  color:#fff;
  padding:7px 9px;
  font-size:18px;
  cursor:pointer;
}

#toolbar button:hover{
  background:#ffffff25;
}

#toolbar button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

#pageNum{
  width:44px;
  padding:6px 4px;
  text-align:center;
  border:1px solid #ffffff55;
  border-radius:5px;
  background:#ffffff20;
  color:#fff;
}

#pageStatus{
  font-size:12px;
  white-space:nowrap;
}

#message{
  color:#17365d;
  background:white;
  padding:22px;
  border-radius:8px;
  max-width:600px;
  font:14px/1.5 Arial,sans-serif;
}

#loading{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#20242a88;
  color:#fff;
  z-index:8;
  font-size:13px;
}

#loading.show{
  display:flex;
}

/* ANIMASI HALAMAN */
@keyframes pageTurnNext{
  0%{
    opacity:.35;
    transform:perspective(1400px) rotateY(-24deg) translateX(52px) scale(.985);
    filter:brightness(.72);
  }
  45%{
    opacity:.9;
    transform:perspective(1400px) rotateY(7deg) translateX(-8px) scale(.995);
    filter:brightness(1.08);
  }
  100%{
    opacity:1;
    transform:perspective(1400px) rotateY(0) translateX(0) scale(1);
    filter:brightness(1);
  }
}

@keyframes pageTurnPrev{
  0%{
    opacity:.35;
    transform:perspective(1400px) rotateY(24deg) translateX(-52px) scale(.985);
    filter:brightness(.72);
  }
  45%{
    opacity:.9;
    transform:perspective(1400px) rotateY(-7deg) translateX(8px) scale(.995);
    filter:brightness(1.08);
  }
  100%{
    opacity:1;
    transform:perspective(1400px) rotateY(0) translateX(0) scale(1);
    filter:brightness(1);
  }
}

#pageWrap.turn-next{
  animation:pageTurnNext .72s cubic-bezier(.2,.75,.25,1) both;
}

#pageWrap.turn-prev{
  animation:pageTurnPrev .72s cubic-bezier(.2,.75,.25,1) both;
}

/* ================================
   RESPONSIVE TOMBOL DOWNLOAD
   ================================ */

/* LAPTOP / LAYAR MENENGAH */
@media (min-width: 601px) and (max-width: 1366px){

  #downloadOverlay{
    width:70%;
    top:8%;
    gap:10px;
  }

  .download-btn{
    min-height:32px;
    padding:7px 12px;
    font-size:10px;
    border-radius:6px;
  }
}


/* MOBILE */
@media(max-width:600px){

  #viewer{
    padding:2px;
  }

  #toolbar{
    bottom:6px;
    gap:3px;
    padding:5px 7px;
  }

  #toolbar button{
    padding:6px;
    font-size:16px;
  }

  #formOverlay{
    left:3%;
    width:94%;
    top:10%;
    height:85%;
  }

  /* Tombol download pada halaman checklist */
  #downloadOverlay{
    width:88%;
    top:7.5%;
    gap:6px;
  }

  .download-btn{
    min-height:30px;
    padding:6px 7px;
    font-size:8px;
    line-height:1.2;
    border-radius:5px;
  }
}

/* TAMPILAN BUKU TERBUKA DUA HALAMAN */
#viewer{padding:28px 5vw 92px;background:radial-gradient(ellipse at center,#49698f 0%,#263c5b 55%,#17283f 100%)}
#bookShell{position:relative;display:flex;align-items:stretch;justify-content:center;padding:14px 18px 22px;border-radius:14px;background:linear-gradient(180deg,#19375e,#0b1e36);box-shadow:0 28px 55px #0008,0 5px 12px #0008;max-width: min(94vw,1500px);max-height:calc(100vh - 130px)}
#bookShell:before{content:"";position:absolute;inset:8px 10px 14px;border-radius:8px;background:linear-gradient(90deg,#d6dce5 0,#fff 2%,#e7edf5 3%,#fff 50%,#dce4ee 97%,#fff 99%);box-shadow:inset 0 0 10px #53657b66;pointer-events:none}
#bookSpread{position:relative;z-index:1;display:flex;align-items:stretch;max-width:100%;max-height:100%;filter:drop-shadow(0 9px 12px #0005)}
.pageSlot{position:relative;overflow:hidden;background:#fff;flex:none;box-shadow:inset 0 0 14px #203b5c18}
.pageSlot.leftPage{border-radius:5px 0 0 5px;box-shadow:inset -13px 0 18px -17px #12233d, inset 0 0 8px #34506a22}
.pageSlot.rightPage{border-radius:0 5px 5px 0;box-shadow:inset 13px 0 18px -17px #12233d,inset 0 0 8px #34506a22}
.pageSlot canvas{display:block;width:100%;height:100%}
#bookSpine{position:absolute;z-index:4;top:0;bottom:0;left:50%;width:22px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,#172b46aa,#fff6 35%,#273d59aa 70%,transparent);opacity:.45}
.pageSlot.singlePage{border-radius:5px;box-shadow:0 0 18px #0003}
#formOverlay{left:5.7%;top:10.5%;width:88.6%;height:84.5%;}
#downloadOverlay{top:8%}
#toolbar{background:rgba(13,35,63,.88);border:1px solid #ffffff35;box-shadow:0 8px 28px #0005;padding:9px 14px;gap:9px}
#toolbar button{border-radius:8px}
#pageNum{background:#ffffff20}
@media(max-width:700px){
 #viewer{padding:10px 5px 78px}
 #bookShell{padding:7px 6px 12px;max-width:98vw;max-height:calc(100vh - 100px)}
 #bookShell:before{inset:4px 4px 7px}
 #bookSpine{display:none}
 #toolbar{max-width:96vw;gap:2px;padding:5px 6px}
 #toolbar button{padding:5px;font-size:15px}
 #pageStatus{font-size:10px}
}

</style>
</head>

<body>

<div id="viewer">
  <div id="message">E-book sedang dimuat…</div>
</div>

<div id="loading">Membuka halaman…</div>

<div id="toolbar" aria-label="Navigasi e-book">
  <button id="prev" type="button" title="Halaman sebelumnya">‹</button>
  <input id="pageNum" type="number" min="1" value="1">
  <span id="pageStatus">/ 31</span>
  <button id="next" type="button" title="Halaman berikutnya">›</button>
  <button id="zoomOut" type="button" title="Perkecil">−</button>
  <button id="zoomIn" type="button" title="Perbesar">+</button>
  <button id="fullscreen" type="button" title="Layar penuh">⛶</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
/* KONFIGURASI FILE */
const PDF_URL='./Draft_Ebook_Rima_Lea_optimized.pdf';
const FORM_URL='https://script.google.com/macros/s/AKfycbw9HnoBDY_ta8zLam3T2tK5758b3kGou-kjzuVXFD7Afhle8LrHKdb3dXTPHWgnjqGc/exec';
const CHECKLIST_FILE='./Format_Checklist.docx';
const BUKTI_BERKAS_FILE='./Format_Bukti_Pengumpulan_berkas.docx';

const pdfjsLib=window.pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc=null;
let currentPage=1;
let zoom=1;
let rendering=false;
let pendingPage=null;
let hasShownFirstPage=false;
let renderToken=0;
const pageCache=new Map();
const MAX_CACHE_PAGES=6;

const viewer=document.getElementById('viewer');
const pageInput=document.getElementById('pageNum');
const pageStatus=document.getElementById('pageStatus');
const loading=document.getElementById('loading');
const isMobile=()=>window.matchMedia('(max-width:700px)').matches;
const spreadStep=()=>isMobile()?1:2;

function getSpreadStart(number){
  const n=Math.max(1,Math.min(pdfDoc.numPages,Number(number)||1));
  return isMobile()?n:(n%2===0?Math.max(1,n-1):n);
}

function getPageScale(page,count){
  const unit=page.getViewport({scale:1});
  const availableW=Math.max(240,viewer.clientWidth-40);
  const availableH=Math.max(280,viewer.clientHeight-40);
  return Math.min(availableW/(unit.width*count),availableH/unit.height)*zoom;
}

function cacheKey(pageNo,scale){return pageNo+'@'+scale.toFixed(3);}

async function renderToCache(pageNo,scale){
  const key=cacheKey(pageNo,scale);
  if(pageCache.has(key)){
    const value=pageCache.get(key);
    pageCache.delete(key); pageCache.set(key,value);
    return value;
  }
  const page=await pdfDoc.getPage(pageNo);
  const viewport=page.getViewport({scale});
  const ratio=Math.min(window.devicePixelRatio||1,1.75);
  const canvas=document.createElement('canvas');
  canvas.width=Math.ceil(viewport.width*ratio);
  canvas.height=Math.ceil(viewport.height*ratio);
  canvas.style.width=viewport.width+'px';
  canvas.style.height=viewport.height+'px';
  await page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport,transform:ratio!==1?[ratio,0,0,ratio,0,0]:null}).promise;
  const item={canvas,width:viewport.width,height:viewport.height};
  pageCache.set(key,item);
  while(pageCache.size>MAX_CACHE_PAGES){
    const oldest=pageCache.keys().next().value;
    const removed=pageCache.get(oldest);
    if(removed?.canvas){removed.canvas.width=0;removed.canvas.height=0;}
    pageCache.delete(oldest);
  }
  return item;
}

function addPageOverlay(slot,pageNo){
  if(pageNo===13){
    const overlay=document.createElement('div');overlay.id='formOverlay';overlay.className='active';
    const frame=document.createElement('iframe');frame.id='formFrame';frame.src=FORM_URL;frame.title='Formulir Pengumpulan Dokumen SPJ';frame.setAttribute('scrolling','no');
    overlay.appendChild(frame);slot.appendChild(overlay);
  }
  if(pageNo===18){
    const overlay=document.createElement('div');overlay.id='downloadOverlay';
    const a=document.createElement('a');a.href=CHECKLIST_FILE;a.download='Format_Checklist.docx';a.className='download-btn';a.textContent='↓ Download Format Checklist';
    const b=document.createElement('a');b.href=BUKTI_BERKAS_FILE;b.download='Format_Bukti_Pengumpulan_berkas.docx';b.className='download-btn';b.textContent='↓ Download Format Bukti Pengumpulan Berkas';
    overlay.append(a,b);slot.appendChild(overlay);
  }
}

async function drawCachedPage(pageNo,slot,scale){
  const item=await renderToCache(pageNo,scale);
  slot.style.width=item.width+'px';slot.style.height=item.height+'px';
  const visible=document.createElement('canvas');
  visible.width=item.canvas.width;visible.height=item.canvas.height;
  visible.style.width=item.width+'px';visible.style.height=item.height+'px';
  visible.getContext('2d',{alpha:false}).drawImage(item.canvas,0,0);
  slot.appendChild(visible);
  addPageOverlay(slot,pageNo);
}

function preloadSpread(start,scale){
  if(!pdfDoc)return;
  const count=isMobile()?1:2;
  const candidates=[start+count,start+count+1,start-count,start-count+1]
    .filter(n=>n>=1&&n<=pdfDoc.numPages);
  const unique=[...new Set(candidates)];
  /* Preload tidak menghalangi tampilan halaman yang sedang dibuka. */
  unique.forEach(n=>renderToCache(n,scale).catch(err=>console.warn('Preload halaman '+n,err)));
}

async function renderPage(number,direction='next'){
  if(!pdfDoc)return;
  if(rendering){pendingPage={number,direction};return;}
  rendering=true;
  const myToken=++renderToken;
  const start=getSpreadStart(number);
  const second=(!isMobile()&&start<pdfDoc.numPages)?start+1:null;
  currentPage=start;
  pageInput.value=currentPage;
  pageInput.max=pdfDoc.numPages;

  /* Overlay hanya muncul pada pemuatan pertama; navigasi berikutnya tidak ditutupi. */
  if(!hasShownFirstPage)loading.classList.add('show');

  try{
    const firstPage=await pdfDoc.getPage(start);
    const count=second?2:1;
    const scale=getPageScale(firstPage,count);
    const shell=document.createElement('div');shell.id='bookShell';
    const spread=document.createElement('div');spread.id='bookSpread';
    const left=document.createElement('div');left.className='pageSlot '+(count===1?'singlePage':'leftPage');
    spread.appendChild(left);
    const tasks=[drawCachedPage(start,left,scale)];
    if(second){
      const right=document.createElement('div');right.className='pageSlot rightPage';spread.appendChild(right);
      tasks.push(drawCachedPage(second,right,scale));
      const spine=document.createElement('div');spine.id='bookSpine';spread.appendChild(spine);
    }
    await Promise.all(tasks);
    if(myToken!==renderToken)return;
    shell.appendChild(spread);
    viewer.replaceChildren(shell);
    pageStatus.textContent=second?`${start}–${second} / ${pdfDoc.numPages}`:`${start} / ${pdfDoc.numPages}`;
    document.getElementById('prev').disabled=start===1;
    document.getElementById('next').disabled=(second||start)===pdfDoc.numPages;
    if(hasShownFirstPage){
      spread.style.animation=direction==='prev'?'pageTurnPrev .42s ease both':'pageTurnNext .42s ease both';
    }
    hasShownFirstPage=true;
    preloadSpread(start,scale);
  }catch(err){
    viewer.innerHTML='<div id="message">Halaman tidak dapat ditampilkan. Silakan muat ulang e-book.</div>';
    console.error(err);
  }finally{
    loading.classList.remove('show');
    rendering=false;
    if(pendingPage){const next=pendingPage;pendingPage=null;renderPage(next.number,next.direction);}
  }
}

async function loadPdf(){
  try{
    pdfDoc=await pdfjsLib.getDocument({url:PDF_URL}).promise;
    pageStatus.textContent='/ '+pdfDoc.numPages;
    await renderPage(1,'next');
  }catch(error){
    viewer.innerHTML='<div id="message"><strong>PDF belum dapat dimuat.</strong><br>Pastikan file PDF berada satu folder dengan index.html.</div>';
    console.error(error);
  }
}

document.getElementById('prev').onclick=()=>renderPage(currentPage-spreadStep(),'prev');
document.getElementById('next').onclick=()=>renderPage(currentPage+spreadStep(),'next');
pageInput.onchange=()=>renderPage(Number(pageInput.value)||1,Number(pageInput.value)<currentPage?'prev':'next');
document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(1.8,zoom+.1);pageCache.clear();renderPage(currentPage,'next');};
document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.55,zoom-.1);pageCache.clear();renderPage(currentPage,'next');};
document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();};
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(pdfDoc){pageCache.clear();renderPage(currentPage,'next');}},180);});
document.addEventListener('keydown',e=>{if(e.target===pageInput)return;if(e.key==='ArrowRight')renderPage(currentPage+spreadStep(),'next');if(e.key==='ArrowLeft')renderPage(currentPage-spreadStep(),'prev');});
let touchStartX=0;
viewer.addEventListener('touchstart',e=>{touchStartX=e.changedTouches[0].screenX;},{passive:true});
viewer.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchStartX;if(Math.abs(dx)>65)renderPage(currentPage+(dx<0?spreadStep():-spreadStep()),dx<0?'next':'prev');},{passive:true});
loadPdf();
</script>

</body>
</html>
